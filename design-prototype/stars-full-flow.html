<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光映照 · 完整页面流 · 3 Tab 全流程</title>
<meta name="description" content="星光映照塔罗小程序 — 今日 × 神谕 × 我的 三 Tab 完整页面流，16+ 屏全流程交互，一个主角原则。E3 奶油疗愈语言。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   星光映照 · 完整页面流
   设计铁律：每一页只有一个主角，其余都是注脚与入口。
   视觉：E3 奶油疗愈（#FAF6EF / 雾粉 #E8C4BE / 细金 #C9A97C / 衬线）
   路由：React state 页面栈（主屏 ↔ 二级页 前进后退 + TabBar 切换）
   页 04 能量详情：今日屏能量注脚可点 → 4 维度走心解读，chips 页内切换
   插画资产：assets/web/ 真实水彩（内联 base64）
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#29231E;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#EFE4D6}
#root{min-height:100%}
::selection{background:rgba(232,196,190,.45)}
img{-webkit-user-drag:none;user-select:none}
textarea,input,button{font-family:inherit}

/* ── 展示舞台（暗底 · 单屏居中） ── */
.stage{max-width:1100px;margin:0 auto;padding:48px 24px 90px;text-align:center}
.stage h1{font-family:'Noto Serif SC',serif;font-weight:500;font-size:28px;letter-spacing:10px;color:#F0E2D0;margin-bottom:8px}
.stage .sub{font-size:11px;color:rgba(201,169,124,.85);letter-spacing:4px;margin-bottom:8px}
.stage .meta{font-size:11px;color:rgba(239,228,214,.32);letter-spacing:1px;margin-bottom:42px}
.stage .hashlist{font-size:10.5px;color:rgba(239,228,214,.4);letter-spacing:1px;line-height:2;margin-top:30px}
.stage .note{margin-top:36px;font-family:'Noto Serif SC',serif;font-size:12.5px;color:rgba(240,226,208,.55);letter-spacing:2px;line-height:2.1}
.stage .note b{color:#E8C4BE;font-weight:500}
.stage .note em{font-style:normal;color:rgba(201,169,124,.9)}
.scale-box{width:390px;height:832px;margin:0 auto;position:relative}
.scale-box .phone-holder{position:absolute;left:0;top:0;transform:scale(1.3);transform-origin:top left;width:300px;height:640px}

/* ═══════════════════ E3 奶油疗愈 · 设计令牌 ═══════════════════ */
.sys-e3{
  --cream:#FAF6EF; --cream-hi:#FFFDF8; --paper:#F2ECDF;
  --pink:#E8C4BE; --pink-deep:#DCA9A1; --pink-ink:#B08A82;
  --gold:#C9A97C; --gold-deep:#B08F52;
  --line:rgba(201,169,124,.28); --line-soft:rgba(201,169,124,.38);
  --ink:#3D3A36; --ink-soft:#8A8478; --ink-faint:#B0AA9C;
  --serif:'Noto Serif SC',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --num:'EB Garamond','Noto Serif SC',serif;
  --shadow:0 2px 10px rgba(61,58,54,.06);
  --hi:inset 0 1px 0 rgba(255,255,255,.6);
}
.sys-e3 .screen{
  background:var(--cream);color:var(--ink);position:relative;overflow:hidden;
  font-family:var(--serif);
  width:300px;height:640px;border-radius:34px;
  box-shadow:0 34px 70px rgba(0,0,0,.6);
}
.sys-e3 .screen.anim{animation:pageIn .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes pageIn{0%{opacity:0;transform:translateY(10px) scale(.992)}100%{opacity:1;transform:translateY(0) scale(1)}}
/* 低饱和水彩底色氛围（仅为底色，主角是真实插画牌面） */
.sys-e3 .wash{position:absolute;border-radius:50%;pointer-events:none;filter:blur(38px);z-index:0}

/* ── 微信胶囊（奶油浅底 -> 白色胶囊深色 icon） ── */
.wxcapsule{
  position:absolute;top:13px;right:8px;z-index:30;display:flex;gap:4px;pointer-events:none;
}
.wxcapsule .cap{
  width:40px;height:32px;border-radius:7px;
  background:rgba(255,253,248,.92);border:0.5px solid rgba(201,169,124,.3);
  box-shadow:0 2px 6px rgba(61,58,54,.05);
  display:flex;align-items:center;justify-content:center;
}
.wxcapsule .cap svg{fill:#3D3A36}
.wxcapsule .cap:first-child{flex-direction:column;gap:3px}
.wxcapsule .cap:first-child span{display:block;width:3px;height:3px;border-radius:50%;background:#3D3A36}
.wxcapsule .cap .circle{width:15px;height:15px;border-radius:50%;border:1.5px solid #3D3A36}

/* ── 二级页顶栏：返回（左）· 标题（中）· 胶囊避让 ── */
.nav{position:relative;z-index:6;display:flex;align-items:center;padding:40px 6px 0 10px}
.nav .back{
  width:52px;height:44px;display:flex;align-items:center;gap:1px;flex-shrink:0;cursor:pointer;
  font-family:var(--sans);font-size:12px;color:var(--ink-soft);letter-spacing:.5px;
}
.nav .back:active{opacity:.6}
.nav .nt{flex:1;text-align:center;font-size:15px;letter-spacing:2.5px;color:var(--ink);margin-right:56px;white-space:nowrap}
.pbody{position:relative;z-index:2;flex:1;overflow-y:auto;scrollbar-width:none;padding:2px 18px 26px}
.pbody::-webkit-scrollbar{display:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column}

/* ── 通用小块 ── */
.sec-label{font-family:var(--sans);font-size:11px;letter-spacing:2.5px;color:var(--gold-deep);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.sec-label::before{content:'';width:14px;height:1px;background:rgba(201,169,124,.5)}
.card-soft{
  background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:16px;
  box-shadow:var(--shadow),var(--hi);padding:13px 14px;margin-bottom:9px;
}
.card-soft h4{font-size:13px;letter-spacing:1.5px;color:var(--ink);margin-bottom:6px;font-weight:500}
.card-soft p{font-family:var(--sans);font-size:11.5px;line-height:1.75;color:var(--ink-soft);letter-spacing:.3px}
.row-sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);line-height:1.6;padding:4px 0}

/* ── 主 CTA（44px+ 点击目标） ── */
.cta{
  display:flex;align-items:center;justify-content:center;gap:7px;height:46px;border-radius:999px;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#FFFDF8;
  font-family:var(--serif);font-size:14px;letter-spacing:3px;cursor:pointer;
  box-shadow:0 6px 16px rgba(176,143,82,.35),var(--hi);user-select:none;
  transition:transform .15s ease,opacity .15s ease;margin-top:12px;
}
.cta:active{transform:scale(.975)}
.cta.off{background:var(--paper);color:var(--ink-faint);box-shadow:none;pointer-events:none}
.cta.ghost{background:transparent;border:1px solid var(--line-soft);color:var(--gold-deep);box-shadow:none;height:44px}
.cta.pink{background:linear-gradient(135deg,var(--pink-deep),var(--pink-ink));box-shadow:0 6px 16px rgba(176,138,130,.32)}
.cta.done{background:var(--paper);color:var(--ink-faint);box-shadow:none}

/* ── TabBar：今日（选中）/ 神谕 / 我的 ── */
.tabbar{
  position:absolute;left:14px;right:14px;bottom:8px;height:52px;border-radius:20px;z-index:5;
  display:flex;align-items:center;justify-content:space-around;
  background:var(--cream-hi);border:.5px solid rgba(201,169,124,.26);
  box-shadow:var(--shadow),var(--hi);
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;height:100%;cursor:pointer;user-select:none}
.tab:active{opacity:.75}
.tab span{font-family:var(--sans);font-size:10.5px;letter-spacing:2px;color:var(--ink-faint)}
.tab.on span{color:var(--ink);font-weight:500}
.tab .tdot{width:3.5px;height:3.5px;border-radius:50%;background:transparent}
.tab.on .tdot{background:var(--gold)}

/* ── Toast ── */
.toast{
  position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:80;
  background:rgba(61,58,54,.93);color:#F5EDDD;
  font-family:var(--sans);font-size:12px;letter-spacing:1.5px;
  padding:10px 18px;border-radius:999px;white-space:nowrap;
  box-shadow:0 8px 22px rgba(61,58,54,.28);
  animation:toastIn .28s ease both;pointer-events:none;
}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(6px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── 小弹层（明日预告） ── */
.sheet-wrap{position:absolute;inset:0;z-index:60;background:rgba(41,35,30,.4);display:flex;align-items:flex-end;animation:dimIn .25s ease both}
@keyframes dimIn{0%{opacity:0}100%{opacity:1}}
.sheet{
  width:100%;background:var(--cream-hi);border-radius:26px 26px 0 0;
  padding:20px 22px 30px;text-align:center;animation:sheetUp .32s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes sheetUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
.sheet .s-title{font-size:16px;letter-spacing:4px;color:var(--ink);margin-top:12px}
.sheet .s-sub{font-family:var(--sans);font-size:12px;color:var(--ink-soft);letter-spacing:1px;margin-top:8px;line-height:1.7}
.sheet .s-btn{height:44px;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#FFFDF8;font-size:13.5px;letter-spacing:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:18px;box-shadow:0 6px 16px rgba(176,143,82,.3)}
.sheet .s-btn:active{transform:scale(.975)}
.sheet .s-tag{font-family:var(--sans);font-size:10px;letter-spacing:3px;color:var(--gold-deep);margin-top:12px}

/* ═══════════════════════════════════════════════════════════════
   页 01 · 今日主屏（已认可版 + 可点击）
   ═══════════════════════════════════════════════════════════════ */
.topbar{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:38px 18px 0}
.brand{font-family:var(--serif);font-weight:500;font-size:14.5px;color:var(--ink);letter-spacing:5px}
.date-row{display:flex;align-items:center;gap:6px;margin-top:5px;font-family:var(--num);font-size:10px;color:var(--ink-faint);letter-spacing:1.5px}
.gold-dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--gold);flex-shrink:0}
.zodiac{
  display:inline-flex;align-items:center;height:18px;padding:0 9px;border-radius:999px;
  background:var(--cream-hi);border:.5px solid rgba(201,169,124,.38);
  font-family:var(--sans);font-size:9.5px;color:var(--gold-deep);letter-spacing:1.5px;
  margin-top:2px;box-shadow:var(--hi);user-select:none;
}
.sky-note{
  position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:6px;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px;
}
.card-zone{position:relative;z-index:2;height:291px;margin-top:5px}
.halo{
  position:absolute;left:50%;top:50%;width:212px;height:212px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(201,169,124,.30),rgba(201,169,124,0) 72%);
  animation:haloBreathe 6s ease-in-out infinite;
}
@keyframes haloBreathe{0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.sp{position:absolute;pointer-events:none;animation:twinkle 4.2s ease-in-out infinite}
.sp.s1{right:26px;top:4px}
.sp.s2{left:20px;bottom:8px;animation-delay:1.1s;opacity:.75}
@keyframes twinkle{0%,100%{opacity:.32;transform:scale(.85) rotate(0)}50%{opacity:.85;transform:scale(1.1) rotate(14deg)}}
.mount{position:absolute;left:0;right:0;top:2px;display:flex;justify-content:center;animation:riseIn .95s cubic-bezier(.2,.7,.3,1) .12s both}
@keyframes riseIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
.float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flip3d{perspective:900px}
.mat{
  padding:6px;border-radius:19px;background:var(--cream-hi);cursor:pointer;
  border:1px solid rgba(201,169,124,.34);
  box-shadow:0 14px 32px rgba(61,58,54,.14),0 0 0 .5px rgba(201,169,124,.16),var(--hi);
  transition:transform .18s ease;
}
.mat:active{transform:scale(.965)}
.mat.go{transform:rotateY(180deg);transition:transform .62s cubic-bezier(.35,.1,.25,1)}
.art{
  position:relative;width:190px;height:270px;border-radius:13px;overflow:hidden;
  border:.5px solid rgba(201,169,124,.3);transform-style:preserve-3d;
}
.art::after{content:'';position:absolute;left:0;right:0;top:0;height:34%;pointer-events:none;z-index:2;background:linear-gradient(180deg,rgba(255,253,248,.30),rgba(255,253,248,0))}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block;backface-visibility:hidden}
.art .artback{
  position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;z-index:3;
  background:var(--paper);
}
.art .artback img{width:100%;height:100%;object-fit:cover}
.card-name{position:relative;z-index:3;display:flex;align-items:baseline;justify-content:center;gap:9px;margin-top:4px}
.card-name .cn{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:3px;color:var(--ink)}
.card-name .dot{width:3px;height:3px;border-radius:50%;background:var(--gold)}
.card-name .en{font-family:var(--num);font-size:10px;letter-spacing:4px;color:var(--gold-deep)}
.card-phrase{position:relative;z-index:3;text-align:center;margin-top:4px;font-size:13.5px;letter-spacing:1px;color:var(--ink-soft)}
.energy{
  position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:7px;
  margin:8px 14px 0;height:26px;border-radius:999px;
  background:rgba(201,169,124,.08);border:.5px solid rgba(201,169,124,.2);
}
.energy .eg-label{font-family:var(--sans);font-size:9.5px;color:var(--gold);letter-spacing:2px}
.energy .sep{width:3px;height:3px;border-radius:50%;background:rgba(201,169,124,.45);flex-shrink:0}
.energy .eg{font-family:var(--sans);font-size:9.5px;color:var(--ink-soft);letter-spacing:.5px;white-space:nowrap}
.energy .eg i{font-family:var(--num);font-style:normal;font-size:11px;color:var(--gold-deep);margin-left:2px}
.energy .eg.hot{color:var(--pink-ink)}
.energy .eg.hot i{color:var(--pink-ink)}
.link{position:relative;z-index:3;margin-top:7px;text-align:center}
.link p{font-size:12.5px;letter-spacing:1px;line-height:1.6;color:var(--ink-soft)}
.link p:first-child{color:var(--ink)}
.link em{font-style:normal;color:var(--pink-ink)}
.link .x{font-family:var(--num);color:var(--gold-deep);font-size:13px;margin:0 2px}
.tomorrow{position:relative;z-index:6;margin-top:4px}
.tline{width:132px;border-top:1px dashed rgba(201,169,124,.4);margin:0 auto}
.trow{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;
  font-family:var(--serif);font-size:10.5px;color:var(--gold);letter-spacing:2.5px;cursor:pointer;
  height:38px;user-select:none;
}
.trow:active{opacity:.6}
.mini-card{
  width:96px;height:134px;border-radius:11px;margin:2px auto 0;
  background:linear-gradient(160deg,#F6EFE2,#EFE3CD);border:.5px solid rgba(201,169,124,.45);
  box-shadow:0 10px 22px rgba(61,58,54,.16),var(--hi);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.mini-card .star{color:var(--gold-deep);font-size:17px}
.mini-card .mcn{font-size:18px;letter-spacing:4px;color:var(--ink)}
.mini-card .men{font-family:var(--num);font-size:8px;letter-spacing:2.5px;color:var(--ink-faint)}

/* ═══════════════════════════════════════════════════════════════
   页 02 · 抽牌后状态（主角=牌）
   ═══════════════════════════════════════════════════════════════ */
.drawn-zone{position:relative;z-index:2;height:270px;margin-top:6px}
.drawn-zone .mat{width:178px;margin:0 auto}
.drawn-zone .art{width:166px;height:248px}
.drawn-zone .halo{width:190px;height:190px}
.drawn-zone .mount{animation:none}
.flipIn{animation:flipIn .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes flipIn{0%{opacity:0;transform:rotateY(85deg) scale(.92)}100%{opacity:1;transform:rotateY(0) scale(1)}}
.drawn-name{display:flex;align-items:baseline;justify-content:center;gap:9px;margin-top:9px}
.drawn-name .cn{font-size:19px;letter-spacing:3px;font-weight:500}
.drawn-name .dot{width:3px;height:3px;border-radius:50%;background:var(--gold)}
.drawn-name .en{font-family:var(--num);font-size:9.5px;letter-spacing:4px;color:var(--gold-deep)}
.drawn-phrase{text-align:center;margin-top:5px;font-size:13px;letter-spacing:1px;color:var(--ink-soft)}
.see-detail{
  display:flex;align-items:center;justify-content:center;gap:5px;height:44px;margin:13px 14px 0;
  border-radius:999px;border:1px solid var(--line-soft);background:var(--cream-hi);
  font-size:12.5px;letter-spacing:3px;color:var(--gold-deep);cursor:pointer;box-shadow:var(--hi);
}
.see-detail:active{transform:scale(.975)}
.drawn-foot{position:relative;z-index:3;text-align:center;margin-top:10px;font-size:11px;color:var(--ink-faint);letter-spacing:2px}

/* ═══════════════════════════════════════════════════════════════
   页 03 · 牌语详解（主角=牌意教学）
   ═══════════════════════════════════════════════════════════════ */
.detail-hero{display:flex;align-items:center;gap:14px;background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow),var(--hi);margin-top:6px}
.detail-hero .dh-art{width:66px;height:98px;border-radius:9px;overflow:hidden;border:.5px solid rgba(201,169,124,.35);flex-shrink:0;position:relative}
.detail-hero .dh-art img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.detail-hero .dh-name{font-size:17px;letter-spacing:2.5px;color:var(--ink)}
.detail-hero .dh-en{font-family:var(--num);font-size:9.5px;letter-spacing:3.5px;color:var(--gold-deep);margin-top:3px}
.detail-hero .dh-line{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);line-height:1.65;margin-top:7px;letter-spacing:.3px}
.sym-row{display:flex;gap:11px;align-items:flex-start;padding:9px 0}
.sym-row .sym-ic{width:30px;height:30px;border-radius:10px;background:rgba(201,169,124,.12);border:.5px solid rgba(201,169,124,.28);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;color:var(--gold-deep)}
.sym-row .sym-t{font-size:12px;letter-spacing:1px;color:var(--ink);margin-bottom:2px}
.sym-row .sym-d{font-family:var(--sans);font-size:11.5px;line-height:1.65;color:var(--ink-soft)}
.ask-card{background:rgba(232,196,190,.16);border:.5px solid rgba(176,138,130,.35);border-radius:16px;padding:13px 14px;margin-top:14px}
.ask-card .aq{font-size:12.5px;letter-spacing:.5px;line-height:1.8;color:var(--pink-ink)}
.ask-card .aq-label{font-family:var(--sans);font-size:10.5px;letter-spacing:3px;color:var(--pink-deep);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.do-card{border:1px dashed rgba(176,143,82,.55);border-radius:16px;padding:13px 14px;margin-top:10px;background:rgba(201,169,124,.07)}
.do-card .dq{font-size:12.5px;letter-spacing:.5px;line-height:1.8;color:var(--ink-soft)}
.do-card .dq-label{font-family:var(--sans);font-size:10.5px;letter-spacing:3px;color:var(--gold-deep);margin-bottom:5px;display:flex;align-items:center;gap:6px}

/* ═══════════════════════════════════════════════════════════════
   页 04 · 能量详情（主角=当前维度解读）
   今日屏能量注脚 → 点击进入；chips 页内切换维度
   ═══════════════════════════════════════════════════════════════ */
/* 今日屏能量注脚 → 可点击项（hover 反馈） */
.energy{gap:5px}
.energy .eg.go{cursor:pointer;padding:2px 4px;margin:0 -2px;border-radius:7px;transition:background .15s ease}
.energy .eg.go:hover{background:rgba(201,169,124,.18)}
.energy .eg.go:active{background:rgba(201,169,124,.32)}
/* 维度切换 chips（4 个 · 选中态随维度色调） */
.e-chips{display:flex;gap:6px;margin-top:6px}
.e-chip{
  flex:1;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:11px;letter-spacing:1.5px;color:var(--ink-faint);
  background:var(--cream-hi);border:.5px solid rgba(201,169,124,.22);
  cursor:pointer;user-select:none;transition:transform .15s ease,box-shadow .15s ease;
}
.e-chip:active{transform:scale(.96)}
.e-chip.on{color:#FFFDF8;border-color:transparent;font-weight:500;box-shadow:0 3px 10px rgba(61,58,54,.14)}
/* 能量主角卡：大数字 + 渐变能量条 */
.e-hero{
  background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:20px;
  box-shadow:var(--shadow),var(--hi);padding:18px 16px 14px;margin-top:12px;text-align:center;
}
.e-hero .e-top{display:flex;align-items:baseline;justify-content:center;gap:8px}
.e-hero .e-name{font-size:15px;letter-spacing:3px;color:var(--ink)}
.e-hero .e-en{font-family:var(--num);font-size:9px;letter-spacing:3px;color:var(--ink-faint)}
.e-hero .e-num{font-family:var(--num);font-size:54px;line-height:1.1;margin-top:4px;font-weight:500}
.e-hero .e-num small{font-size:13px;letter-spacing:2px;margin-left:4px;color:var(--ink-faint);font-family:var(--sans)}
.e-bar{height:8px;border-radius:999px;margin:10px 10px 0;position:relative;overflow:visible}
.e-bar .fill{height:100%;border-radius:999px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.e-bar .fill::after{
  content:'';position:absolute;right:-1px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;border-radius:50%;background:var(--cream-hi);
  border:2px solid rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(61,58,54,.28);
}
.e-note{font-family:var(--sans);font-size:10px;color:var(--ink-faint);letter-spacing:1.5px;margin-top:10px}
/* 走心解读（主角文案） */
.e-read .para{
  font-family:var(--sans);font-size:12px;line-height:1.95;letter-spacing:.4px;
  color:var(--ink-soft);margin-bottom:10px;
}
.e-read .para:last-of-type{margin-bottom:12px}
.e-read .para.p1{color:var(--ink);font-family:var(--serif);font-size:12.5px;letter-spacing:.6px}
.e-read .line{
  font-family:var(--serif);font-size:13px;letter-spacing:1px;line-height:1.8;color:var(--gold-deep);
  padding:11px 14px;border-radius:14px;background:rgba(201,169,124,.08);
  border:.5px solid rgba(201,169,124,.25);text-align:center;
}
.e-read .line::before{content:'✦ ';color:var(--gold)}
/* 与今日牌的关联：一行小字 */
.e-card-link{
  text-align:center;font-family:var(--sans);font-size:10.5px;color:var(--gold-deep);
  letter-spacing:1.5px;margin-top:12px;line-height:1.9;
}
.e-card-link b{font-weight:500;color:var(--ink-soft);letter-spacing:1px}

/* ═══════════════════════════════════════════════════════════════
   页 05 · 神谕主屏（主角=三要素）
   ═══════════════════════════════════════════════════════════════ */
.oracle-head{position:relative;z-index:3;text-align:center;margin-top:26px}
.oracle-head .oh-en{font-family:var(--num);font-size:9.5px;letter-spacing:6px;color:var(--gold-deep)}
.oracle-head h2{font-size:20px;letter-spacing:5px;font-weight:500;margin-top:6px}
.oracle-head p{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);letter-spacing:2px;margin-top:7px}
.ele-card{
  position:relative;z-index:3;display:flex;align-items:center;gap:12px;
  background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:18px;
  padding:11px 13px;margin:10px 18px 0;cursor:pointer;box-shadow:var(--shadow),var(--hi);
  transition:transform .15s ease;
}
.ele-card:active{transform:scale(.98)}
.ele-card .ele-ic{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(145deg,rgba(232,196,190,.5),rgba(201,169,124,.3));
  border:.5px solid rgba(201,169,124,.4);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--pink-ink);
}
.ele-card .ele-tx{flex:1;min-width:0}
.ele-card .ele-n{font-size:14px;letter-spacing:2px;color:var(--ink)}
.ele-card .ele-l{font-family:var(--sans);font-size:11px;color:var(--ink-soft);line-height:1.55;margin-top:3px;letter-spacing:.3px}
.ele-card .ele-go{color:var(--ink-faint);font-size:15px;font-family:var(--sans);flex-shrink:0}
.entry-row{position:relative;z-index:3;display:flex;gap:9px;margin:14px 18px 0}
.entry-pill{
  flex:1;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--cream-hi);border:.5px solid var(--line-soft);cursor:pointer;
  font-family:var(--sans);font-size:11.5px;letter-spacing:1.5px;color:var(--gold-deep);box-shadow:var(--hi);
}
.entry-pill:active{transform:scale(.97)}
.entry-pill b{color:var(--ink-soft);font-weight:400}

/* ═══════════════════════════════════════════════════════════════
   页 06 · 三要素详情（主角=该要素）
   ═══════════════════════════════════════════════════════════════ */
.el-hero{position:relative;z-index:2;text-align:center;margin-top:14px}
.el-hero .el-big{
  width:72px;height:72px;border-radius:50%;margin:0 auto;
  background:radial-gradient(circle at 32% 28%,rgba(232,196,190,.55),rgba(201,169,124,.32));
  border:.5px solid rgba(201,169,124,.45);
  display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--pink-ink);
  box-shadow:0 12px 26px rgba(176,138,130,.22),var(--hi);
  animation:haloBreathe 6s ease-in-out infinite;
}
.el-hero h3{font-size:19px;letter-spacing:4px;margin-top:12px;font-weight:500}
.el-hero .el-line{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);letter-spacing:1px;margin-top:7px}
.price-card{background:var(--cream-hi);border:.5px solid rgba(176,143,82,.4);border-radius:18px;padding:4px 14px 12px;margin-top:10px;box-shadow:var(--shadow)}
.price-card .pc-t{font-size:13px;letter-spacing:2px;color:var(--ink);text-align:center;margin:10px 0 4px}
.price-card .pc-s{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);text-align:center;letter-spacing:1.5px;margin-bottom:6px}
.tier-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:.5px solid rgba(201,169,124,.18)}
.tier-row .tier-n{flex:1;min-width:0}
.tier-row .tier-n b{font-size:12.5px;letter-spacing:1px;color:var(--ink);font-weight:500}
.tier-row .tier-n span{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);margin-top:2px;letter-spacing:.3px}
.tier-row .tier-p{font-family:var(--num);font-size:16px;color:var(--gold-deep);font-style:normal}
.tier-row .tier-p small{font-size:10px;font-family:var(--sans)}
.tier-row .tier-btn{width:56px;height:34px;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#FFFDF8;font-size:11px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.tier-row .tier-btn:active{transform:scale(.95)}

/* ═══════════════════════════════════════════════════════════════
   页 07 · 牌阵选择（主角=牌阵网格）
   ═══════════════════════════════════════════════════════════════ */
.spread-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.spread-card{
  position:relative;background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:17px;
  padding:13px 12px;cursor:pointer;box-shadow:var(--shadow),var(--hi);transition:transform .14s ease;
}
.spread-card:active{transform:scale(.97)}
.spread-card.sel{border:1.5px solid var(--gold);box-shadow:0 8px 20px rgba(176,143,82,.18),var(--hi)}
.spread-card .sc-ic{font-size:19px}
.spread-card .sc-n{font-size:13.5px;letter-spacing:1.5px;color:var(--ink);margin-top:6px}
.spread-card .sc-d{font-family:var(--sans);font-size:11px;color:var(--ink-soft);margin-top:3px;letter-spacing:.3px;line-height:1.5}
.spread-card .sc-tag{
  position:absolute;top:9px;right:9px;font-family:var(--sans);font-size:9px;letter-spacing:1px;
  color:var(--gold-deep);background:rgba(201,169,124,.12);border:.5px solid rgba(201,169,124,.3);
  padding:1px 6px;border-radius:999px;
}
.spread-card .sc-ok{position:absolute;top:9px;right:9px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#FFFDF8;font-size:10px;display:flex;align-items:center;justify-content:center}
.spread-wide{display:flex;align-items:center;gap:11px;background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:17px;padding:11px 13px;margin-top:9px;cursor:pointer;box-shadow:var(--shadow),var(--hi);height:58px}
.spread-wide:active{transform:scale(.98)}
.spread-wide.sel{border:1.5px solid var(--gold)}
.spread-wide .sc-ic{font-size:18px}
.spread-wide .sc-t{flex:1}
.spread-wide .sc-n{font-size:13px;letter-spacing:1.5px;color:var(--ink)}
.spread-wide .sc-d{font-family:var(--sans);font-size:10.5px;color:var(--ink-soft);margin-top:2px}
.spread-wide .sc-ok{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#FFFDF8;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ═══════════════════════════════════════════════════════════════
   页 08 · 占卜提问（主角=问题输入）
   ═══════════════════════════════════════════════════════════════ */
.ask-hero{position:relative;z-index:2;text-align:center;margin-top:10px}
.ask-hero .ah-label{font-size:15px;letter-spacing:2px;color:var(--ink)}
.ask-hero .ah-sub{font-family:var(--sans);font-size:11px;color:var(--gold-deep);letter-spacing:2px;margin-top:6px}
.ask-input{
  width:100%;min-height:92px;border-radius:16px;background:var(--cream-hi);
  border:.5px solid var(--line-soft);box-shadow:var(--hi),var(--shadow);
  padding:12px 14px;font-size:12.5px;letter-spacing:.5px;color:var(--ink);line-height:1.7;
  resize:none;outline:none;margin-top:12px;
}
.ask-input::placeholder{color:var(--ink-faint)}
.ask-input:focus{border-color:rgba(201,169,124,.55)}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{
  height:32px;padding:0 12px;border-radius:999px;display:flex;align-items:center;cursor:pointer;
  background:var(--cream-hi);border:.5px solid rgba(201,169,124,.3);
  font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:.5px;box-shadow:var(--hi);
}
.chip:active{background:rgba(201,169,124,.14)}
.persona-row{
  display:flex;align-items:center;gap:11px;background:var(--cream-hi);border:.5px solid var(--line-soft);
  border-radius:15px;padding:9px 12px;margin-top:8px;cursor:pointer;box-shadow:var(--hi);height:56px;
}
.persona-row.sel{border:1.5px solid var(--gold)}
.persona-row .p-ic{width:34px;height:34px;border-radius:50%;background:rgba(232,196,190,.35);border:.5px solid rgba(176,138,130,.35);display:flex;align-items:center;justify-content:center;color:var(--pink-ink);font-size:15px;flex-shrink:0}
.persona-row .p-t{flex:1}
.persona-row .p-n{font-size:12.5px;letter-spacing:1.5px;color:var(--ink)}
.persona-row .p-d{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);margin-top:2px;letter-spacing:.5px}
.persona-row .p-ck{width:17px;height:17px;border-radius:50%;border:1px solid rgba(201,169,124,.45);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent}
.persona-row.sel .p-ck{background:linear-gradient(135deg,var(--gold),var(--gold-deep));border:none;color:#FFFDF8}
.quota-note{position:relative;z-index:2;text-align:center;font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);letter-spacing:1.5px;margin-top:12px}

/* ═══════════════════════════════════════════════════════════════
   页 09 · 解读结果（主角=解读内容）
   ═══════════════════════════════════════════════════════════════ */
.result-cards{display:flex;gap:10px;justify-content:center;margin-top:8px}
.res-card{width:72px;cursor:default}
.res-card .rc-art{width:72px;height:104px;border-radius:10px;overflow:hidden;border:.5px solid rgba(201,169,124,.4);box-shadow:0 8px 18px rgba(61,58,54,.12),var(--hi);position:relative;margin:0 auto}
.res-card .rc-art img{width:100%;height:100%;object-fit:cover;display:block}
.res-card .rc-pos{text-align:center;font-family:var(--sans);font-size:10px;color:var(--gold-deep);letter-spacing:2px;margin-top:6px}
.res-card .rc-n{text-align:center;font-size:11.5px;letter-spacing:1px;color:var(--ink);margin-top:2px}
.claim-card{background:rgba(232,196,190,.18);border:.5px solid rgba(176,138,130,.4);border-radius:16px;padding:13px 14px;margin-top:13px}
.claim-card .cq{font-size:12.5px;line-height:1.9;letter-spacing:.5px;color:var(--pink-ink)}
.claim-card .cq b{font-weight:500;color:var(--ink)}
.reading-para{margin-top:12px}
.reading-para h4{font-size:12.5px;letter-spacing:1.5px;color:var(--gold-deep);margin-bottom:5px;font-weight:500}
.reading-para p{font-family:var(--sans);font-size:11.5px;line-height:1.85;color:var(--ink-soft);letter-spacing:.3px}
.action-card{border:1px dashed rgba(176,143,82,.55);border-radius:16px;padding:13px 14px;margin-top:12px;background:rgba(201,169,124,.07)}
.action-card .aq2{font-size:12.5px;line-height:1.9;color:var(--ink-soft);letter-spacing:.5px}
.action-card .aq2-label{font-family:var(--sans);font-size:10.5px;letter-spacing:3px;color:var(--gold-deep);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.result-actions{display:flex;gap:9px;margin-top:14px}
.result-actions .ra{flex:1;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;letter-spacing:2px;cursor:pointer;background:var(--cream-hi);border:.5px solid var(--line-soft);color:var(--gold-deep);box-shadow:var(--hi)}
.result-actions .ra.pri{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#FFFDF8;border:none;box-shadow:0 6px 16px rgba(176,143,82,.3)}
.result-actions .ra:active{transform:scale(.97)}
.save-note{position:relative;z-index:2;text-align:center;font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);letter-spacing:2px;margin-top:12px;cursor:pointer}
.save-note:active{opacity:.6}

/* ═══════════════════════════════════════════════════════════════
   页 10 · 我的主屏（主角=星光记录卡）
   ═══════════════════════════════════════════════════════════════ */
.avatar-chip{display:flex;align-items:center;gap:7px}
.avatar-chip .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#E8C4BE,#C9A97C);border:.5px solid rgba(201,169,124,.5);display:flex;align-items:center;justify-content:center;color:#FFFDF8;font-size:15px;box-shadow:var(--hi)}
.avatar-chip .av-t{text-align:left}
.avatar-chip .av-n{font-size:12.5px;letter-spacing:1px;color:var(--ink)}
.avatar-chip .av-l{font-family:var(--sans);font-size:9.5px;color:var(--gold-deep);letter-spacing:1.5px;margin-top:2px}
.record-card{
  position:relative;z-index:2;margin:24px 18px 0;border-radius:22px;overflow:hidden;
  background:linear-gradient(165deg,#FFFDF8,var(--paper));
  border:.5px solid rgba(201,169,124,.4);box-shadow:0 16px 34px rgba(61,58,54,.1),var(--hi);
  padding:16px 17px 13px;cursor:pointer;
}
.record-card .rc-top{display:flex;justify-content:space-between;align-items:center}
.record-card .rc-label{font-family:var(--sans);font-size:11px;letter-spacing:3px;color:var(--gold-deep)}
.record-card .rc-badge{font-family:var(--sans);font-size:10px;letter-spacing:1.5px;color:#FFFDF8;background:linear-gradient(135deg,var(--pink-deep),var(--pink-ink));padding:3px 10px;border-radius:999px}
.record-main{display:flex;align-items:flex-end;gap:12px;margin-top:12px}
.record-main .rm-num{font-family:var(--num);font-size:52px;line-height:1;color:var(--ink);letter-spacing:1px}
.record-main .rm-num i{font-style:normal;font-size:13px;letter-spacing:2px;color:var(--ink-soft);margin-left:5px;font-family:var(--serif)}
.record-main .rm-tx{flex:1;padding-bottom:5px}
.record-main .rm-t1{font-size:12px;letter-spacing:2px;color:var(--ink-soft)}
.record-main .rm-t2{font-family:var(--sans);font-size:11px;color:var(--ink-faint);margin-top:4px;letter-spacing:.5px;line-height:1.5}
.record-stats{display:flex;border-top:.5px dashed rgba(201,169,124,.4);margin-top:13px;padding-top:10px}
.record-stats .rs{flex:1;text-align:center}
.record-stats .rs b{display:block;font-family:var(--num);font-size:17px;color:var(--gold-deep);font-weight:400}
.record-stats .rs span{font-family:var(--sans);font-size:10px;color:var(--ink-faint);letter-spacing:2px}
.record-curve{position:relative;z-index:2;text-align:center;margin-top:8px;font-family:var(--sans);font-size:10.5px;color:var(--gold-deep);letter-spacing:2.5px;cursor:pointer;height:26px;line-height:26px}
.me-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 18px 0}
.me-tile{
  background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:17px;
  display:flex;align-items:center;gap:10px;padding:0 13px;height:58px;cursor:pointer;box-shadow:var(--shadow),var(--hi);
}
.me-tile:active{transform:scale(.97)}
.me-tile .mt-ic{width:32px;height:32px;border-radius:10px;background:rgba(232,196,190,.32);border:.5px solid rgba(176,138,130,.3);display:flex;align-items:center;justify-content:center;color:var(--pink-ink);font-size:14px;flex-shrink:0}
.me-tile .mt-n{font-size:12.5px;letter-spacing:1.5px;color:var(--ink)}
.me-tile .mt-d{font-family:var(--sans);font-size:9.5px;color:var(--ink-faint);margin-top:2px;letter-spacing:.5px}

/* ═══════════════════════════════════════════════════════════════
   页 11 · 牌运曲线（主角=曲线可视化）
   ═══════════════════════════════════════════════════════════════ */
.chart-card{background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:18px;padding:13px 12px 8px;margin-top:8px;box-shadow:var(--shadow),var(--hi)}
.chart-card .cc-t{display:flex;justify-content:space-between;align-items:baseline;padding:0 3px}
.chart-card .cc-t b{font-size:13px;letter-spacing:1.5px;color:var(--ink);font-weight:500}
.chart-card .cc-t span{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);letter-spacing:1px}
.chart-card svg{display:block;margin-top:6px}
.hot-row{display:flex;align-items:center;gap:11px;padding:8px 2px}
.hot-row .hot-dot{width:22px;height:22px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#FFFDF8}
.hot-row .hot-n{flex:1;font-size:12px;letter-spacing:1.5px;color:var(--ink)}
.hot-row .hot-c{font-family:var(--num);font-size:13px;color:var(--ink-faint)}
.bar-row{display:flex;align-items:center;gap:9px;padding:6px 0}
.bar-row .bar-l{width:64px;font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:1px;flex-shrink:0}
.bar-row .bar-track{flex:1;height:9px;border-radius:99px;background:var(--paper);overflow:hidden}
.bar-row .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--gold))}
.bar-row .bar-p{width:34px;text-align:right;font-family:var(--num);font-size:11.5px;color:var(--gold-deep);flex-shrink:0}
.suit-row{display:flex;align-items:center;gap:9px;padding:6px 0}
.suit-row .su-ic{width:30px;height:30px;border-radius:9px;background:rgba(201,169,124,.1);border:.5px solid rgba(201,169,124,.25);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.suit-row .su-t{flex:1}
.suit-row .su-n{font-size:12px;letter-spacing:1.5px;color:var(--ink)}
.suit-row .su-p{font-family:var(--sans);font-size:10px;color:var(--ink-faint);margin-top:2px}
.suit-row .su-bar{width:52px;height:7px;border-radius:99px;background:var(--paper);overflow:hidden;flex-shrink:0}
.suit-row .su-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--gold))}

/* ═══════════════════════════════════════════════════════════════
   页 12 · 星光日记（主角=日记条目流）
   ═══════════════════════════════════════════════════════════════ */
.diary-hint{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:rgba(232,196,190,.16);border:.5px solid rgba(176,138,130,.35);border-radius:15px;
  padding:11px 13px;margin-top:8px;cursor:pointer;
}
.diary-hint .dh-t{font-family:var(--sans);font-size:11.5px;color:var(--pink-ink);letter-spacing:.5px;line-height:1.6}
.diary-hint .dh-go{font-size:11px;color:var(--pink-deep);flex-shrink:0;font-family:var(--sans);letter-spacing:1px}
.entry-card{background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:18px;padding:13px 14px;margin-top:10px;box-shadow:var(--shadow),var(--hi)}
.entry-card .ec-top{display:flex;align-items:center;gap:8px}
.entry-card .ec-date{font-family:var(--num);font-size:12.5px;color:var(--ink-soft);letter-spacing:1px}
.entry-card .ec-card{font-size:11px;color:var(--gold-deep);letter-spacing:1.5px;background:rgba(201,169,124,.12);border:.5px solid rgba(201,169,124,.3);border-radius:999px;padding:2px 9px}
.entry-card .ec-mood{font-size:12px;margin-left:auto;letter-spacing:1px;color:var(--ink-soft);font-family:var(--sans)}
.entry-card .ec-body{font-family:var(--sans);font-size:12px;line-height:1.8;color:var(--ink-soft);letter-spacing:.3px;margin-top:9px}
.entry-card .ec-line{width:100%;height:1px;background:repeating-linear-gradient(90deg,rgba(201,169,124,.35) 0 5px,transparent 5px 9px);margin-top:10px}
.entry-card .ec-re{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);margin-top:7px;letter-spacing:.5px}
.fab{
  position:absolute;right:18px;bottom:22px;z-index:20;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#FFFDF8;font-size:22px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 10px 24px rgba(176,143,82,.4);user-select:none;
}
.fab:active{transform:scale(.93)}

/* ═══════════════════════════════════════════════════════════════
   页 13 · 新月许愿（主角=许愿仪式）
   ═══════════════════════════════════════════════════════════════ */
.wish-stage{position:relative;z-index:2;text-align:center;margin-top:22px}
.cres{position:relative;width:76px;height:76px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 32% 30%,#E8C4BE,#C9A97C);box-shadow:0 0 46px rgba(201,169,124,.55);animation:cresGlow 4s ease-in-out infinite}
.cres::after{content:'';position:absolute;width:76px;height:76px;border-radius:50%;background:var(--cream);left:46px;top:-6px;transform:rotate(-12deg);animation:cresSway 7s ease-in-out infinite}
@keyframes cresGlow{0%,100%{box-shadow:0 0 34px rgba(201,169,124,.4)}50%{box-shadow:0 0 56px rgba(201,169,124,.62)}}
@keyframes cresSway{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-4deg)}}
.wish-phase{font-family:var(--sans);font-size:10.5px;letter-spacing:3px;color:var(--gold-deep);margin-top:16px}
.wish-title{font-size:21px;letter-spacing:6px;margin-top:7px;color:var(--ink);font-weight:500}
.wish-sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);letter-spacing:2px;margin-top:8px}
.wish-input{
  width:100%;min-height:88px;border-radius:16px;background:var(--cream-hi);
  border:.5px solid var(--line-soft);box-shadow:var(--hi),var(--shadow);padding:12px 14px;
  font-size:12.5px;letter-spacing:.5px;color:var(--ink);line-height:1.7;resize:none;outline:none;margin-top:14px;
}
.wish-input::placeholder{color:var(--ink-faint)}
.wish-input:focus{border-color:rgba(201,169,124,.55)}
.wish-count{text-align:right;font-family:var(--num);font-size:10.5px;color:var(--ink-faint);margin-top:5px}
.wish-moon-note{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);letter-spacing:1.5px;text-align:center;margin-top:11px}
.wish-done{position:relative;z-index:2;text-align:center;margin-top:34px;animation:riseIn .6s cubic-bezier(.2,.7,.3,1) both}
.wish-seal{width:54px;height:54px;border-radius:50%;margin:0 auto;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#FFFDF8;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 7px rgba(201,169,124,.15),0 10px 24px rgba(176,143,82,.35);animation:cresGlow 4s ease-in-out infinite}
.wish-done h3{font-size:19px;letter-spacing:5px;margin-top:16px}
.wish-done .wd-sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);letter-spacing:2px;margin-top:8px}
.wish-card{
  width:200px;margin:20px auto 0;border-radius:17px;padding:18px 16px;
  background:linear-gradient(165deg,#FFFDF8,var(--paper));border:.5px solid rgba(201,169,124,.45);
  box-shadow:0 14px 30px rgba(61,58,54,.12),var(--hi);position:relative;
}
.wish-card .wc-stamp{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:1px solid rgba(176,143,82,.55);color:var(--gold-deep);font-size:10px;display:flex;align-items:center;justify-content:center;transform:rotate(14deg)}
.wish-card .wc-t{font-size:12.5px;line-height:1.9;color:var(--ink);letter-spacing:.5px}
.wish-card .wc-d{font-family:var(--sans);font-size:9.5px;color:var(--ink-faint);letter-spacing:1.5px;margin-top:10px}
.wish-back{position:relative;z-index:2;text-align:center;margin-top:20px;font-size:11.5px;color:var(--gold-deep);letter-spacing:2.5px;cursor:pointer;height:40px;line-height:40px}
.wish-back:active{opacity:.6}

/* ═══════════════════════════════════════════════════════════════
   页 14 · 满月复盘（主角=AI 复盘卡）
   ═══════════════════════════════════════════════════════════════ */
.review-card{background:linear-gradient(170deg,#FFFDF8,var(--paper));border:.5px solid rgba(201,169,124,.42);border-radius:22px;padding:17px 16px;margin-top:10px;box-shadow:0 16px 34px rgba(61,58,54,.1),var(--hi);position:relative;overflow:hidden}
.review-card .rv-t{text-align:center}
.review-card .rv-t h3{font-size:16px;letter-spacing:4px;color:var(--ink);font-weight:500}
.review-card .rv-t p{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);letter-spacing:2px;margin-top:5px}
.rv-status{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:9px 0;border-top:.5px dashed rgba(201,169,124,.35)}
.rv-status .rv-ic{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:2px}
.rv-status .rv-ic.ok{background:rgba(176,143,82,.18);color:var(--gold-deep);border:.5px solid rgba(176,143,82,.4)}
.rv-status .rv-ic.go{background:rgba(232,196,190,.3);color:var(--pink-ink);border:.5px solid rgba(176,138,130,.35)}
.rv-status .rv-ic.no{background:rgba(176,170,156,.18);color:var(--ink-faint);border:.5px solid rgba(176,170,156,.35)}
.rv-status .rv-tx{flex:1}
.rv-status .rv-w{font-size:12.5px;letter-spacing:1px;color:var(--ink)}
.rv-status .rv-n{font-family:var(--sans);font-size:11px;color:var(--ink-soft);line-height:1.65;margin-top:3px;letter-spacing:.3px}
.rv-essay{font-family:var(--sans);font-size:12px;line-height:2;color:var(--ink-soft);letter-spacing:.4px;margin-top:12px;padding-top:13px;border-top:.5px dashed rgba(201,169,124,.35);text-align:center}
.rv-essay b{color:var(--pink-ink);font-weight:500}

/* ═══════════════════════════════════════════════════════════════
   页 15 · 每日签到（主角=签到动作）
   ═══════════════════════════════════════════════════════════════ */
.check-ring{position:relative;z-index:2;width:150px;height:150px;margin:24px auto 0}
.check-ring svg{transform:rotate(-90deg)}
.check-ring .cr-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.check-ring .cr-c b{font-family:var(--num);font-size:40px;font-weight:400;color:var(--ink);line-height:1}
.check-ring .cr-c b i{font-style:normal;font-size:13px;letter-spacing:1px;margin-left:3px;font-family:var(--serif)}
.check-ring .cr-c span{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);letter-spacing:2.5px;margin-top:5px}
.check-ring .cr-s{position:absolute;right:2px;top:2px;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pink-deep),var(--pink-ink));color:#FFFDF8;font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(176,138,130,.35);z-index:3}
.check-cal{display:flex;gap:6px;margin-top:18px}
.check-cal .cc{flex:1;height:52px;border-radius:13px;background:var(--cream-hi);border:.5px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:var(--hi)}
.check-cal .cc.done{background:rgba(201,169,124,.14);border-color:rgba(201,169,124,.45)}
.check-cal .cc.today{border:1.5px solid var(--gold-deep)}
.check-cal .cc span{font-family:var(--sans);font-size:9.5px;color:var(--ink-faint);letter-spacing:1px}
.check-cal .cc b{font-family:var(--num);font-size:13px;font-weight:400;color:var(--ink)}
.check-cal .cc.done b{color:var(--gold-deep)}
.check-lv{display:flex;align-items:center;gap:11px;margin-top:18px;background:var(--cream-hi);border:.5px solid var(--line-soft);border-radius:17px;padding:12px 14px;box-shadow:var(--shadow),var(--hi)}
.check-lv .lv-badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#FFFDF8;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;box-shadow:0 6px 14px rgba(176,143,82,.3)}
.check-lv .lv-t{flex:1}
.check-lv .lv-n{font-size:12.5px;letter-spacing:1.5px;color:var(--ink)}
.check-lv .lv-d{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:.5px}
.check-lv .lv-bar{width:64px;height:7px;border-radius:99px;background:var(--paper);overflow:hidden;flex-shrink:0}
.check-lv .lv-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--gold))}

/* ═══════════════════════════════════════════════════════════════
   页 16 · 设置（简化的次要页）
   ═══════════════════════════════════════════════════════════════ */
.set-row{display:flex;align-items:center;gap:11px;height:54px;padding:0 4px;border-bottom:.5px solid rgba(201,169,124,.18);cursor:pointer}
.set-row:active{opacity:.6}
.set-row:last-child{border-bottom:none}
.set-row .set-ic{width:30px;height:30px;border-radius:9px;background:rgba(201,169,124,.12);border:.5px solid rgba(201,169,124,.25);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gold-deep);flex-shrink:0}
.set-row .set-n{flex:1;font-size:12.5px;letter-spacing:1.5px;color:var(--ink)}
.set-row .set-v{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:.5px}
.set-row .set-go{color:var(--ink-faint);font-size:13px;font-family:var(--sans)}
.set-row.danger .set-n{color:var(--pink-ink)}

@media(prefers-reduced-motion:reduce){
  .float,.halo,.sp,.mount,.toast,.cres,.cres::after,.wish-seal,.flipIn,.anim{animation:none!important}
}
</style>

/* ── 路由上下文 ── */
const Ctx = createContext(null);

/* ── 微信胶囊 ── */
function WxCapsule(){
  return (
    <div className="wxcapsule">
      <div className="cap"><span/><span/><span/></div>
      <div className="cap"><div className="circle"/></div>
    </div>
  );
}

/* ── 新月（天象小图标 · 细金） ── */
const Crescent = () => (
  <svg width="11" height="11" viewBox="0 0 20 20" aria-hidden="true">
    <path d="M14.5 3.4a6.6 6.6 0 1 0 0 13.2 5.3 5.3 0 0 1 0-13.2z" fill="#C9A97C"/>
  </svg>
);

/* ── 四芒星（牌角光点） ── */
const Spark = ({size=12}) => (
  <svg width={size} height={size} viewBox="0 0 20 20" aria-hidden="true">
    <path d="M10 1.5l2.1 6.4 6.4 2.1-6.4 2.1-2.1 6.4-2.1-6.4-6.4-2.1 6.4-2.1z" fill="#C9A97C"/>
  </svg>
);

/* ── 锁（明日预告） ── */
const Lock = () => (
  <svg width="9" height="9" viewBox="0 0 20 20" aria-hidden="true">
    <rect x="5" y="9.5" width="10" height="8" rx="2" fill="none" stroke="#C9A97C" strokeWidth="1.5"/>
    <path d="M7.5 9.5V7a2.5 2.5 0 0 1 5 0v2.5" fill="none" stroke="#C9A97C" strokeWidth="1.5"/>
  </svg>
);

/* ── 返回箭头 ── */
const BackArrow = () => (
  <svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true">
    <path d="M12.5 4L6.5 10l6 6" fill="none" stroke="#8A8478" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

/* ── TabBar 图标（细线 UI 图标，非插画） ── */
const Icon = ({name,color,size=19}) => {
  const c = color||'currentColor';
  const paths = {
    card: <g fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round">
            <rect x="4" y="5" width="12" height="10.5" rx="1.6"/>
            <path d="M10 7.2l.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3z" fill={c}/>
          </g>,
    eye: <g fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round">
           <path d="M2.6 10S5.6 5.6 10 5.6 17.4 10 17.4 10s-3 4.4-7.4 4.4S2.6 10 2.6 10z"/>
           <circle cx="10" cy="10" r="2.1"/>
         </g>,
    user: <g fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round">
            <circle cx="10" cy="7.5" r="3.2"/>
            <path d="M4.5 17c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6" strokeLinecap="round"/>
          </g>,
  };
  return <svg width={size} height={size} viewBox="0 0 20 20">{paths[name]}</svg>;
};

const TABS = [
  {key:'today',  name:'今日', ic:'card', tip:'今日一牌 · 每天只讲一个故事'},
  {key:'oracle', name:'神谕', ic:'eye',  tip:'神谕 · 问一个问题，抽三张'},
  {key:'me',     name:'我的', ic:'user', tip:'我的 · 星盘与收藏'},
];

function TabBar({tab,goTab}){
  return (
    <div className="tabbar">
      {TABS.map(t=>
        <div key={t.key} className={"tab"+(t.key===tab?' on':'')} onClick={()=>goTab(t.key)}>
          <Icon name={t.ic} color={t.key===tab?'#8A6F4E':'#B0AA9C'}/>
          <span>{t.name}</span>
          <span className="tdot"/>
        </div>)}
    </div>
  );
}

/* ── 二级页顶栏 ── */
function Nav({title}){
  const {pop} = useContext(Ctx);
  return (
    <div className="nav">
      <div className="back" onClick={pop}><BackArrow/>返回</div>
      <div className="nt">{title}</div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   === 页 01 · 今日主屏 ===（已认可版 · 牌是绝对主角）
   点击牌 → 翻牌动画 → 抽牌后状态
   点击明日之牌 → 小弹层
   ═══════════════════════════════════════════════════════════ */
function TodayMain(){
  const {push,goTab,show} = useContext(Ctx);
  const [flipping,setFlipping] = useState(false);
  const [sheet,setSheet] = useState(false);
  const doFlip=()=>{
    if(flipping)return;
    setFlipping(true);
    setTimeout(()=>{setFlipping(false);push('flip');},660);
  };
  return (
    <div className="screen anim" data-screen-label="01-today-main">
      <WxCapsule/>
      <div className="wash" style={{width:200,height:200,right:-60,top:-44,background:'#E8C4BE',opacity:.30}}/>
      <div className="wash" style={{width:180,height:180,left:-70,top:368,background:'#C9A97C',opacity:.15}}/>

      {/* 顶部：品牌 · 日期（左）｜星座徽章（右，极小不抢戏） */}
      <div className="topbar">
        <div>
          <div className="brand">星光映照</div>
          <div className="date-row"><span className="gold-dot"/><span>AUG 8 · SAT · 2026</span></div>
        </div>
        <div className="zodiac">♌ 狮子座</div>
      </div>

      {/* 天象小字：一行 · 注脚 */}
      <div className="sky-note"><Crescent/><span>满月 · 月亮在双鱼</span></div>

      {/* 中央绝对主角：大牌面（点击 → 翻牌动画） */}
      <div className="card-zone">
        <div className="halo"/>
        <Spark className="sp s1" size={13}/>
        <Spark className="sp s2" size={9}/>
        <div className="mount">
          <div className="float">
            <div className={"flip3d"+(flipping?'':'')}>
              <div className={"mat"+(flipping?' go':'')} onClick={doFlip}>
                <div className="art">
                  <img src={MOON} alt="月亮与水边安睡兔子的水彩插画"/>
                  <div className="artback"><img src={BACK} alt="卡背"/></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* 牌名 + 今日牌语 */}
      <div className="card-name">
        <span className="cn">月亮牌</span>
        <span className="dot"/>
        <span className="en">THE MOON</span>
      </div>
      <div className="card-phrase">有些答案，会在月光里慢慢清晰</div>

      {/* 能量注脚：一行 · 细金（牌的补充，不是并列功能）｜每一项可点击 → 能量详情 */}
      <div className="energy">
        <span className="eg-label">今日能量</span>
        <span className="sep"/>
        <span className="eg go" onClick={()=>push('energy:love')}>爱情 <i>81</i></span>
        <span className="sep"/>
        <span className="eg go" onClick={()=>push('energy:career')}>事业 <i>73</i></span>
        <span className="sep"/>
        <span className="eg go" onClick={()=>push('energy:social')}>人际 <i>64</i></span>
        <span className="sep"/>
        <span className="eg go" onClick={()=>push('energy:health')}>健康 <i>57</i></span>
      </div>

      {/* 联动解读：牌 × 天象（主角的展开） */}
      <div className="link">
        <p><em>月亮牌的朦胧</em><span className="x"> × </span>满月之夜</p>
        <p>今天适合把说不出口的话，写下来</p>
      </div>

      {/* 明日预告：点击 → 小弹层 */}
      <div className="tomorrow">
        <div className="tline"/>
        <div className="trow" onClick={()=>setSheet(true)}><Lock/><span>明日之牌 · 隐士</span></div>
      </div>

      <TabBar tab="today" goTab={goTab}/>

      {sheet && (
        <div className="sheet-wrap" onClick={()=>setSheet(false)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="mini-card"><span className="star">✶</span><span className="mcn">隐士</span><span className="men">HERMIT</span></div>
            <div className="s-title">明日之牌 · 隐士</div>
            <div className="s-sub">静下来，答案会自己靠近。<br/>明日 08.09 · 星期日 · 星光会在深夜点亮</div>
            <div className="s-btn" onClick={()=>setSheet(false)}>晚安，明天见</div>
            <div className="s-tag">明日 08.09 · 星期日</div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   === 页 02 · 抽牌后状态 ===（主角=牌）
   牌面 + 牌名 + 今日牌语 + 能量注脚更新 + 查看详解入口
   ═══════════════════════════════════════════════════════════ */

  return (
    <div className="screen anim page" data-screen-label="02-drawn-card">
      <WxCapsule/>
      <div className="wash" style={{width:190,height:190,right:-60,top:-40,background:'#E8C4BE',opacity:.28}}/>

      <Nav title="今日之牌"/>
      <div className="pbody">
        {/* 主角：牌面 */}
        <div className="drawn-zone">
          <div className="halo"/>
          <div className="mount">
            <div className="flipIn">
              <div className="mat">
                <div className="art">
                  <img src={MOON} alt="月亮与水边安睡兔子的水彩插画"/>
                </div>
              </div>
            </div>

/* ═══════════════════════════════════════════════════════════

   近30天解读次数 / 高频牌 / 比例条 / 花色分布 / 分享图
   ═══════════════════════════════════════════════════════════ */
const TREND = [6,4,9,12,8,10,14,11,7,9,13,16,12,15,11,14,18,15,12,16,13,17,21,18,16,20,17,19,23,21];
const SUITS = [['权杖','🔥',42],['圣杯','💧',23],['宝剑','🌬',20],['星币','⛰',15]];
const HOT = [['权杖骑士',5,'#C9A97C'],['圣杯九',4,'#DCA9A1'],['月亮',3,'#B0AA9C']];

function Trend(){
  const {show} = useContext(Ctx);
  const pad=8, w=276, h=110;
  const max=Math.max(...TREND), min=Math.min(...TREND);
  const X=i=>pad+i*(w-2*pad)/(TREND.length-1);
  const Y=v=>h-pad-(v-min)*(h-2*pad)/(max-min||1);
  const pts=TREND.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area=`M${X(0)},${h-pad} L${pts.replace(/ /g,' L')} L${X(TREND.length-1)},${h-pad} Z`;
  return (
    <div className="screen anim page" data-screen-label="11-trend">
      <WxCapsule/>
      <div className="wash" style={{width:180,height:180,right:-60,top:-36,background:'#C9A97C',opacity:.16}}/>
      <Nav title="牌运曲线 · 近30天"/>
      <div className="pbody">

        <div className="chart-card">
          <div className="cc-t"><b>近 30 天 · 解读次数</b><span>30 天 · 23 次</span></div>
          <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`}>
            <defs>
              <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#C9A97C" stopOpacity=".34"/>
                <stop offset="100%" stopColor="#C9A97C" stopOpacity="0"/>
              </linearGradient>
            </defs>
            <path d={area} fill="url(#tg)"/>
            <polyline points={pts} fill="none" stroke="#C9A97C" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
            <circle cx={X(26)} cy={Y(21)} r="2.8" fill="#DCA9A1"/>
            <circle cx={X(29)} cy={Y(21)} r="2.8" fill="#C9A97C"/>
            <text x={X(0)} y={h-2} fontSize="7" fill="#B0AA9C">07.10</text>
            <text x={X(14)} y={h-2} fontSize="7" fill="#B0AA9C">07.24</text>
            <text x={X(24)} y={h-2} fontSize="7" fill="#B0AA9C">08.03</text>
            <text x={X(29)} y={h-2} fontSize="7" fill="#B08F52" textAnchor="end">今天</text>
          </svg>
        </div>

        <div className="sec-label">高频之牌</div>
        <div className="card-soft">
          {HOT.map(h=>(
            <div key={h[0]} className="hot-row">
              <div className="hot-dot" style={{background:h[2]}}>{h[0].charAt(0)}</div>
              <div className="hot-n">{h[0]}</div>
              <div className="hot-c">×{h[1]}</div>
            </div>))}
        </div>

        <div className="sec-label">大牌 · 小牌</div>
        <div className="card-soft">
          <div className="bar-row">
            <div className="bar-l">大牌</div>
            <div className="bar-track"><div className="bar-fill" style={{width:'38%'}}/></div>
            <div className="bar-p">38%</div>
          </div>
          <div className="bar-row">
            <div className="bar-l">小牌</div>
            <div className="bar-track"><div className="bar-fill" style={{width:'62%',background:'linear-gradient(90deg,#DCA9A1,#E8C4BE)'}}/></div>
            <div className="bar-p">62%</div>
          </div>
        </div>

        <div className="sec-label">花色分布</div>
        <div className="card-soft">
          {SUITS.map(s=>(
            <div key={s[0]} className="suit-row">
              <div className="su-ic">{s[1]}</div>
              <div className="su-t">

/* ═══════════════════════════════════════════════════════════
   路由：Tab + 页面栈 + Toast + 小弹层
   #hash 直达：today / today:flip / today:detail /
   today:energy:love/career/social/health / oracle /
   oracle:element:0-2 / oracle:spreads / oracle:ask / oracle:result /
   me / me:trend / me:diary / me:wish / me:review / me:checkin / me:settings
   ═══════════════════════════════════════════════════════════ */
function App(){
  const [tab,setTab] = useState('today');
  const [stack,setStack] = useState([]);
  const [toast,setToast] = useState('');
  const [pass,setPass] = useState({spread:'three_card',question:'他/她今天在想我吗',persona:'wise_moon',element:0});

  const show = t=>{setToast(t);clearTimeout(show._t);show._t=setTimeout(()=>setToast(''),2000);};
  const push = k=>setStack(s=>[...s,k]);
  const pop = ()=>setStack(s=>s.length? s.slice(0,-1):s);
  const goTab = t=>{
    setTab(t);setStack([]);
    const tip = TABS.find(x=>x.key===t).tip;
    show(tip);
  };

  useEffect(()=>{
    const apply=()=>{
      const h=location.hash.replace(/^#/,'');
      if(!h)return;
      const idx=h.indexOf(':');
      let t = idx<0?h:h.slice(0,idx);
      if(!['today','oracle','me'].includes(t))t='today';
      const s = idx<0?[]:[h.slice(idx+1)];
      setTab(t);setStack(s);
      const em=s.find(x=>x.indexOf('element:')===0);
      if(em)setPass(p=>({...p,element:parseInt(em.split(':')[1])||0}));
    };
    window.addEventListener('hashchange',apply);
    apply();
    return ()=>window.removeEventListener('hashchange',apply);
  },[]);

  const ctx = {push,pop,goTab,show,pass,setPass};
  let view;
  if(stack.length===0){
    if(tab==='today') view=<TodayMain key="t"/>;
    else if(tab==='oracle') view=<OracleMain key="o"/>;
    else view=<MeMain key="m"/>;
  }else{
    const k=stack[stack.length-1];
    if(k==='flip') view=<DrawnCard key="flip"/>;
    else if(k==='detail') view=<CardDetail key="detail"/>;
    else if(k.indexOf('element:')===0) view=<ElementDetail key={k} idx={parseInt(k.split(':')[1])||0}/>;
    else if(k==='spreads') view=<Spreads key="spreads"/>;
    else if(k==='ask') view=<Ask key="ask"/>;
    else if(k==='result') view=<Result key="result"/>;
    else if(k.indexOf('energy:')===0) view=<EnergyDetail key={k} dim={k.split(':')[1]}/>;
    else if(k==='trend') view=<Trend key="trend"/>;
    else if(k==='diary') view=<Diary key="diary"/>;
    else if(k==='wish') view=<Wish key="wish"/>;
    else if(k==='review') view=<Review key="review"/>;
    else if(k==='checkin') view=<Checkin key="checkin"/>;
    else if(k==='settings') view=<Settings key="settings"/>;
  }

  return (
    <Ctx.Provider value={ctx}>
      <div className="sys-e3" style={{position:'relative',width:'300px',height:'640px'}}>
        {view}
        {toast && <div className="toast">{toast}</div>}
      </div>
    </Ctx.Provider>
  );
}

      </div>

  );
}
