<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光映照 · 塔罗 × 星座 · 双知识体系融合</title>
<meta name="description" content="星光映照塔罗小程序 — 塔罗×星座双体系融合：今日星座能量 / 新月许愿 / 满月复盘 / 水逆模式 / 本命星盘三要素 · E3 奶油疗愈语言">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   星光映照 · 塔罗 × 星座 · 双知识体系融合
   延续 E3 奶油疗愈语言：奶油 #FAF6EF / 雾粉 #E8C4BE / 细金 #C9A97C / 墨 #3D3A36
   新增语汇：能量条（雾蓝低 / 月白中 / 暖金高）、水逆海浪蓝、水彩 CSS 插图
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#29231E;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#EFE4D6}
#root{min-height:100%}
::selection{background:rgba(232,196,190,.45)}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
img{-webkit-user-drag:none;user-select:none}

/* ── 画布 ── */
.stage{max-width:1760px;margin:0 auto;padding:44px 24px 88px}
.stage h1{font-family:'Noto Serif SC',serif;font-weight:500;font-size:30px;text-align:center;letter-spacing:14px;color:#F0E2D0;margin-bottom:10px}
.stage .sub{text-align:center;font-size:11px;color:rgba(201,169,124,.85);letter-spacing:4px;margin-bottom:6px}
.stage .meta{text-align:center;font-size:11.5px;color:rgba(239,228,214,.35);letter-spacing:1px;margin-bottom:40px}
.grid{display:flex;flex-wrap:wrap;gap:46px 30px;justify-content:center;align-items:flex-start}
.zone{display:flex;flex-direction:column;align-items:center}
.zoom{transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.zoom:hover{transform:scale(1.03)}
.cap{margin-top:14px;font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:3px;color:rgba(240,226,208,.85)}
.cap-sub{margin-top:4px;font-size:11px;letter-spacing:1px;color:rgba(240,226,208,.38)}
@media(max-width:760px){.grid{flex-direction:column;align-items:center}}

/* ═══════════════════ E3 · 奶油疗愈基元（与 stars-E3-real 一致） ═══════════════════ */
.sys-e3{
  --cream:#FAF6EF; --cream-hi:#FFFDF8; --paper:#F2ECDF;
  --pink:#E8C4BE; --pink-deep:#DCA9A1; --pink-ink:#B08A82;
  --gold:#C9A97C; --gold-deep:#B08F52;
  --line:rgba(201,169,124,.28); --line-soft:rgba(201,169,124,.38);
  --lav:#D8D2E4;
  --ink:#3D3A36; --ink-soft:#8A8478; --ink-faint:#B0AA9C;
  --serif:'Noto Serif SC',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --hand:'Ma Shan Zheng','Noto Serif SC',cursive;
  --num:'EB Garamond','Noto Serif SC',serif;
  --shadow:0 2px 10px rgba(61,58,54,.06);
  --hi:inset 0 1px 0 rgba(255,255,255,.6);
  --cardline:0 0 0 1px rgba(201,169,124,.32),0 10px 26px rgba(61,58,54,.14),var(--hi);
  /* 双体系新增：海浪蓝（水逆）+ 雾蓝（低能量） */
  --wave:#B7CEDB; --wave-soft:#DFE9EF; --wave-deep:#7FA3B8; --wave-ink:#5C7180;
  --mist:#B9CBD9; --mist-deep:#7C93A8; --mist-soft:#DCE5EC;
}
.sys-e3 .screen{
  background:var(--cream);color:var(--ink);position:relative;overflow:hidden;
  font-family:var(--serif);
}
.sys-e3 .wash{position:absolute;border-radius:50%;pointer-events:none;filter:blur(38px);z-index:0}
.wxcapsule{
  position:absolute;top:13px;right:8px;z-index:30;display:flex;gap:4px;pointer-events:none;
}
.wxcapsule .cap{
  width:40px;height:32px;border-radius:7px;
  background:rgba(255,253,248,.92);border:0.5px solid rgba(201,169,124,.3);
  box-shadow:0 2px 6px rgba(61,58,54,.05);
  display:flex;align-items:center;justify-content:center;
}
.wxcapsule .cap svg{fill:#3D3A36}
.wxcapsule .cap:first-child{flex-direction:column;gap:3px}
.wxcapsule .cap:first-child span{display:block;width:3px;height:3px;border-radius:50%;background:#3D3A36}
.wxcapsule .cap .circle{width:15px;height:15px;border-radius:50%;border:1.5px solid #3D3A36}
.backbtn{
  position:absolute;left:16px;top:56px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,253,248,.92);border:1px solid var(--line-soft);
  box-shadow:var(--shadow),var(--hi);
  display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer;
  transition:transform .15s ease;
}
.backbtn:active{transform:scale(.93)}
.pad{position:relative;z-index:2}
.microlabel{font-family:var(--sans);font-weight:400;font-size:11px;color:rgba(201,169,124,.9);letter-spacing:4px}
.brand{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--ink);letter-spacing:7px;margin-top:4px}
.gold-dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--gold);flex-shrink:0}
.date-row{display:flex;align-items:center;gap:7px;font-family:var(--num);font-size:12px;color:var(--ink-soft);letter-spacing:1.5px;margin-top:8px}
.quote{font-family:var(--hand);font-size:22px;color:var(--ink);margin-top:8px;transform:rotate(-1deg);letter-spacing:1px;line-height:1.5}
.quote-sub{font-family:var(--sans);font-size:11px;color:var(--ink-soft);margin-top:5px;letter-spacing:3px}
.h-title{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:3px;color:var(--ink)}
.h-sub{font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:3px}
.pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 12px;border-radius:999px;
  background:var(--cream-hi);border:1px solid rgba(201,169,124,.4);color:#8A8478;
  font-family:var(--sans);font-size:11px;letter-spacing:2.5px;
}
.pill-lav{background:var(--lav);border-color:rgba(201,169,124,.28);color:#6E6676}
.hint-line{margin-top:6px;text-align:center;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1px}
.divider{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0}
.divider i{width:28px;height:1px;background:rgba(201,169,124,.35)}
.divider b{width:3px;height:3px;border-radius:50%;background:rgba(201,169,124,.55)}
.num{font-family:var(--num);font-style:normal}
.art{
  position:relative;overflow:hidden;border-radius:16px;
  border:1px solid var(--line);
  box-shadow:var(--cardline);
  background:var(--cream-hi);
}
.art::after{
  content:'';position:absolute;inset:0 0 auto 0;height:38%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,253,248,.32),rgba(255,253,248,0));
  border-radius:16px 16px 0 0;
}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art-ph{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#F4EDE0,#EFE6D8);
  border:1px dashed rgba(201,169,124,.5);border-radius:inherit;
  font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:2px;text-align:center;padding:10px;
}
.btn{
  height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-family:var(--serif);font-weight:500;font-size:14px;letter-spacing:3px;
  transition:transform .15s ease,box-shadow .15s ease,opacity .2s ease;user-select:none;
}
.btn:active{transform:scale(.965)}
.btn-primary{
  background:var(--pink);color:#5C4A3A;
  box-shadow:var(--shadow),var(--hi);
}
.btn-ghost{background:var(--cream-hi);border:1.5px solid rgba(201,169,124,.55);color:#7A705F;box-shadow:var(--hi)}
.btn-off{opacity:.4;pointer-events:none}
.btn-gold{
  background:linear-gradient(135deg,#E3C795,#C9A97C);color:#4B3B24;
  box-shadow:var(--shadow),var(--hi);
}
.w108{width:108px;flex-shrink:0}
.flex1{flex:1}
.tabbar{
  position:relative;z-index:5;margin:8px 14px 0;height:52px;border-radius:20px;
  display:flex;align-items:center;justify-content:space-around;
  background:rgba(255,253,248,.6);border:1px solid rgba(201,169,124,.22);
  box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:2px;cursor:pointer}
.tab.on{color:var(--ink);font-weight:500}
.tab .tdot{width:3.5px;height:3.5px;border-radius:50%;background:transparent}
.tab.on .tdot{background:var(--gold)}
.toast{
  position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;
  background:rgba(61,58,54,.94);color:#FFF8EE;font-family:var(--sans);font-size:12px;letter-spacing:1px;
  padding:10px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(61,58,54,.3);
  animation:toastin 1.9s ease forwards;pointer-events:none;white-space:nowrap;
}
@keyframes toastin{0%{opacity:0;transform:translateX(-50%) translateY(10px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}
.paint-wrap{position:relative;margin:10px auto 0;width:205px;z-index:3}
.painting{width:205px;height:308px;border-radius:16px;overflow:hidden;cursor:pointer;animation:floaty 5.5s ease-in-out infinite}
.painting img{object-position:55% 50%}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.phrase{font-family:var(--serif);font-size:15px;color:var(--ink);text-align:center;margin-top:8px;letter-spacing:2px}
.hint-flower{
  position:absolute;right:2px;bottom:56px;width:126px;height:116px;z-index:1;pointer-events:none;
  opacity:.5;transform:scaleX(-1) rotate(-7deg);
}
.hint-flower img{width:100%;height:100%;object-fit:cover;display:block;border-radius:12px}
.spark{position:absolute;z-index:25;pointer-events:none;animation:burst .75s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(170deg);opacity:0}}

/* ═══════════════ 屏1 · 今日 · 星座能量 ─ 新核心 ═══════════════ */
.zodiac{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:999px;
  background:linear-gradient(135deg,#F0E3C8,#E8D7B6);border:1px solid rgba(201,169,124,.5);
  color:#7A6238;font-family:var(--serif);font-size:12px;letter-spacing:2px;margin-left:auto;
  box-shadow:var(--hi);
}
.zodiac b{font-weight:500;font-size:14px;line-height:1}
.moonbadge{
  display:flex;align-items:center;justify-content:center;gap:5px;margin-top:9px;
  height:22px;border-radius:999px;background:var(--lav);border:1px solid rgba(201,169,124,.3);
  color:#5F5A74;font-family:var(--sans);font-size:11px;letter-spacing:1.5px;width:fit-content;margin-left:auto;margin-right:auto;
  padding:0 12px;
}
.sec-title{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.sec-title .t{font-family:var(--serif);font-size:14px;letter-spacing:2.5px;color:var(--ink)}
.sec-title .s{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px}
.sec-title .bar{flex:1;height:1px;background:rgba(201,169,124,.25)}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px}
.ecell{
  background:var(--cream-hi);border:1px solid var(--line);border-radius:13px;
  padding:4px 9px 5px;box-shadow:var(--hi);cursor:default;
  transition:transform .18s ease,box-shadow .18s ease;
}
.ecell:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(61,58,54,.09),var(--hi)}
.e-head{display:flex;align-items:baseline;justify-content:space-between}
.e-label{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);letter-spacing:2px;line-height:1.3}
.e-val{font-size:15px;color:var(--ink);letter-spacing:.5px;line-height:1.3}
.e-val small{font-size:10px;color:var(--ink-faint);margin-left:1px}
.ebar{margin-top:4px;height:6px;border-radius:999px;overflow:hidden}
.ebar-fill{height:100%;border-radius:999px;transition:width .5s ease,filter .2s ease}
.ecell:hover .ebar-fill{filter:brightness(1.1)}
.e-line{font-family:var(--sans);font-size:10.5px;margin-top:3px;letter-spacing:.5px;line-height:1.35;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.e-flag{
  font-size:9.5px;padding:0 6px;height:14px;border-radius:999px;display:inline-flex;align-items:center;
  background:rgba(124,147,168,.14);color:#5C7180;letter-spacing:1px;flex-shrink:0;
}
.summary{
  margin-top:6px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(160deg,#FFF9EC,#F6EDDB);box-shadow:var(--hi);
  padding:6px 11px 7px;text-align:center;
}
.summary .s-main{font-family:var(--serif);font-size:11.5px;color:var(--ink);letter-spacing:2px;line-height:1.4}
.summary .s-act{
  display:inline-flex;align-items:center;gap:5px;margin-top:3px;height:19px;padding:0 10px;border-radius:999px;
  background:var(--cream-hi);border:1px solid rgba(201,169,124,.4);color:#8A6F4E;
  font-family:var(--sans);font-size:10.5px;letter-spacing:1px;white-space:nowrap;
}
.tomorrow{
  margin-top:6px;display:flex;align-items:center;gap:9px;border-radius:14px;
  background:var(--cream-hi);border:1px solid var(--line);box-shadow:var(--hi);
  padding:3px 10px;cursor:pointer;transition:transform .18s ease;
}
.tomorrow:hover{transform:translateY(-2px)}
.tom-thumb{width:26px;height:40px;border-radius:7px;overflow:hidden;border:1px solid var(--line);flex-shrink:0;box-shadow:var(--shadow)}
.tom-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tom-txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.tom-txt b{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);letter-spacing:2.5px;font-weight:400}
.tom-txt span{font-family:var(--serif);font-size:12.5px;color:var(--ink);letter-spacing:1.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tom-arrow{font-family:var(--num);font-size:19px;color:var(--gold);line-height:1}
.quick{display:flex;gap:9px;margin-top:6px}
.quick .btn{height:44px;font-size:13px}

/* ═══════════════ 屏2 · 新月许愿 · 仪式 ═══════════════ */
.ritual-moon{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:12px;position:relative}
.moonbox{
  position:relative;width:88px;height:88px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 38% 34%,#F4E3BC,#D9B878 60%,#C9A97C);
  box-shadow:0 0 26px rgba(201,169,124,.5),var(--hi);
  animation:moonpulse 4s ease-in-out infinite;
}
.moonbox::after{
  content:'';position:absolute;inset:0;border-radius:50%;background:var(--cream);
  animation:moonphase 7s ease-in-out infinite;
}
@keyframes moonpulse{0%,100%{box-shadow:0 0 20px rgba(201,169,124,.42),var(--hi)}50%{box-shadow:0 0 30px rgba(201,169,124,.62),var(--hi)}}
@keyframes moonphase{0%,100%{transform:translateX(30%)}50%{transform:translateX(40%)}}
.candle{flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(201,169,124,.25));animation:candleflick 3.4s ease-in-out infinite}
.candle.right{animation-delay:.6s}
@keyframes candleflick{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.guide-text{text-align:center;font-family:var(--serif);font-size:14px;color:var(--ink);letter-spacing:1px;line-height:1.9;margin-top:12px}
.wish-form{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.wish-input{
  width:100%;height:48px;border-radius:999px;border:1px solid rgba(201,169,124,.4);
  background:var(--cream-hi);box-shadow:var(--hi);padding:0 20px;
  font-family:var(--serif);font-size:13px;color:var(--ink);outline:none;letter-spacing:1px;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.wish-input::placeholder{color:var(--ink-faint);font-family:var(--sans);font-size:12px;letter-spacing:1.5px}
.wish-input:focus{border-color:rgba(201,169,124,.7);box-shadow:0 0 0 3px rgba(201,169,124,.12),var(--hi)}
.wish-count{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:7px;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1px}
.wish-count b{font-family:var(--num);font-weight:500;color:var(--gold-deep)}
.wish-submit{margin-top:9px}
.ritual-hint{margin-top:10px;text-align:center;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px}
.wish-success{
  margin-top:14px;border-radius:18px;border:1px solid rgba(201,169,124,.4);
  background:linear-gradient(165deg,#FFF9EC,#F4EADA);box-shadow:var(--hi);
  padding:18px 16px 16px;text-align:center;position:relative;
  animation:successin .55s cubic-bezier(.2,.8,.3,1.15) both;
}
@keyframes successin{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
.moon-crop{
  width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0;
  border:1px solid var(--line-soft);box-shadow:var(--shadow),var(--hi);background:var(--cream-hi);
}
.moon-crop img{width:100%;height:100%;object-fit:cover;display:block}
.wish-success .moon-crop{margin:0 auto 10px;width:64px;height:64px;border-radius:50%}
.wish-ok-title{font-family:var(--serif);font-size:16px;color:var(--ink);letter-spacing:2px}
.wish-ok-sub{font-family:var(--sans);font-size:11px;color:var(--ink-soft);margin-top:6px;letter-spacing:1px;line-height:1.8}
.wish-ok-list{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.wish-ok-item{
  font-family:var(--sans);font-size:11.5px;color:#6B5B48;letter-spacing:1px;
  background:rgba(255,253,248,.8);border:1px solid rgba(201,169,124,.25);border-radius:999px;
  padding:6px 14px;width:fit-content;margin:0 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wish-again{
  margin-top:12px;display:inline-flex;align-items:center;height:38px;padding:0 20px;border-radius:999px;
  background:var(--cream-hi);border:1px solid rgba(201,169,124,.45);color:#7A705F;
  font-family:var(--serif);font-size:12px;letter-spacing:2px;cursor:pointer;
  transition:transform .15s ease;
}
.wish-again:active{transform:scale(.95)}

/* ═══════════════ 屏3 · 满月复盘 · AI 温柔复盘 ═══════════════ */
.fullmoon{
  width:80px;height:80px;border-radius:50%;overflow:hidden;margin:9px auto 0;
  border:1px solid var(--line);box-shadow:0 0 24px rgba(201,169,124,.45),var(--hi);
  position:relative;animation:floaty 6s ease-in-out infinite;
}
.fullmoon img{width:100%;height:100%;object-fit:cover;display:block}
.review-card{
  margin-top:9px;border-radius:16px;border:1px solid var(--line);
  background:var(--cream-hi);box-shadow:var(--shadow),var(--hi);
  overflow:hidden;cursor:pointer;transition:box-shadow .2s ease;
}
.review-card:hover{box-shadow:0 8px 18px rgba(61,58,54,.08),var(--hi)}
.review-head{display:flex;align-items:center;gap:9px;padding:8px 11px 0}
.review-name{display:flex;flex-direction:column;gap:1px}
.review-name b{font-family:var(--serif);font-size:13px;color:var(--ink);letter-spacing:2px;font-weight:500}
.review-name i{font-family:var(--sans);font-style:normal;font-size:10.5px;color:var(--ink-faint);letter-spacing:1px}
.review-tag{margin-left:auto;font-family:var(--sans);font-size:10.5px;color:#8A6F4E;letter-spacing:2px;border:1px solid rgba(201,169,124,.4);border-radius:999px;padding:3px 10px}
.review-body{padding:8px 11px 9px}
.review-body p{font-family:var(--serif);font-size:13px;line-height:1.9;color:var(--ink);letter-spacing:.5px}
.review-body p em{font-style:normal;color:var(--pink-ink)}
.review-fold{
  display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;padding-top:6px;
  border-top:1px dashed rgba(201,169,124,.3);
  font-family:var(--sans);font-size:11px;color:#8A6F4E;letter-spacing:2px;
}
.review-fold i{font-style:normal;transition:transform .3s ease;display:inline-block}
.review-card.open .review-fold i{transform:rotate(180deg)}
.review-chips{display:flex;gap:6px;margin-top:8px}
.review-chip{
  font-family:var(--sans);font-size:11px;color:#7A705F;letter-spacing:1.5px;
  background:#F7F1E4;border:1px solid rgba(201,169,124,.35);border-radius:999px;padding:4px 11px;
}
.review-body.hide p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wish-head{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.wish-head .t{font-family:var(--serif);font-size:14px;letter-spacing:2.5px;color:var(--ink)}
.wish-head .s{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px}
.wish-head .bar{flex:1;height:1px;background:rgba(201,169,124,.25)}
.wishlist{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.wish-row{
  display:flex;align-items:center;gap:10px;height:42px;border-radius:14px;
  background:var(--cream-hi);border:1px solid var(--line);box-shadow:var(--hi);
  padding:0 12px;
}
.wish-ic{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.wish-row .w-txt{flex:1;font-family:var(--serif);font-size:13px;color:var(--ink);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wish-row.done .w-txt{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:rgba(201,169,124,.7)}
.w-tag{
  flex-shrink:0;font-family:var(--sans);font-size:10.5px;letter-spacing:1.5px;border-radius:999px;padding:3px 10px;
}
.w-tag.done{background:rgba(201,169,124,.16);color:#8A6F4E;border:1px solid rgba(201,169,124,.4)}
.w-tag.grow{background:rgba(159,184,154,.14);color:#5E7A5C;border:1px solid rgba(159,184,154,.45)}
.w-tag.wait{background:rgba(216,210,228,.28);color:#6E6676;border:1px solid rgba(216,210,228,.6)}
.share-wrap{margin-top:10px}

/* ═══════════════ 屏4 · 水逆模式 · 全站语气 ═══════════════ */
.water-banner{
  position:relative;margin:0 12px;border-radius:14px;overflow:hidden;
  background:linear-gradient(135deg,#E3EDF3,#C9DAE6);
  border:1px solid rgba(127,163,184,.4);
  box-shadow:var(--hi);
  display:flex;align-items:center;gap:9px;padding:6px 12px;
}
.water-banner .wave-ic{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:rgba(255,253,248,.75);border:1px solid rgba(127,163,184,.35);display:flex;align-items:center;justify-content:center}
.water-banner .wb-t{font-family:var(--serif);font-size:13px;color:#4A6272;letter-spacing:2px}
.water-banner .wb-s{font-family:var(--sans);font-size:10.5px;color:#6E8395;letter-spacing:1.5px;margin-top:1px}
.water-banner .wb-flag{
  margin-left:auto;flex-shrink:0;font-family:var(--sans);font-size:10.5px;color:#4A6272;letter-spacing:2px;
  background:rgba(255,253,248,.8);border:1px solid rgba(127,163,184,.4);border-radius:999px;padding:3px 9px;
}
.tip-card{
  margin-top:7px;border-radius:15px;border:1px solid rgba(127,163,184,.45);
  background:linear-gradient(160deg,#F3F8FA,#E9F0F4);box-shadow:var(--hi);
  padding:7px 12px;
}
.tip-card .tip-head{display:flex;align-items:center;gap:6px}
.tip-card .tip-title{font-family:var(--serif);font-size:13px;color:#4A6272;letter-spacing:2px}
.tip-card p{font-family:var(--serif);font-size:12px;color:#5C7180;line-height:1.7;letter-spacing:.5px;margin-top:3px}
.tip-card p.wave-card{color:var(--pink-ink)}
.stable-card{
  margin-top:6px;border-radius:15px;border:1px solid rgba(127,163,184,.4);
  background:var(--cream-hi);box-shadow:var(--hi);padding:7px 12px 8px;
}
.stable-card .st-title{font-family:var(--serif);font-size:13px;color:var(--ink);letter-spacing:3px;text-align:center}
.stable-cols{display:flex;gap:9px;margin-top:5px}
.stable-col{
  flex:1;border-radius:12px;padding:5px 5px 6px;text-align:center;
  border:1px solid rgba(201,169,124,.3);background:#FBF6EA;
}
.stable-col.slow{background:#F2F7FA;border-color:rgba(127,163,184,.4)}
.st-tag{
  display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  font-family:var(--serif);font-size:10.5px;color:#FFF8EE;background:linear-gradient(135deg,#DDBE84,#C9A97C);
}
.stable-col.slow .st-tag{background:linear-gradient(135deg,#AFC9D8,#7FA3B8)}
.stable-col p{font-family:var(--serif);font-size:11px;color:#6B5B48;letter-spacing:1.5px;margin-top:3px;line-height:1.6;white-space:nowrap}
.stable-col.slow p{color:#5C7180}

/* ═══════════════ 屏5 · 本命星盘三要素 · 付费引流 ═══════════════ */
.birth-field{display:flex;flex-direction:column;gap:6px;margin-top:11px}
.birth-field label{font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:2.5px;display:flex;align-items:baseline;gap:6px}
.birth-field label i{font-style:normal;font-size:10px;color:var(--ink-faint);letter-spacing:1px}
.birth-input{
  width:100%;height:46px;border-radius:14px;border:1px solid rgba(201,169,124,.4);
  background:var(--cream-hi);box-shadow:var(--hi);padding:0 16px;
  font-family:var(--num);font-size:14px;color:var(--ink);outline:none;letter-spacing:1.5px;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.birth-input::placeholder{font-family:var(--sans);font-size:12px;color:var(--ink-faint);letter-spacing:1px}
.birth-input:focus{border-color:rgba(201,169,124,.7);box-shadow:0 0 0 3px rgba(201,169,124,.12),var(--hi)}
.tri-card{
  margin-top:9px;height:78px;perspective:900px;cursor:pointer;
}
.tri-inner{
  position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.7,.3,1);
  transform-style:preserve-3d;
}
.tri-card.flip .tri-inner{transform:rotateY(180deg)}
.tri-face{
  position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;gap:12px;padding:0 14px;
  border:1px solid var(--line);box-shadow:var(--shadow),var(--hi);
}
.tri-front{background:var(--cream-hi)}
.tri-front .tri-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.tri-front .tri-name{font-family:var(--serif);font-size:14px;color:var(--ink);letter-spacing:2.5px;white-space:nowrap}
.tri-front .tri-sub{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:2px}
.tri-front .tri-hint{margin-left:auto;flex-shrink:0;font-family:var(--sans);font-size:10.5px;color:#B0AA9C;letter-spacing:1.5px;display:flex;align-items:center;gap:4px}
.tri-front .tri-hint i{font-style:normal;font-size:13px;color:var(--gold);display:inline-block;animation:hintspin 2.6s ease-in-out infinite}
@keyframes hintspin{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.tri-back{transform:rotateY(180deg);background:linear-gradient(160deg,#FFF9EC,#F5ECDA)}
.tri-back p{font-family:var(--serif);font-size:13px;color:#6B5B48;letter-spacing:1px;line-height:1.7}
.sun-ic{width:50px;height:50px;flex-shrink:0}
.moon-ic{width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--line-soft);box-shadow:var(--shadow),var(--hi)}
.moon-ic img{width:100%;height:100%;object-fit:cover;display:block}
.report-card{
  margin-top:11px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(170deg,#FFF9EC,#F3E9D6);box-shadow:var(--shadow),var(--hi);
  padding:12px 14px 13px;
}
.rep-head{display:flex;align-items:center;justify-content:space-between}
.rep-head .t{font-family:var(--serif);font-size:14px;color:var(--ink);letter-spacing:2.5px}
.rep-head .price{font-family:var(--num);font-size:15px;color:var(--gold-deep);letter-spacing:1px}
.rep-head .price small{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);letter-spacing:1px}
.rep-rows{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.rep-row{display:flex;align-items:baseline;gap:9px;font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);letter-spacing:.5px;line-height:1.5}
.rep-row b{font-family:var(--serif);font-weight:500;font-size:12px;color:#8A6F4E;letter-spacing:2px;flex-shrink:0;width:52px}
.rep-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-btn{margin-top:10px}
.rep-foot{margin-top:9px;text-align:center;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z=="></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1=="></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj"></script>
<script type="text/babel" data-presets="env,react">
const {useState,useEffect,useRef} = React;

/* ═══════════════════════════════════════════════════════════
   星光映照 · 塔罗 × 星座 · 双知识体系融合
   插画：assets/web/*.jpg 真实水彩 + SVG 手绘感（太阳/天秤/蜡烛/新月）
   ═══════════════════════════════════════════════════════════ */

/* ── 微信胶囊 ── */
function WxCapsule(){
  return (
    <div className="wxcapsule">
      <div className="cap"><span/><span/><span/></div>
      <div className="cap"><div className="circle"/></div>
    </div>
  );
}

/* ── 通用图标（仅 UI 图标，非插画） ── */
const Icon = ({name,color,size=20}) => {
  const c = color||'currentColor';
  const paths = {
    home:<><path d="M3 11.2 10 5l7 6.2" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M5.5 10.5V17h9v-6.5" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></>,
    moon:<path d="M14.6 4.2A6.2 6.2 0 1 0 15.8 15.6a5 5 0 0 1-1.2-11.4z" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round"/>,
    star:<path d="M10 2.8c.9 3.4 2.8 5.3 6.2 6.2-3.4.9-5.3 2.8-6.2 6.2-.9-3.4-2.8-5.3-6.2-6.2 3.4-.9 5.3-2.8 6.2-6.2z" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round"/>,
    user:<><circle cx="10" cy="7.5" r="3.2" fill="none" stroke={c} strokeWidth="1.6"/><path d="M4.5 17c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round"/></>,
  };
  return <svg width={size} height={size} viewBox="0 0 20 20">{paths[name]}</svg>;
};

const TABS = [
  {key:'today', name:'今日', ic:'home'},
  {key:'wish',  name:'许愿', ic:'moon'},
  {key:'chart', name:'星盘', ic:'star'},
  {key:'mine',  name:'我的', ic:'user'},
];

/* ── 真实插画资产（assets/web/*.jpg） ── */
const ASSETS = {
  moon:   'assets/web/moon-card.jpg',      // 月亮+安睡兔子水彩
  back:   'assets/web/card-back.jpg',      // 金线月星纹牌背
  flower: 'assets/web/hint-flower.jpg',    // 淡粉水彩小花
};

function Art({src, alt, className='', style, lazy=true, ph='插画'}) {
  const [err, setErr] = useState(false);
  if (err) {
    return (
      <div className={'art-ph '+(className.includes('bleed')?'ph-bleed':'')} style={style}>
        <span>{alt || ph}</span>
      </div>
    );
  }
  return <img src={src} alt={alt||ph} className={className} style={style}
    loading={lazy?'lazy':undefined} onError={()=>setErr(true)} draggable="false"/>;
}

/* 四芒星光（氛围粒子，非插画） */
const STAR_PATH='M0,-7 C1.2,-3 3,-1.2 7,0 C3,1.2 1.2,3 0,7 C-1.2,3 -3,1.2 -7,0 C-3,-1.2 -1.2,-3 0,-7 Z';
const Spark=({x=0,y=0,s=1,fill='#D8C4A0',op=0.7,r=0,style})=>(
  <svg width={10*s} height={10*s} viewBox="-8 -8 16 16" style={style}>
    <path d={STAR_PATH} transform={`scale(${s}) rotate(${r})`} fill={fill} opacity={op}/>
  </svg>
);

function BackArrow({onClick}){
  return (
    <div className="backbtn" onClick={onClick}>
      <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="#8A8478" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
    </div>
  );
}

/* ── SVG 手绘感水彩插画：新月蜡烛 / 太阳 / 天秤 ── */
const SVG_DEFS = (
  <defs>
    <linearGradient id="waxG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stopColor="#FBF5E8"/><stop offset=".5" stopColor="#F3EAD7"/><stop offset="1" stopColor="#E9DDBF"/>
    </linearGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stopColor="#F6DFA6"/><stop offset=".55" stopColor="#E3C08F"/><stop offset="1" stopColor="#C9A97C"/>
    </linearGradient>
    <radialGradient id="scaleG" cx=".4" cy=".35" r=".9">
      <stop offset="0" stopColor="#F2E9D6"/><stop offset="1" stopColor="#E3D5BC"/>
    </radialGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
);

function Candle({flip=false}){
  return (
    <svg width="30" height="54" viewBox="0 0 34 60" className={'candle'+(flip?' right':'')}>
      {SVG_DEFS}
      <circle cx="17" cy="16" r="12" fill="#F0DC9E" opacity=".45" filter="url(#softBlur)"/>
      <path d="M17 7c2.8 3.8 3.9 6.6 3.9 9a3.9 3.9 0 1 1-7.8 0c0-2.4 1.1-5.2 3.9-9z" fill="#E8B45A"/>
      <path d="M17 10.5c1.4 2 1.4 3.8 0 4.8-1.4-1-1.4-2.8 0-4.8z" fill="#FFF6E0"/>
      <path d="M17 18c3.6 0 5.8 2.2 5.8 4.4v26.6c0 2-1.4 3.4-3.4 3.4H14.6c-2 0-3.4-1.4-3.4-3.4V22.4c0-2.2 2.2-4.4 5.8-4.4z" fill="url(#waxG)" stroke="#D9C89E" strokeWidth="1.1"/>
      <path d="M11.2 34h11.6v2.4H11.2z" fill="#FFF8EC" opacity=".85"/>
    </svg>
  );
}

function SunIcon(){
  return (
    <svg viewBox="0 0 84 84" className="sun-ic">
      {SVG_DEFS}
      {[0,30,60,90,120,150].map(a=>
        <ellipse key={a} cx="42" cy="13" rx="6" ry="13.5" fill="#DDBE84" opacity=".6" transform={`rotate(${a} 42 42)`} filter="url(#softBlur)"/>)}
      <circle cx="42" cy="42" r="24" fill="url(#sunG)"/>
      <circle cx="36.5" cy="36.5" r="9.5" fill="#FBF0D5" opacity=".6"/>
    </svg>
  );
}

function ScalesIcon(){
  return (
    <svg viewBox="0 0 84 84" className="sun-ic">
      {SVG_DEFS}
      <circle cx="42" cy="42" r="34" fill="url(#scaleG)" opacity=".9"/>
      <path d="M42 16v38" stroke="#B08F52" strokeWidth="1.8" strokeLinecap="round"/>
      <path d="M26 24h32" stroke="#B08F52" strokeWidth="1.8" strokeLinecap="round"/>
      <path d="M26 24l-8 8M58 24l8 8" stroke="#B08F52" strokeWidth="1.5" strokeLinecap="round"/>
      <path d="M12 32a7 8 0 0 0 14 0z" fill="#EFE4C8" stroke="#B08F52" strokeWidth="1.4" strokeLinejoin="round"/>
      <path d="M58 32a7 8 0 0 0 14 0z" fill="#EFE4C8" stroke="#B08F52" strokeWidth="1.4" strokeLinejoin="round"/>
      <path d="M42 54l-3.4 5.4h6.8z" fill="#B08F52"/>
    </svg>
  );
}

/* 许愿状态小图标：打勾 / 生长 / 待回应 */
const WishDone=()=>(
  <svg width="13" height="13" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="rgba(201,169,124,.28)" stroke="#B08F52" strokeWidth="1.2"/><path d="M4.8 8.2l2.2 2.2 4.2-4.6" fill="none" stroke="#8A6F4E" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
);
const WishGrow=()=>(
  <svg width="14" height="15" viewBox="0 0 16 17"><path d="M8 16V8.5" stroke="#7A9A76" strokeWidth="1.5" strokeLinecap="round"/><path d="M8 9.5C8 6.2 10 4 13.5 2.8c-.2 3.6-2.4 5.8-5.5 6.7z" fill="#A8C4A0" opacity=".9"/><path d="M8 8.2C8 5.2 6.2 3.2 3 2.2c.4 3.4 2.4 5.2 5 6z" fill="#BCD3B4" opacity=".9"/></svg>
);
const WishWait=()=>(
  <svg width="13" height="13" viewBox="0 0 16 16"><path d="M13.2 9.6A5.8 5.8 0 1 1 6.6 3a4.6 4.6 0 0 0 6.6 6.6z" fill="none" stroke="#8E86A2" strokeWidth="1.4" strokeLinejoin="round"/></svg>
);

/* ── 星座能量条（雾蓝低 / 月白中 / 暖金高） ── */
const ELV = {
  high:{track:'rgba(201,169,124,.2)',  grad:'linear-gradient(90deg,#E8CB9B,#C9A97C)', t:'#8A6F4E'},
  mid: {track:'rgba(201,169,124,.16)', grad:'linear-gradient(90deg,#F0E7D7,#E0D2B8)', t:'#8A8478'},
  low: {track:'rgba(185,203,217,.28)', grad:'linear-gradient(90deg,#C6D6E2,#A9BFD1)', t:'#5C7180'},
};
function EnergyCell({k,v,lv,line,flag}){
  const c=ELV[lv];
  return (
    <div className="ecell">
      <div className="e-head">
        <span className="e-label">{k}</span>
        <span className="e-val num">{v}<small>%</small></span>
      </div>
      <div className="ebar" style={{background:c.track}}>
        <div className="ebar-fill" style={{width:v+'%',background:c.grad}}/>
      </div>
      <div className="e-line" style={{color:c.t}}>
        <span className="e-line-txt">{line}</span>
        {flag&&<span className="e-flag">{flag}</span>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   === 屏 1 · 今日 === 塔罗×星座融合首页
   ═══════════════════════════════════════════════════════════ */
function ScreenToday(){
  const [toast,setToast]=useState('');
  const show=(t)=>{setToast(t);setTimeout(()=>setToast(''),1900);};
  const E=[
    {k:'事业',v:73,lv:'high',line:'想法很多，先落地'},
    {k:'爱情',v:81,lv:'high',line:'主动一点，会发光'},
    {k:'健康',v:57,lv:'low', line:'午后晒晒太阳'},
    {k:'人际',v:64,lv:'mid', line:'给旧友一句问候'},
  ];
  return (
    <div className="sys-e3">
      <div className="screen" style={{width:300,height:640,borderRadius:34,boxShadow:'0 30px 60px rgba(0,0,0,.55)'}} data-screen-label="s1-today">

    <div className="stage">
      <h1>星 光 映 照</h1>
      <div className="sub">塔罗 × 星座 · 双知识体系融合</div>
      <div className="meta">塔罗是镜子，不是预言 · AI 陪伴式自我探索 · 都市女性 22-35 · E3 奶油疗愈语言</div>
      <div className="grid">
        {zones.map(z=>
          <div key={z.l} className="zone">
            <div className="zoom">{z.el}</div>
            <div className="cap">{z.l}</div>
            <div className="cap-sub">{z.d}</div>
          </div>)}
      </div>
    </div>
  );
}

/* ── 自检：每屏内容是否超出 640 高 + 真实插画是否加载成功 ── */
function App(){
  const hm=(location.hash||'').match(/^#d?([1-5])$/);
  const want=hm?parseInt(hm[1],10):0;
  const demo=(location.hash||'').indexOf('#d')===0;
  /* demo 模式：#dN 自动演示屏 N 的交互态（许愿成功 / 复盘展开 / 三要素生成） */
  useEffect(()=>{
    if(!demo)return;
    const t=setTimeout(()=>{
      const screen=document.querySelector('[data-screen-label^="s'+(want||1)+'"]');
      if(!screen)return;
      const inputs=screen.querySelectorAll('input.wish-input');
      if(inputs.length){
        const setter=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
        ['和月亮一起去海边','每周读完一本书','学会一项新技能'].forEach((v,i)=>{if(inputs[i]){setter.call(inputs[i],v);inputs[i].dispatchEvent(new Event('input',{bubbles:true}));}});
      }
      setTimeout(()=>{
        const card=screen.querySelector('.review-card');
        if(card)card.click();
        const btn=screen.querySelector('.btn-primary');
        if(btn)btn.click();
        setTimeout(()=>{
          const tri=screen.querySelectorAll('.tri-card');
          if(tri.length>1)tri[1].click(); /* 演示三要素卡翻面 */
        },450);
      },300);
    },900);
    return ()=>clearTimeout(t);
  },[demo,want]);
  useEffect(()=>{
    const audit=()=>{
      const res=[];
      document.querySelectorAll('[data-screen-label]').forEach(el=>{
        const sr=el.getBoundingClientRect();
        let maxB=0;
        el.querySelectorAll('*').forEach(n=>{
          const st=getComputedStyle(n);
          if(st.position==='static'||st.position==='relative'){
            const r=n.getBoundingClientRect();
            if(r.bottom-sr.top>maxB)maxB=r.bottom-sr.top;
          }
        });
        res.push(el.getAttribute('data-screen-label')+':flowB='+Math.round(maxB)+'/'+el.clientHeight);
      });
      const imgs=[...document.querySelectorAll('img')];
      const imgInfo=imgs.map(i=>{
        const ok=i.complete?(i.naturalWidth>0?'OK':'X'):'...';
        return (i.getAttribute('src')||'').split('/').pop()+':'+ok;
      }).join(',');
      const box=document.getElementById('check-result');
      if(box)box.textContent='CHECK|'+res.join('|')+'|imgs('+imgInfo+')|fontHand:'+document.fonts.check('16px "Ma Shan Zheng"')+'|fontSerif:'+document.fonts.check('16px "Noto Serif SC"');
    };
    const t=setTimeout(audit,900);
    const t2=setTimeout(audit,3000);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(audit,600));
    return ()=>{clearTimeout(t);clearTimeout(t2);};
  },[]);
  const screens=[<ScreenToday/>,<ScreenNewMoon/>,<ScreenFullMoon/>,<ScreenRetro/>,<ScreenNatal/>];
  return (
    <div>
      <div id="check-result" style={{display:'none'}}/>
      {want>=1&&want<=5
        ? <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#29231E',padding:'26px'}}>{screens[want-1]}</div>
        : <Stage/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
