<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光映照 · 奶油疗愈 · 水彩治愈系</title>
<meta name="description" content="星光映照塔罗小程序 — 方向一 · 奶油疗愈：水彩治愈系 · 明亮正向 · 六屏完整流程">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   星光映照 · 方向一 · 奶油疗愈（水彩治愈系）
   奶油米白 / 莫兰迪雾粉·薰衣草·薄荷 / 手写体 / 水彩插画
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#2F211B;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#F3E3D8}
#root{min-height:100%}
::selection{background:rgba(242,198,194,.4)}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}

/* ── 画布 ── */
.stage{max-width:1600px;margin:0 auto;padding:38px 24px 84px}
.stage h1{font-family:'ZCOOL KuaiLe',cursive;font-weight:400;font-size:31px;text-align:center;letter-spacing:10px;color:#F5DCD0;margin-bottom:8px}
.stage .sub{text-align:center;font-size:13px;color:rgba(245,220,208,.6);letter-spacing:4px;margin-bottom:8px}
.stage .meta{text-align:center;font-size:11.5px;color:rgba(245,220,208,.35);letter-spacing:1px;margin-bottom:36px}
.grid{display:flex;flex-wrap:wrap;gap:42px 30px;justify-content:center;align-items:flex-start}
.zone{display:flex;flex-direction:column;align-items:center}
.zoom{transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.zoom:hover{transform:scale(1.03)}
.cap{margin-top:14px;font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:3px;color:rgba(245,220,208,.85)}
.cap-sub{margin-top:4px;font-size:11px;letter-spacing:1px;color:rgba(245,220,208,.4)}
@media(max-width:720px){.grid{flex-direction:column;align-items:center}}

/* ═══════════════════ E · 奶油疗愈 Cream Healing ═══════════════════ */
.sys-e{
  --cream:#FDF6EC; --cream-hi:#FFFBF3; --paper:#FFF9EF;
  --pink:#F2C6C2; --pink-deep:#ECB3AA; --pink-ink:#C98A81; --pink-bright:#F8DDD8;
  --lav:#C9C0E8; --lav-deep:#B0A3DC; --lav-bright:#E9E4F7;
  --mint:#B8D8C4; --mint-deep:#9CC9AE;
  --ink:#5A4638; --ink-soft:#8A7466; --ink-faint:#B5A293;
  --line:rgba(201,138,129,.28);
  --hand:'Ma Shan Zheng','ZCOOL KuaiLe','Noto Serif SC',cursive;
  --round:'ZCOOL KuaiLe','Ma Shan Zheng','Noto Serif SC',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --serif:'Noto Serif SC',serif;
}
.sys-e .screen{
  background:var(--cream);color:var(--ink);position:relative;overflow:hidden;
  font-family:var(--sans);
}
/* 柔和水彩底色分区 */
.sys-e .wash{position:absolute;border-radius:50%;pointer-events:none;filter:blur(36px);z-index:0}
/* 微信胶囊（奶油浅底 -> 白色胶囊深色icon） */
.wxcapsule{
  position:absolute;top:13px;right:8px;z-index:30;display:flex;gap:4px;pointer-events:none;
}
.wxcapsule .cap{
  width:40px;height:32px;border-radius:7px;
  background:rgba(255,255,255,.94);border:0.5px solid rgba(160,120,110,.24);
  box-shadow:0 2px 8px rgba(120,90,80,.10);
  display:flex;align-items:center;justify-content:center;
}
.wxcapsule .cap svg{fill:#5A4638}
.wxcapsule .cap:first-child{flex-direction:column;gap:3px}
.wxcapsule .cap:first-child span{display:block;width:3px;height:3px;border-radius:50%;background:#5A4638}
.wxcapsule .cap .circle{width:15px;height:15px;border-radius:50%;border:1.5px solid #5A4638}

/* ── 返回 ── */
.backbtn{
  position:absolute;left:16px;top:56px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.92);border:1px solid rgba(217,140,129,.35);
  box-shadow:0 4px 14px rgba(120,90,80,.12);
  display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer;
  transition:transform .15s ease;
}
.backbtn:active{transform:scale(.93)}

/* ── 通用文字 ── */
.pad{position:relative;z-index:2}
.date-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-soft);letter-spacing:2px}
.quote{font-family:var(--hand);font-size:22px;color:var(--ink);margin-top:12px;transform:rotate(-1.2deg);letter-spacing:1px;line-height:1.5}
.quote-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;letter-spacing:1px}
.pill{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 12px;border-radius:999px;
  background:#FFFDF6;border:1px solid rgba(217,140,129,.42);color:#A0675E;
  font-size:10.5px;letter-spacing:2px;
}
.pill-lav{border-color:rgba(176,163,220,.55);color:#7C6FB0;background:#F7F4FC}
.hint-line{margin-top:10px;text-align:center;font-size:10.5px;color:var(--ink-faint);letter-spacing:1px}
.divider{display:flex;align-items:center;justify-content:center;gap:6px;margin:11px 0}
.divider i{width:30px;height:1px;background:rgba(201,138,129,.38)}
.divider b{width:3.5px;height:3.5px;border-radius:50%;background:rgba(201,138,129,.55)}

/* ── 按钮 ── */
.btn{
  height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;letter-spacing:3px;font-weight:500;
  transition:transform .15s ease,box-shadow .15s ease,opacity .2s ease;user-select:none;
}
.btn:active{transform:scale(.965)}
.btn-primary{
  background:linear-gradient(135deg,#F6D5CF 0%,#ECB3AA 100%);color:#6B3F38;
  box-shadow:0 8px 20px rgba(217,140,129,.35),inset 0 1px 0 rgba(255,255,255,.6);
}
.btn-ghost{background:#FFFBF3;border:1.5px solid rgba(217,140,129,.55);color:#A0675E;box-shadow:0 4px 12px rgba(120,90,80,.08)}
.btn-off{opacity:.4;pointer-events:none}
.w108{width:108px;flex-shrink:0}
.flex1{flex:1}

/* ── TabBar ── */
.tabbar{
  position:relative;z-index:5;margin:14px 14px 0;height:54px;border-radius:22px;
  display:flex;align-items:center;justify-content:space-around;
  background:rgba(255,252,246,.9);border:1px solid rgba(217,140,129,.30);
  box-shadow:0 10px 26px rgba(120,90,80,.12);backdrop-filter:blur(10px);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;font-size:10px;color:var(--ink-faint);letter-spacing:2px;cursor:pointer}
.tab.on{color:var(--pink-ink);font-weight:500}
.tab .tdot{width:3.5px;height:3.5px;border-radius:50%;background:transparent}
.tab.on .tdot{background:var(--pink-deep)}

/* ── 今日 · 水彩月亮牌 ── */
.paint-wrap{position:relative;margin:20px auto 0;width:236px;z-index:3}
.painting{
  width:236px;height:186px;border-radius:22px;overflow:hidden;cursor:pointer;
  background:#EDE2F2;box-shadow:0 14px 30px rgba(120,90,80,.2),0 3px 10px rgba(120,90,80,.1);
  animation:floaty 5.5s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--rot,-2deg))}50%{transform:translateY(-7px) rotate(var(--rot,-2deg))}}
.phrase{font-family:var(--hand);font-size:17.5px;color:#6B4B3E;text-align:center;margin-top:13px;letter-spacing:1px}
.pill-wrap{display:flex;justify-content:center;margin-top:14px}

/* ── 洗牌 ── */
.grid3{display:grid;grid-template-columns:repeat(3,80px);gap:11px;justify-content:center;margin-top:20px}
.s-rot{transition:transform .25s ease}
.s-card{
  width:80px;height:106px;border-radius:16px;position:relative;overflow:hidden;cursor:pointer;
  box-shadow:0 8px 18px rgba(120,90,80,.16);
  transition:transform .22s ease,box-shadow .22s ease;
}
.s-card:hover{transform:translateY(-4px)}
.s-card.sel{
  transform:translateY(-9px) scale(1.04);
  box-shadow:0 14px 26px rgba(120,90,80,.22),0 0 0 3px rgba(255,255,255,.95),0 0 0 5px rgba(201,138,129,.55);
}
.counter{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.cdots{display:flex;gap:6px}
.cdots i{width:8px;height:8px;border-radius:50%;background:rgba(201,138,129,.22);transition:background .2s ease,transform .2s ease}
.cdots i.on{background:var(--pink-deep);transform:scale(1.12)}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(201,138,129,.22);transition:background .2s ease,transform .2s ease}
.cdot.on{background:var(--pink-deep);transform:scale(1.12)}
.cnum{font-size:12px;color:var(--ink-soft);letter-spacing:2px}

/* ── 读牌中 ── */
.reading-head{position:relative;z-index:6;text-align:center;padding-top:92px}
.reading-head .quote{display:inline-block;font-size:21px;transform:rotate(-1deg)}
.reading-head .quote-sub{display:block;margin-top:6px}
.flip-row{position:relative;z-index:6;display:flex;justify-content:center;gap:16px;margin-top:30px}
.flip-card{width:78px;height:114px;position:relative;perspective:700px}
.flip-inner{position:absolute;inset:0;transform-style:preserve-3d;animation:flipc 3.9s cubic-bezier(.6,.1,.4,.9) var(--del,0s) infinite}
@keyframes flipc{0%{transform:rotateY(0)}48%{transform:rotateY(180deg)}100%{transform:rotateY(180deg)}}
.flip-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;overflow:hidden;box-shadow:0 10px 22px rgba(120,90,80,.18)}
.flip-back{transform:rotateY(180deg)}
.fallstar{position:absolute;z-index:5;pointer-events:none;animation:fall var(--dur,3.6s) linear var(--del,0s) infinite}
@keyframes fall{0%{transform:translateY(-16px) rotate(0);opacity:0}12%{opacity:.9}100%{transform:translateY(620px) rotate(220deg);opacity:0}}
.progress{position:relative;z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:34px}
.p-track{width:150px;height:5px;border-radius:99px;background:rgba(217,140,129,.18);overflow:hidden}
.p-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#F2C6C2,#C9C0E8);transform-origin:left;animation:fillmove 3.9s linear infinite}
@keyframes fillmove{0%{transform:scaleX(0)}55%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.p-dots{display:flex;gap:7px}
.p-dots i{width:7px;height:7px;border-radius:50%;background:rgba(217,140,129,.25);animation:pd 3.9s ease infinite}
.p-dots i:nth-child(2){animation-delay:.5s}
.p-dots i:nth-child(3){animation-delay:1s}
@keyframes pd{0%,100%{transform:scale(1);background:rgba(217,140,129,.25)}30%{transform:scale(1.28);background:#ECB3AA}}

/* ── 解读 ── */
.rv-head{text-align:center;padding-top:62px}
.rv-title{font-family:var(--hand);font-size:27px;color:var(--ink);margin-top:8px;letter-spacing:2px}
.rv-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;letter-spacing:2px}
.rv-art{width:224px;height:176px;margin:12px auto 0;border-radius:22px;overflow:hidden;box-shadow:0 12px 26px rgba(120,90,80,.18);transform:rotate(1.3deg);background:#E7EFE6}
.rv-text{position:relative;z-index:3;margin-top:12px;padding:0 26px;font-size:13px;line-height:1.9;color:var(--ink)}
.rv-text em{font-style:normal;color:var(--pink-ink);border-bottom:3px dashed rgba(242,198,194,.95)}
.chips{display:flex;justify-content:center;gap:8px;margin-top:12px}
.chip{
  min-width:76px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;letter-spacing:2px;cursor:pointer;border:1.5px solid;
  background:#FFFCF5;transition:all .2s ease;
}
.chip .sp{display:none}
.chip.on{font-weight:500}
.chip.on .sp{display:inline-block;margin-right:4px}
.chip-line{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:8px;letter-spacing:.5px}
.btns{display:flex;gap:10px;margin-top:13px;padding:0 22px}
.btn-row-fix{display:flex;gap:10px;margin-top:15px;padding:0 22px}

/* ── 星光树洞 · 聊天 ── */
.chat-head{position:relative;z-index:6;text-align:center;padding-top:62px}
.chat-title{font-family:var(--round);font-size:19px;color:var(--ink);letter-spacing:3px}
.chat-sub{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10.5px;color:var(--ink-soft);margin-top:3px;letter-spacing:1px}
.online-dot{width:6px;height:6px;border-radius:50%;background:#8FC89F;box-shadow:0 0 6px rgba(143,200,159,.8)}
.chat-body{position:absolute;left:0;right:0;top:118px;bottom:84px;padding:4px 16px 0;overflow:hidden;display:flex;flex-direction:column;gap:12px;z-index:3}
.chat-date{text-align:center;font-size:10px;color:var(--ink-faint);letter-spacing:2px;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
.avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%,#EAE4F8,#C9C0E8 72%);
  box-shadow:0 4px 12px rgba(176,163,220,.4);
  display:flex;align-items:center;justify-content:center;
}
.bub-ai{
  max-width:78%;background:#FFFDF7;border:1px solid rgba(217,140,129,.22);
  border-radius:18px 18px 18px 5px;padding:11px 14px;font-size:12.5px;line-height:1.75;color:var(--ink);
  box-shadow:0 6px 16px rgba(120,90,80,.1);
}
.bub-me{
  max-width:78%;background:linear-gradient(135deg,#F8DCD6,#F3C8C1);
  border-radius:18px 18px 5px 18px;padding:11px 14px;font-size:12.5px;line-height:1.75;color:#6B3F38;
  box-shadow:0 6px 16px rgba(201,138,129,.14);
}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#C9A9A0;animation:tb 1.1s ease infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.chat-input{
  position:absolute;left:16px;right:16px;bottom:16px;height:48px;z-index:8;
  border-radius:999px;background:#FFFDF8;border:1.5px solid rgba(217,140,129,.4);
  box-shadow:0 8px 20px rgba(120,90,80,.12);
  display:flex;align-items:center;padding:0 6px 0 18px;gap:8px;
}
.chat-input input{flex:1;border:none;outline:none;background:transparent;font-size:13px;color:var(--ink);height:44px;min-width:0}
.chat-input input::placeholder{color:var(--ink-faint)}
.sendbtn{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:linear-gradient(135deg,#F6D5CF,#ECB3AA);
  box-shadow:0 4px 10px rgba(217,140,129,.35);
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
}
.sendbtn:active{transform:scale(.9)}

/* ── 专属海报 ── */
.poster{
  position:relative;width:100%;border-radius:20px;overflow:hidden;z-index:3;
  background:linear-gradient(165deg,#FFFBF2 0%,#FDF3E3 100%);
  border:1px solid rgba(217,140,129,.38);
  box-shadow:0 16px 34px rgba(120,90,80,.16);
  padding:20px 18px 16px;
}
.poster::before{content:'';position:absolute;inset:9px;border:1px dashed rgba(201,138,129,.42);border-radius:13px;pointer-events:none}
.tape{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-5deg);
  width:76px;height:18px;background:rgba(242,198,194,.9);border-radius:3px;
  box-shadow:0 2px 6px rgba(120,90,80,.18);z-index:2;
}
.p-brand{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.p-logo{font-family:var(--round);font-size:15px;color:var(--pink-ink);letter-spacing:3px}
.p-art{width:196px;height:154px;margin:10px auto 0;border-radius:16px;overflow:hidden;transform:rotate(-1.8deg);box-shadow:0 10px 22px rgba(120,90,80,.16);background:#EDE2F2}
.p-date{font-family:var(--hand);font-size:14px;color:var(--ink-soft);text-align:center;margin-top:10px;letter-spacing:2px}
.p-line{font-family:var(--hand);font-size:19px;color:#6B4B3E;text-align:center;margin-top:2px;letter-spacing:1px}
.p-nick{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:9px;font-size:11.5px;color:var(--ink-soft);letter-spacing:1px}
.p-nick svg{display:block}
.p-foot{display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding:0 2px}
.p-name{font-family:var(--round);font-size:13.5px;color:#6B5347;letter-spacing:2px;display:flex;flex-direction:column;gap:2px}
.p-name small{font-family:var(--sans);font-size:9.5px;color:var(--ink-faint);letter-spacing:1.5px}
.qr{width:54px;height:54px;border-radius:9px;background:#FFF;border:1px solid rgba(201,138,129,.4);flex-shrink:0;padding:3px}
.poster-btns{display:flex;gap:10px;margin-top:14px}

/* ── Toast ── */
.toast{
  position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;
  background:rgba(90,70,56,.94);color:#FFF7EE;font-size:12px;letter-spacing:1px;
  padding:10px 18px;border-radius:999px;box-shadow:0 10px 24px rgba(60,40,30,.3);
  animation:toastin 1.9s ease forwards;pointer-events:none;white-space:nowrap;
}
@keyframes toastin{0%{opacity:0;transform:translateX(-50%) translateY(10px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}

/* ── 抽牌星光粒子 ── */
.spark{position:absolute;z-index:25;pointer-events:none;animation:burst .75s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(170deg);opacity:0}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z=="></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1=="></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj"></script>
<script type="text/babel" data-presets="env,react">
const {useState,useEffect,useRef} = React;

/* ═══════════════════════════════════════════════════════════
   星光映照 · 奶油疗愈（方向一）
   ═══════════════════════════════════════════════════════════ */

/* ── 微信胶囊（奶油浅底版）── */
function WxCapsule(){
  return (
    <div className="wxcapsule">
      <div className="cap"><span/><span/><span/></div>
      <div className="cap"><div className="circle"/></div>
    </div>
  );
}

/* ── 通用图标（与画布同源）── */
const Icon = ({name,color,size=20}) => {
  const c = color||'currentColor';
  const paths = {
    home:<><path d="M3 11.2 10 5l7 6.2" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M5.5 10.5V17h9v-6.5" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></>,
    book:<><path d="M4 4.5h7.5V17H4z" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round"/><path d="M11.5 5h5V17h-5" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round"/></>,

/* ═══════════════════════════════════════════════════════════
   02 · 洗牌 —— 净手 · 深呼吸 · 凭直觉选三张
   ═══════════════════════════════════════════════════════════ */
const BACKS=[
  {h:'pink',r:-2},{h:'lav',r:1.5},{h:'mint',r:-1},
  {h:'peach',r:2},{h:'lav',r:-1.5},{h:'pink',r:1},
  {h:'mint',r:-2},{h:'peach',r:1.5},{h:'pink',r:-1},
];
function ScreenShuffle(){
  const [sel,setSel]=useState([]);
  const [sparks,setSparks]=useState([]);
  const [toast,setToast]=useState('');
  const ref=useRef(null);
  const show=(t)=>{setToast(t);setTimeout(()=>setToast(''),1900);};
  const toggle=(i)=>{
    if(sel.includes(i)){setSel(sel.filter(x=>x!==i));return;}
    if(sel.length>=3){show('已经选好啦，相信直觉就行');return;}
    const card=ref.current&&ref.current.querySelector(`[data-i="${i}"] .s-card`);
    const screen=ref.current;
    if(card&&screen){
      const a=card.getBoundingClientRect(),b=screen.getBoundingClientRect();
      const cx=a.left-b.left+a.width/2, cy=a.top-b.top+a.height/2;
      const id=Date.now();
      setSparks(prev=>[...prev,...Array.from({length:6},(_,k)=>({
        id:id+k,x:cx,y:cy,
        dx:(k%3-1)*30+(k*7%9-4)*6,
        dy:-14-k*9,
        del:k*0.03,
      }))]);
      setTimeout(()=>setSparks(prev=>prev.filter(p=>p.id<id)),800);
    }
    setSel([...sel,i]);
  };
  return (
    <div className="sys-e">
      <div className="screen" style={{width:300,height:640,borderRadius:34,boxShadow:'0 30px 60px rgba(0,0,0,.55)'}} data-screen-label="s2-shuffle" ref={ref}>
        <WxCapsule/>
        <BackArrow onClick={()=>show('先别走，月亮在等你')}/>
        <div className="wash" style={{width:190,height:190,right:-70,top:-30,background:'#F2C6C2',opacity:.45}}/>
        <div className="wash" style={{width:170,height:170,left:-60,top:430,background:'#B8D8C4',opacity:.45}}/>
        <div className="pad" style={{padding:'52px 22px 0'}}>
          <div className="quote" style={{textAlign:'center',transform:'rotate(-1deg)'}}>净手 · 深呼吸 · 凭直觉选三张</div>
          <div className="quote-sub" style={{textAlign:'center',marginTop:5}}>闭上眼睛想一个问题，再慢慢睁开</div>
          <div className="grid3" style={{marginTop:18}}>
            {BACKS.map((b,i)=>
              <div key={i} className="s-rot" style={{transform:`rotate(${b.r}deg)`}} data-i={i}>
                <div className={"s-card"+(sel.includes(i)?' sel':'')} onClick={()=>toggle(i)}>
                  <CardBackArt hue={b.h}/>
                </div>
              </div>)}
          </div>
          <div className="counter">
            {Array.from({length:9}).map((_,k)=>
              <span key={k} className={"cdot"+(k<sel.length?' on':'')}/>)}
            <span className="cnum">已选 {sel.length}/3</span>
          </div>
          <div className={"btn btn-primary"+(sel.length===3?'':' btn-off')} style={{marginTop:12}} onClick={()=>sel.length===3&&show('牌面正在翻开 · 三张牌已经苏醒')}>翻开牌面</div>
          <div className="hint-line" style={{marginTop:8}}>选牌没有对错，跟着直觉走就好</div>
        </div>
        {sparks.map(s=>
          <span key={s.id} className="spark" style={{left:s.x,top:s.y,'--dx':`${s.dx}px`,'--dy':`${s.dy}px`,animationDelay:`${s.del}s`}}>
            <Spark s={0.75} fill="#D8A96A" op={0.95}/>
          </span>)}
        {toast&&<div className="toast">{toast}</div>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════

  {k:'self',t:'内心觉察',border:'rgba(156,201,174,.6)',fill:'#E4F0E8',ink:'#6E9B7F',sp:'#8FC89F',line:'允许自己暂时不完美，你已经很努力了。'},
];

        <div className="pad">

            <div className="divider"><i/><b/><i/></div>

          </div>

              <div key={c.k} className={"chip"+(chip===c.k?' on':'')}

                <span className="sp"><Spark s={0.5} fill={c.sp} op={1} style={{display:'inline-block',verticalAlign:'-1px'}}/></span>
                {c.t}

            <div className="btn btn-ghost w108" onClick={()=>show('卡片已存好，去朋友圈晒晒吧')}>存为卡片</div>
            <div className="btn btn-primary flex1" onClick={()=>show('星塔罗师正在赶来 · 稍等片刻')}>与星塔罗师聊聊</div>

/* ═══════════════════════════════════════════════════════════
   05 · 星光树洞 —— 与星塔罗师聊聊
   ═══════════════════════════════════════════════════════════ */
const CURATED=[
  '听见了。星币王牌想告诉你：种子破土前，都有一段安静的等待。今天不必赶路，先把眼前的小事做好，好不好？',
  '嗯，我懂那种闷闷的感觉。月亮牌说：夜晚是用来休息的，不是用来较劲的。喝杯温水，早点睡，明天又是新的土壤。',
  '温柔地抱抱你。牌面里那株小芽正在生长，它不着急，你也不用。想把哪件事先放一放？我陪你一起想。',
];
function ScreenChat(){
  const [msgs,setMsgs]=useState([
    {from:'ai',text:'晚上好呀，我是星塔罗师小满。今晚的月亮很温柔，你抽到的星币王牌告诉我——你心里正有一粒想发芽的种子。愿意和我说说吗？'},
    {from:'me',text:'我今天有点焦虑，总觉得事情进展得太慢了…'},
  ]);
  const [typing,setTyping]=useState(false);
  const [input,setInput]=useState('');
  const idx=useRef(0);
  const send=()=>{
    const v=input.trim();
    if(!v)return;
    setMsgs(m=>[...m,{from:'me',text:v}]);
    setInput('');
    setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      const reply=CURATED[idx.current%CURATED.length];
      idx.current++;
      setMsgs(m=>[...m,{from:'ai',text:reply}]);
    },1500);
  };
  return (
    <div className="sys-e">
      <div className="screen" style={{width:300,height:640,borderRadius:34,boxShadow:'0 30px 60px rgba(0,0,0,.55)'}} data-screen-label="s5-chat">
        <WxCapsule/>
        <BackArrow/>
        <div className="wash" style={{width:200,height:200,right:-70,top:-50,background:'#F2C6C2',opacity:.45}}/>
        <div className="wash" style={{width:180,height:180,left:-70,top:380,background:'#C9C0E8',opacity:.4}}/>
        <div className="chat-head">
          <div className="chat-title">星光树洞</div>
          <div className="chat-sub"><span className="online-dot"/>星塔罗师 · 在线</div>
        </div>
        <div className="chat-body">
          <div className="chat-date">8月7日 · 夜</div>
          {msgs.map((m,i)=>
            <div key={i} className={"row"+(m.from==='me'?' me':'')}>
              {m.from==='ai'&&<div className="avatar"><MoonMini/></div>}
              <div className={m.from==='me'?'bub-me':'bub-ai'}>{m.text}</div>
            </div>)}
          {typing&&
            <div className="row">
              <div className="avatar"><MoonMini/></div>
              <div className="bub-ai typing"><i/><i/><i/></div>
            </div>}
        </div>
        <div className="chat-input">
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send();}} placeholder="和月亮说点悄悄话…"/>
          <div className="sendbtn" onClick={send}>
            <svg width="17" height="17" viewBox="0 0 20 20">
              <path d="M3 3.5 17 10 3 16.5 5.6 10 Z" fill="#7C4A42"/>
              <path d="M5.6 10H17" stroke="#7C4A42" strokeWidth="1.1"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════

function Stage(){
  const zones=[
    {l:'01 · 今日', d:'每日一牌 · 水彩月亮牌', el:<ScreenToday/>},
    {l:'02 · 洗牌', d:'直觉三选 · 3×3 牌阵', el:<ScreenShuffle/>},

      <div className="meta">对标 MOODA / 塔罗GO疗愈卡 · 明亮治愈 + 正向心理 · 每张牌都是温柔的提醒 · 结果页即传播页</div>

/* ── 溢出自检（渲染后测量每屏内容是否超出 640 高）── */
function App(){
  const hm=(location.hash||'').match(/^#(d?)([1-6])$/);
  const demo=!!hm&&hm[1]==='d';
  const want=hm?parseInt(hm[2],10):0;
  useEffect(()=>{
    if(!demo)return;
    const t=setTimeout(()=>{
      document.querySelectorAll('.s-card').forEach((el,i)=>{if(i<3)setTimeout(()=>el.click(),i*150);});
      const input=document.querySelector('input');
      if(input){
        const setter=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
        setter.call(input,'今天有点累，但我会慢慢来的。');
        input.dispatchEvent(new Event('input',{bubbles:true}));
        setTimeout(()=>{
          const sb=document.querySelector('.sendbtn');
          if(sb)sb.click();
        },200);
      }
    },1000);
    return ()=>clearTimeout(t);
  },[]);
  useEffect(()=>{
    const check=()=>{
      const res=[];
      document.querySelectorAll('[data-screen-label]').forEach(el=>{
        const sr=el.getBoundingClientRect();
        let maxB=0;
        el.querySelectorAll('*').forEach(n=>{
          const st=getComputedStyle(n);
          if(st.position==='static'||st.position==='relative'){
            const r=n.getBoundingClientRect();
            if(r.bottom-sr.top>maxB)maxB=r.bottom-sr.top;
          }
        });
        res.push(el.getAttribute('data-screen-label')+':flowB='+Math.round(maxB)+'/'+el.clientHeight);
      });
      const box=document.getElementById('check-result');
      if(box)box.textContent='CHECK|'+res.join('|')+'|fontMSZ:'+document.fonts.check('16px "Ma Shan Zheng"');
    };
    const t=setTimeout(check,900);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(check,500));
    return ()=>clearTimeout(t);
  },[]);
  const screens=[<ScreenToday/>,<ScreenShuffle/>,<ScreenReading/>,<ScreenReveal/>,<ScreenChat/>,<ScreenPoster/>];
  return (
    <div>
      <div id="check-result" style={{display:'none'}}/>
      {want>=1&&want<=6
        ? <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#2F211B',padding:'26px'}}>{screens[want-1]}</div>
        : <Stage/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
