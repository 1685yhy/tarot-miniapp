<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光映照 · 宇宙夜曲 · 完整交互流程</title>
<meta name="description" content="星光映照塔罗小程序 — A 宇宙夜曲：今日 / 洗牌 / 读牌中 / 解读 / 星光树洞 五屏完整交互原型">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   星光映照 · A 宇宙夜曲 Cosmic Nocturne · 五屏完整交互流程
   画布：五台设备并排，每屏 300×640 固定
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#17141F;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#EDE7E0}
#root{min-height:100%}
::selection{background:rgba(212,175,100,.3)}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}

/* ── 画布 ── */
.stage{max-width:1900px;margin:0 auto;padding:30px 24px 70px}
.stage h1{font-family:'Noto Serif SC',serif;font-weight:600;font-size:26px;text-align:center;letter-spacing:10px;color:#EDE7E0;margin-bottom:6px}
.stage .sub{text-align:center;font-size:13px;color:rgba(237,231,224,.45);letter-spacing:3px;margin-bottom:26px}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:60px 52px}
.zone{display:flex;flex-direction:column;align-items:center}
.zl{font-family:'Noto Serif SC',serif;display:flex;align-items:baseline;gap:4px;margin:0 0 4px}
.zno{font-size:12px;color:rgba(212,175,100,.9);letter-spacing:5px}
.znm{font-size:14px;letter-spacing:3px;color:rgba(237,231,224,.82)}
.zd{font-size:11.5px;color:rgba(237,231,224,.38);letter-spacing:1.5px;margin-bottom:14px}

/* ═══════════════════ A · 宇宙夜曲 基础 ═══════════════════ */
.sys-a{
  --bg0:#2A1A5E; --bg1:#14102E; --bg2:#0A0B2E; --void:#0A0B2E;
  --nebula:#A78BFA; --moon:#FDE68A; --moon-deep:#F59E0B; --rose:#F9A8D4;
  --ink:#F5E9FF; --veil:rgba(245,233,255,.08); --veil2:rgba(245,233,255,.16);
  --serif:'Cormorant Garamond','Noto Serif SC',serif;
  --lat:'Cormorant Garamond',Georgia,serif;
  --sans:'Noto Sans SC','PingFang SC',system-ui,sans-serif;
}
.sys-a .screen{
  background:radial-gradient(120% 90% at 50% 0%, var(--bg0) 0%, var(--bg1) 48%, var(--bg2) 100%);
  color:var(--ink); position:relative; overflow:hidden;
}
/* 设备框内屏 */
.screen{width:300px;height:640px;border-radius:34px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.sys-a .screen-reading{
  background:radial-gradient(120% 90% at 50% 0%, #1B1444 0%, #0B0A24 52%, #060518 100%);
}
.sys-a .screen-reading .neb{opacity:.18}
.sys-a .screen-reading .star{opacity:.28}

/* 设备框 */
.bezel{
  background:linear-gradient(180deg,#262038 0%,#141024 100%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:46px;padding:10px;
  box-shadow:0 36px 80px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);
  position:relative;
}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:116px;height:32px;border-radius:20px;background:#000;border:.5px solid rgba(255,255,255,.16);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.04),0 0 14px rgba(0,0,0,.5);z-index:40;pointer-events:none}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:124px;height:4px;border-radius:2px;background:rgba(255,255,255,.72);box-shadow:0 1px 6px rgba(0,0,0,.35);z-index:45;pointer-events:none}
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 104px 0 28px;z-index:25;pointer-events:none}
.sb .sb-time{font-size:16px;font-weight:600;letter-spacing:.2px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.sb .sb-icons{display:flex;gap:7px;align-items:center}

/* star field */
.sys-a .stars{position:absolute;inset:0;pointer-events:none}
.sys-a .star{position:absolute;border-radius:50%;background:#fff;opacity:.6}
.sys-a .neb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;pointer-events:none}
.sys-a .neb-l{background:var(--nebula);width:220px;height:220px;left:-70px;top:34%;opacity:.32}
.sys-a .neb-g{background:var(--moon-deep);width:150px;height:150px;right:-50px;top:12%;opacity:.14}
.sys-a .brand{text-align:center;padding-top:48px;position:relative;z-index:2}
.sys-a .brand .logo{
  font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:8px;color:var(--ink);
  text-shadow:0 0 24px rgba(167,139,250,.45);
}
.sys-a .brand .tag{font-size:12px;color:rgba(245,233,255,.55);letter-spacing:3px;margin-top:7px}
.sys-a .brand .greet{
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--moon);
  margin-top:10px;letter-spacing:1px;
}
.sys-a .badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:9px;
  border:1px solid var(--veil2);border-radius:999px;padding:5px 14px;
  font-size:11px;color:rgba(245,233,255,.75);letter-spacing:2px;
  background:rgba(245,233,255,.04);backdrop-filter:blur(8px);
}
.sys-a .badge .dot{width:5px;height:5px;border-radius:50%;background:var(--moon);box-shadow:0 0 8px var(--moon);animation:ypulse 2.4s infinite}
@keyframes ypulse{0%,100%{opacity:1}50%{opacity:.4}}
/* card */
.sys-a .cardwrap{position:relative;z-index:2;margin-top:14px;display:flex;justify-content:center}
.sys-a .card{
  width:172px;height:220px;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,#1D1645 0%,#120D2E 55%,#0B0820 100%);
  border:1px solid rgba(167,139,250,.28);
  box-shadow:0 0 0 1px rgba(245,233,255,.05),0 12px 34px rgba(0,0,0,.55),0 0 44px rgba(167,139,250,.16);
  transition:transform .18s ease;
}
.sys-a .card:hover{transform:translateY(-4px)}
.sys-a .card:active{transform:scale(.97)}
.sys-a .card .card-inner{position:absolute;inset:10px;border:1px solid var(--veil2);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:13px 8px}
.sys-a .card .moon{
  width:64px;height:64px;border-radius:50%;margin-top:8px;
  background:radial-gradient(circle at 38% 32%, #FFF7D6 0%, var(--moon) 42%, var(--moon-deep) 100%);
  box-shadow:0 0 34px rgba(253,230,138,.5),0 0 80px rgba(253,230,138,.18);
  position:relative;
}
.sys-a .card .moon::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 55%, rgba(20,16,46,.55) 0%, rgba(20,16,46,.35) 26%, transparent 30%)}
.sys-a .card .title{font-family:var(--lat);font-style:italic;font-size:15px;color:var(--moon);letter-spacing:2px}
.sys-a .card .subtitle{font-size:10px;color:rgba(245,233,255,.5);letter-spacing:3px;margin-top:3px;text-transform:uppercase}
.sys-a .card .hint{font-size:11px;color:rgba(245,233,255,.62);letter-spacing:2px;margin-bottom:4px}
.sys-a .card .hint small{display:block;font-size:9.5px;color:rgba(245,233,255,.34);letter-spacing:1px;margin-top:4px}
/* tree hole */
.sys-a .treepanel{
  position:relative;z-index:2;margin:10px 18px 0;border-radius:14px;
  border:1px solid var(--veil);background:rgba(245,233,255,.045);
  padding:10px 16px;backdrop-filter:blur(10px);
}
.sys-a .treepanel .t-label{font-family:var(--sans);font-size:10px;letter-spacing:3px;color:rgba(245,233,255,.45);text-transform:uppercase}
.sys-a .treepanel .t-text{font-family:var(--serif);font-size:15px;color:var(--ink);margin-top:4px}
.sys-a .treepanel .t-text i{font-style:italic;color:var(--rose)}
.sys-a .treepanel .t-go{margin-top:6px;font-size:10.5px;color:var(--moon);letter-spacing:1px}
/* CTA */
.sys-a .cta{
  position:relative;z-index:2;margin:10px 18px 0;height:44px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(120% 160% at 30% 0%, #FFF3C9 0%, var(--moon) 40%, var(--moon-deep) 100%);
  color:#241A02;font-size:14px;font-weight:600;letter-spacing:3px;
  box-shadow:0 4px 22px rgba(245,158,11,.35),0 0 34px rgba(253,230,138,.22);
}
.sys-a .cta.idle{
  background:rgba(167,139,250,.12);color:rgba(245,233,255,.72);
  border:1px solid var(--veil2);box-shadow:none;font-weight:500;
}
/* tabbar */
.sys-a .tabbar{
  position:relative;z-index:2;margin:8px 14px 0;height:46px;border-radius:16px;
  display:flex;align-items:center;justify-content:space-around;
  background:rgba(16,12,40,.55);border:1px solid var(--veil);
  backdrop-filter:blur(14px);
}
.sys-a .tabbar .tab{font-size:11px;color:rgba(245,233,255,.5);letter-spacing:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:64px;height:46px;cursor:pointer;transition:transform .15s ease}
.sys-a .tabbar .tab:active{transform:scale(.96)}
.sys-a .tabbar .tab.on{color:var(--moon)}
.sys-a .tabbar .tab .ic{width:20px;height:20px}
.sys-a .tabbar .tab.on .pill{background:rgba(253,230,138,.14);border:1px solid rgba(253,230,138,.3);border-radius:999px;padding:2px 12px;font-size:10px;letter-spacing:2px}

/* 微信胶囊 */
.wxcapsule{
  position:absolute;top:13px;right:8px;z-index:30;display:flex;gap:4px;pointer-events:none;
}
.wxcapsule .cap{
  width:40px;height:32px;border-radius:7px;
  background:rgba(255,255,255,.22);border:0.5px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);
}
.wxcapsule .cap svg{fill:rgba(0,0,0,.65)}
.wxcapsule .cap:first-child{flex-direction:column;gap:3px}
.wxcapsule .cap:first-child span{display:block;width:3px;height:3px;border-radius:50%;background:rgba(0,0,0,.6)}
.wxcapsule .cap .circle{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.6)}

/* 按压反馈（通用） */
.press{transition:transform .15s ease,box-shadow .15s ease}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.97)}

/* ═══════════════════ 壹 · 今日（品牌首页 · 复刻 ScreenA）═══════════════════ */

/* ═══════════════════ 贰 · 洗牌（选牌）═══════════════════ */
.pick-head{position:relative;z-index:2;text-align:center;padding-top:44px}
.pick-head .pt{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:6px;color:var(--ink);text-shadow:0 0 20px rgba(167,139,250,.35)}
.pick-head .ps{font-size:12px;color:rgba(245,233,255,.55);letter-spacing:3px;margin-top:8px}
.pick-note{position:relative;z-index:2;margin:13px 28px 0;font-size:11.5px;line-height:19px;color:rgba(245,233,255,.6);text-align:center;letter-spacing:1.5px}
.pick-grid{position:relative;z-index:2;margin:14px auto 0;width:266px;display:grid;grid-template-columns:repeat(3,82px);grid-template-rows:repeat(3,96px);gap:10px}
.pick-card{
  position:relative;border-radius:9px;cursor:pointer;overflow:hidden;
  background:linear-gradient(160deg,#241B52 0%,#140E36 60%,#0D0A28 100%);
  border:1px solid rgba(167,139,250,.3);
  box-shadow:0 6px 16px rgba(0,0,0,.35);
  transition:transform .16s ease,box-shadow .16s ease;
}
.pick-card:hover{transform:translateY(-2px)}
.pick-card:active{transform:scale(.97)}
.pick-card.picked{
  box-shadow:0 0 0 1.5px rgba(253,230,138,.7),0 0 24px rgba(253,230,138,.25),0 10px 20px rgba(0,0,0,.45);
  transform:translateY(-4px);
}
.pick-card.picked::after{content:'';position:absolute;inset:4px;border:1px solid rgba(253,230,138,.45);border-radius:6px;pointer-events:none;z-index:2}
.pick-card .cb{position:absolute;inset:0;width:100%;height:100%;display:block}
.pick-num{
  position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 30%,#FFF3C9 0%,#FDE68A 55%,#F59E0B 100%);
  color:#241A02;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.pick-hint{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;margin:14px 24px 0}
.pick-hint .hc{font-size:12px;color:var(--moon);letter-spacing:1.5px}
.pick-hint .hp{font-size:11.5px;color:rgba(245,233,255,.5);letter-spacing:1.5px}
.pick-cta{margin-top:14px}

/* ═══════════════════ 叁 · 读牌中（Loading）═══════════════════ */
.read-head{position:relative;z-index:2;text-align:center;padding-top:44px}
.read-head .re{font-size:11.5px;color:rgba(245,233,255,.45);letter-spacing:4px}
.read-head .rt{font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:3px;color:var(--ink);margin-top:8px;text-shadow:0 0 22px rgba(167,139,250,.4)}
.read-head .rs{font-size:11.5px;color:rgba(245,233,255,.45);letter-spacing:2px;margin-top:6px}
.flip-zone{position:relative;z-index:2;width:220px;height:288px;margin:12px auto 0;display:flex;align-items:center;justify-content:center}
.flip-halo{
  position:absolute;inset:6% -4%;border-radius:50%;
  background:radial-gradient(circle,rgba(253,230,138,.16) 0%,rgba(167,139,250,.09) 45%,transparent 70%);
  filter:blur(22px);animation:haloPulse 3.4s ease-in-out infinite;
}
@keyframes haloPulse{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.flip-card{
  width:168px;height:252px;position:relative;
  box-shadow:0 12px 34px rgba(0,0,0,.5);
  animation:flipIn 3.4s cubic-bezier(.45,.05,.3,1) .5s forwards;
}
@keyframes flipIn{0%{transform:scaleX(1)}40%{transform:scaleX(0)}60%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.face{position:absolute;inset:0;border-radius:12px;overflow:hidden}
.face.back{background:linear-gradient(160deg,#241B52 0%,#140E36 60%,#0D0A28 100%);border:1px solid rgba(167,139,250,.3);animation:faceBack 3.4s linear .5s forwards}
.face.front{animation:faceFront 3.4s linear .5s forwards}
@keyframes faceBack{0%,36%{opacity:1}46%,100%{opacity:0}}
@keyframes faceFront{0%,36%{opacity:0}46%,100%{opacity:1}}
.face.back .cb{position:absolute;inset:0;width:100%;height:100%;display:block}
.face.front .ace-card{position:absolute;inset:0}
.ace-card{
  background:linear-gradient(160deg,#1D1645 0%,#120D2E 55%,#0B0820 100%);
  border:1px solid rgba(167,139,250,.28);border-radius:12px;
  box-shadow:0 0 0 1px rgba(245,233,255,.05),0 12px 34px rgba(0,0,0,.55),0 0 44px rgba(167,139,250,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:15px 8px 13px;position:relative;overflow:hidden;
}
.ace-card::before{content:'';position:absolute;inset:10px;border:1px solid var(--veil2);border-radius:6px;pointer-events:none}
.r-disc{
  width:70px;height:70px;border-radius:50%;margin-top:10px;flex-shrink:0;
  background:radial-gradient(circle at 38% 32%,#FFF7D6 0%,var(--moon) 42%,var(--moon-deep) 100%);
  box-shadow:0 0 34px rgba(253,230,138,.5),0 0 80px rgba(253,230,138,.18);
  display:flex;align-items:center;justify-content:center;
}
.r-title{font-family:var(--lat);font-style:italic;font-size:16px;color:var(--moon);letter-spacing:2px}
.r-sub{font-size:11px;color:rgba(245,233,255,.5);letter-spacing:3px;margin-top:3px;text-transform:uppercase}
.r-tags{font-size:11px;color:rgba(245,233,255,.62);letter-spacing:2px;margin-bottom:2px}
.r-tags i{font-style:normal;color:var(--moon);margin:0 5px}
.rdots{position:relative;z-index:2;display:flex;gap:8px;justify-content:center;margin-top:20px}
.rdots i{width:7px;height:7px;border-radius:50%;background:var(--moon);box-shadow:0 0 8px rgba(253,230,138,.8);animation:rBounce 1.3s ease-in-out infinite}
.rdots i:nth-child(2){animation-delay:.18s}
.rdots i:nth-child(3){animation-delay:.36s}
@keyframes rBounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
.read-dots-text{position:relative;z-index:2;text-align:center;margin-top:9px;font-family:var(--serif);font-style:italic;font-size:13px;letter-spacing:1.5px;color:rgba(245,233,255,.72)}
.rprog{position:relative;z-index:2;width:200px;height:2px;border-radius:2px;background:rgba(245,233,255,.12);margin:17px auto 0;overflow:hidden}
.rprog::after{
  content:'';position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(90deg,rgba(253,230,138,0) 0%,var(--moon) 55%,var(--moon-deep) 100%);
  transform-origin:left;animation:rFill 7s ease-in-out infinite;
}
@keyframes rFill{0%{transform:scaleX(0);opacity:0}10%{opacity:1}70%{opacity:1}100%{transform:scaleX(1);opacity:0}}

/* ═══════════════════ 肆 · 解读（结果页）═══════════════════ */
.rv-head{position:relative;z-index:2;text-align:center;padding-top:42px}
.rv-head .rh{font-size:11.5px;letter-spacing:3px;color:rgba(245,233,255,.55)}
.rv-cardwrap{position:relative;z-index:2;margin-top:10px;display:flex;justify-content:center}
.rv-card{width:172px;height:254px;border-radius:12px;overflow:hidden;cursor:default;box-shadow:0 0 0 1px rgba(245,233,255,.05),0 12px 34px rgba(0,0,0,.55),0 0 54px rgba(167,139,250,.22)}
.rv-card .ace-card{width:100%;height:100%}
.rv-card .r-disc{width:76px;height:76px;margin-top:12px}
.rv-sep{position:relative;z-index:2;text-align:center;font-size:11px;letter-spacing:8px;color:rgba(253,230,138,.55);margin-top:14px}
.rv-text{position:relative;z-index:2;margin:10px 26px 0;font-family:var(--serif);font-style:italic;font-size:14px;line-height:22px;color:rgba(245,233,255,.9);text-align:center;letter-spacing:.5px}
.seg-row{position:relative;z-index:2;display:flex;gap:8px;margin:13px 18px 0}
.seg{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--veil);border-radius:12px;background:rgba(245,233,255,.04);padding:8px 2px 7px;backdrop-filter:blur(8px)}
.seg-pill{font-size:11.5px;letter-spacing:2px;padding:2px 12px;border-radius:999px;border:1px solid}
.seg:nth-child(1) .seg-pill{color:var(--rose);border-color:rgba(249,168,212,.4)}
.seg:nth-child(2) .seg-pill{color:var(--nebula);border-color:rgba(167,139,250,.45)}
.seg:nth-child(3) .seg-pill{color:var(--moon);border-color:rgba(253,230,138,.4)}
.seg-t{font-size:11px;color:rgba(245,233,255,.55);letter-spacing:1px;white-space:nowrap}
.btn-row{position:relative;z-index:2;display:flex;gap:10px;margin:12px 18px 0;align-items:center}
.btn2{
  flex:1;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid var(--veil2);background:rgba(245,233,255,.05);
  font-size:12.5px;letter-spacing:2px;color:rgba(245,233,255,.78);
}
.btn1{
  flex:1.4;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(120% 160% at 30% 0%,#FFF3C9 0%,var(--moon) 40%,var(--moon-deep) 100%);
  color:#241A02;font-size:13px;font-weight:600;letter-spacing:2px;gap:6px;
  box-shadow:0 4px 22px rgba(245,158,11,.35),0 0 34px rgba(253,230,138,.22);
}

/* ═══════════════════ 伍 · 星光树洞（聊天）═══════════════════ */
.chat-head{position:absolute;top:44px;left:0;right:0;height:56px;z-index:5;display:flex;align-items:center;padding:0 14px}
.chat-back{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--veil2);background:rgba(245,233,255,.06);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease;
}
.chat-back:hover{transform:translateY(-1px)}
.chat-back:active{transform:scale(.97)}
.chat-title{position:absolute;left:60px;right:200px;text-align:center;font-size:13.5px;font-weight:500;letter-spacing:1px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-caption{position:relative;z-index:2;margin:112px auto 0;width:fit-content;font-size:11px;color:rgba(245,233,255,.38);letter-spacing:2px;padding:3px 12px;border:1px solid var(--veil);border-radius:999px;background:rgba(245,233,255,.03)}
.chat-list{position:relative;z-index:2;margin:13px 16px 0;display:flex;flex-direction:column;gap:13px;padding-bottom:88px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:240px}
.msg.me{flex-direction:row-reverse;margin-left:auto}
.msg-ava{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%,#FFF3C9 0%,#FDE68A 60%,#F59E0B 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 12px rgba(253,230,138,.35);
}
.bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:20px;color:rgba(245,233,255,.92);letter-spacing:.3px}
.msg.ai .bubble{background:rgba(167,139,250,.13);border:1px solid rgba(167,139,250,.22);border-top-left-radius:4px;backdrop-filter:blur(10px)}
.msg.me .bubble{background:rgba(253,230,138,.07);border:1px solid rgba(253,230,138,.38);border-top-right-radius:4px}
.chat-input{
  position:absolute;left:14px;right:14px;bottom:16px;height:56px;border-radius:999px;z-index:6;
  background:rgba(16,12,40,.72);border:1px solid var(--veil2);backdrop-filter:blur(14px);
  display:flex;align-items:center;padding:0 6px 0 20px;box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.chat-field{flex:1;font-size:13px;color:rgba(245,233,255,.35);letter-spacing:1px}
.chat-send{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:radial-gradient(120% 160% at 30% 0%,#FFF3C9 0%,#FDE68A 40%,#F59E0B 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(245,158,11,.4);transition:transform .15s ease;
}
.chat-send:hover{transform:translateY(-1px)}
.chat-send:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z=="></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1=="></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj"></script>
<script type="text/babel" data-presets="env,react">
const {useState} = React;

/* ── 微信胶囊 ── */
function WxCapsule(){
  return (
    <div className="wxcapsule">
      <div className="cap">
        <span/><span/><span/>
      </div>
      <div className="cap"><div className="circle"/></div>
    </div>
  );
}

/* ── iOS 状态栏（时间 + 信号/无线/电量，避让胶囊） ── */
function StatusBar(){
  return (
    <div className="sb">
      <span className="sb-time">9:41</span>
      <div className="sb-icons">
        <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#fff"/><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#fff"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#fff"/><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#fff"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="#fff"/><path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="#fff"/><circle cx="8.5" cy="10.5" r="1.5" fill="#fff"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#fff" strokeOpacity="0.35" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="#fff" fillOpacity="0.4"/></svg>
      </div>
    </div>
  );
}

/* ── 通用图标 ── */
const Icon = ({name,color,size=20}) => {
  const c = color||'currentColor';
  const paths = {
    home:<><path d="M3 11.2 10 5l7 6.2" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M5.5 10.5V17h9v-6.5" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></>,
    book:<><path d="M4 4.5h7.5V17H4z" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round"/><path d="M11.5 5h5V17h-5" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round"/></>,
    user:<><circle cx="10" cy="7.5" r="3.2" fill="none" stroke={c} strokeWidth="1.6"/><path d="M4.5 17c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round"/></>,
    about:<><circle cx="10" cy="10" r="7" fill="none" stroke={c} strokeWidth="1.6"/><path d="M10 8.5v.2M10 11.5v2.6" stroke={c} strokeWidth="1.6" strokeLinecap="round"/></>,
  };
  return <svg className="ic" width={size} height={size} viewBox="0 0 20 20">{paths[name]}</svg>;
};

/* ── TabBar 数据 ── */
const TABS = [
  {key:'home', name:'映照', ic:'home'},
  {key:'book', name:'百科', ic:'book'},
  {key:'user', name:'我的', ic:'user'},
  {key:'about', name:'关于', ic:'about'},
];

/* ── 星野 ── */
function Stars(){
  const pts = [[8,26],[30,14],[56,30],[84,10],[122,22],[150,12],[178,28],[14,64],[60,58],[104,66],[144,54],[176,70],[38,96],[96,92],[150,98],[70,130],[120,124],[24,140],[160,140],[200,84],[210,40],[212,120]];
  return <div className="stars">{pts.map((p,i)=><span key={i} className="star" style={{left:p[0],top:p[1],width:i%3===0?2:1.4,height:i%3===0?2:1.4,opacity:.35+i*0.02}}/>)}</div>;
}

/* ── 牌背（深紫底 + 金色星芒/月亮纹样） ── */
function CardBack(){
  return (
    <svg className="cb" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="cbBg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor="#2B2163"/>
          <stop offset=".55" stopColor="#191243"/>
          <stop offset="1" stopColor="#0D0A28"/>
        </linearGradient>
      </defs>
      <rect width="100" height="120" fill="url(#cbBg)"/>
      <rect x="5" y="5" width="90" height="110" rx="7" fill="none" stroke="rgba(232,201,126,.42)" strokeWidth="1.2"/>
      <rect x="9.5" y="9.5" width="81" height="101" rx="4.5" fill="none" stroke="rgba(232,201,126,.16)" strokeWidth=".8"/>
      <path d="M20 14.5l1.8 3.7 3.7 1.8-3.7 1.8-1.8 3.7-1.8-3.7-3.7-1.8 3.7-1.8z" fill="rgba(232,201,126,.7)"/>
      <path d="M80 14.5l1.8 3.7 3.7 1.8-3.7 1.8-1.8 3.7-1.8-3.7-3.7-1.8 3.7-1.8z" fill="rgba(232,201,126,.7)"/>
      <path d="M20 102.5l1.8 3.7 3.7 1.8-3.7 1.8-1.8 3.7-1.8-3.7-3.7-1.8 3.7-1.8z" fill="rgba(232,201,126,.7)"/>
      <path d="M80 102.5l1.8 3.7 3.7 1.8-3.7 1.8-1.8 3.7-1.8-3.7-3.7-1.8 3.7-1.8z" fill="rgba(232,201,126,.7)"/>
      <path d="M50 28a9.2 9.2 0 1 0 0 18.4 7.5 7.5 0 0 1 0-18.4z" fill="#FDE68A" opacity=".92"/>
      <g stroke="rgba(232,201,126,.85)" strokeWidth="1.1" strokeLinecap="round">
        <path d="M50 42v32M34 58h32M42.2 50.2l15.6 15.6M57.8 50.2l-15.6 15.6"/>
      </g>
      <circle cx="50" cy="58" r="3.2" fill="#FDE68A"/>
      <circle cx="50" cy="58" r="5" fill="none" stroke="rgba(232,201,126,.5)" strokeWidth=".8"/>
      <g fill="rgba(201,169,255,.55)">
        <circle cx="69" cy="58" r="1.4"/>
        <circle cx="59.5" cy="74.5" r="1.4"/>
        <circle cx="40.5" cy="74.5" r="1.4"/>
        <circle cx="31" cy="58" r="1.4"/>
        <circle cx="40.5" cy="41.5" r="1.4"/>
        <circle cx="59.5" cy="41.5" r="1.4"/>
      </g>
    </svg>
  );
}

/* ── 星币王牌 · 牌面（金色星币圆盘） ── */
function AceCard(){
  return (
    <div className="ace-card">
      <div className="r-disc">
        <svg width="34" height="34" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="17.5" fill="none" stroke="#1D1645" strokeWidth="1.4" opacity=".5"/>
          <path d="M20 7L23.1 15.7L32.4 16L25 21.6L27.6 30.5L20 25.3L12.4 30.5L15 21.6L7.6 16L16.9 15.7Z" fill="#1D1645" opacity=".8"/>
          <circle cx="20" cy="20" r="2.4" fill="#1D1645"/>
        </svg>
      </div>
      <div>
        <div className="r-title">星币王牌</div>
        <div className="r-sub">Ace of Pentacles</div>
      </div>
      <div className="r-tags">幸运<i>·</i>开始<i>·</i>财富</div>
    </div>
  );
}

/* ── TabBar（映照高亮） ── */
function TabBar(){
  return (
    <div className="tabbar">
      {TABS.map(t=>
        <div key={t.key} className={"tab"+(t.key==='home'?' on':'')}>
          {t.key==='home' ? <span className="pill">映照</span> : <Icon name={t.ic}/>}
        </div>)}
    </div>
  );
}

/* ═══════════════════ 壹 · 今日（首页 · 完全复刻 ScreenA）═══════════════════ */
function ScreenToday(){
  return (
    <React.Fragment>
      <div className="neb neb-l"/><div className="neb neb-g"/>
      <Stars/>
      <div className="brand">
        <div className="logo">星光映照</div>
        <div className="tag">每日一牌 · 遇见自己</div>
        <div className="greet">夜深了，月亮在等你开口</div>
        <div className="badge"><span className="dot"/><span>今日运势待开启</span></div>
      </div>
      <div className="cardwrap">
        <div className="card">
          <div className="card-inner">
            <div className="moon"/>
            <div>
              <div className="title">The Moon</div>
              <div className="subtitle">月亮牌 · 直觉</div>
            </div>
            <div className="hint">轻触卡片<small>开启今日指引</small></div>
          </div>
        </div>
      </div>
      <div className="treepanel">
        <div className="t-label">星光树洞</div>
        <div className="t-text">今天的塔罗启示：<i>星币王牌</i>，新的开始正在发芽</div>
        <div className="t-go">和星塔罗师聊聊 →</div>
      </div>
      <div className="cta press">开启今日指引</div>
      <TabBar/>
    </React.Fragment>
  );
}

/* ═══════════════════ 贰 · 洗牌（凭直觉选三张）═══════════════════ */
function ScreenShuffle(){
  const [picked,setPicked] = useState([]);
  const ready = picked.length===3;
  const toggle = (i)=>{
    setPicked(p=> p.includes(i) ? p.filter(x=>x!==i) : (p.length<3 ? [...p,i] : p));
  };
  return (
    <React.Fragment>
      <div className="neb neb-l"/><div className="neb neb-g"/>
      <Stars/>
      <div className="pick-head">
        <div className="pt">净手 · 洗牌</div>
        <div className="ps">凭直觉选三张牌</div>
      </div>
      <div className="pick-note">牌已洗好，心随星光走。<br/>不要犹豫——第一眼被吸引的，就是它。</div>
      <div className="pick-grid">
        {Array.from({length:9},(_,i)=>{
          const sel = picked.includes(i);
          const order = picked.indexOf(i);
          return (
            <div key={i} className={"pick-card"+(sel?' picked':'')} onClick={()=>toggle(i)}>
              <CardBack/>
              {sel && <span className="pick-num">{order+1}</span>}
            </div>
          );
        })}
      </div>
      <div className="pick-hint">
        <span className="hc">已选 {picked.length}/3</span>
        <span className="hp">第一张代表过去</span>
      </div>
      <div className={"cta press pick-cta"+(ready?'':' idle')}>{ready?'翻开牌面':'开始洗牌'}</div>
      <TabBar/>
    </React.Fragment>
  );
}

/* ═══════════════════ 叁 · 读牌中（星塔罗师正在解读）═══════════════════ */
function ScreenLoading(){
  return (
    <React.Fragment>
      <div className="neb neb-l"/><div className="neb neb-g"/>
      <Stars/>
      <div className="read-head">
        <div className="re">第三张牌 · 正在浮现</div>
        <div className="rt">星塔罗师正在解读…</div>
        <div className="rs">牌意正从星光中缓缓显现</div>
      </div>
      <div className="flip-zone">
        <div className="flip-halo"/>
        <div className="flip-card">
          <div className="face back"><CardBack/></div>
          <div className="face front"><AceCard/></div>
        </div>
      </div>
      <div className="rdots"><i/><i/><i/></div>
      <div className="read-dots-text">月光落在星币上…</div>
      <div className="rprog"/>
      <TabBar/>
    </React.Fragment>
  );
}

/* ═══════════════════ 肆 · 解读（今日指引 · 结果页）═══════════════════ */
function ScreenReveal(){
  return (
    <React.Fragment>
      <div className="neb neb-l"/><div className="neb neb-g"/>
      <Stars/>
      <div className="rv-head"><div className="rh">今日指引 · 2026年8月6日</div></div>
      <div className="rv-cardwrap">
        <div className="rv-card"><AceCard/></div>
      </div>
      <div className="rv-sep">✦ ✦ ✦</div>
      <div className="rv-text">星币王牌落于今日——<br/>新的开始正在发芽。<br/>月亮在暗处为你指路，<br/>属于你的第一枚金币，即将浮现。</div>
      <div className="seg-row">
        {[{k:'感情',v:'星光渐暖'},{k:'事业',v:'种下种子'},{k:'提示',v:'月亮不催促'}].map(s=>
          <div className="seg" key={s.k}>
            <span className="seg-pill">{s.k}</span>
            <span className="seg-t">{s.v}</span>
          </div>)}
      </div>
      <div className="btn-row">
        <div className="btn2 press">存为卡片</div>
        <div className="btn1 press">和星塔罗师聊聊
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5 8.5 6 3 10.5" fill="none" stroke="#241A02" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
      </div>
      <TabBar/>
    </React.Fragment>
  );
}

/* ═══════════════════ 伍 · 星光树洞（与星塔罗师聊天）═══════════════════ */
function ScreenChat(){
  const msgs = [
    {who:'ai', t:'夜安，我是星。今夜月亮很亮，你想和我说点什么？'},
    {who:'me', t:'今天抽到星币王牌，它是什么意思？'},
    {who:'ai', t:'星币王牌是土元素的第一缕光——它说：你种下的种子已经破土，秋天会结出第一枚果实。'},
    {who:'me', t:'可我有点等不及了……'},
    {who:'ai', t:'月亮不催促，它只是守着夜。你也不必急，好的开始，都值得慢慢发生。'},
  ];
  return (
    <React.Fragment>
      <div className="neb neb-l"/><div className="neb neb-g"/>
      <Stars/>
      <div className="chat-head">
        <div className="chat-back">
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10 2 2 10l8 8" stroke="#F5E9FF" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
        <div className="chat-title">星光树洞 · 星塔罗师</div>
      </div>
      <div className="chat-caption">8月6日 · 夜</div>
      <div className="chat-list">
        {msgs.map((m,i)=>
          <div key={i} className={"msg "+m.who}>
            {m.who==='ai' &&
              <div className="msg-ava">
                <svg width="12" height="12" viewBox="0 0 12 12"><path d="M8.4 1.4a6 6 0 1 0 0 9.2 4.8 4.8 0 0 1 0-9.2z" fill="#241A02"/></svg>
              </div>}
            <div className="bubble">{m.t}</div>
          </div>)}
      </div>
      <div className="chat-input">
        <div className="chat-field">说给星星听…</div>
        <div className="chat-send">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 14.5V3.5M4 8l5-5 5 5" stroke="#241A02" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ── 设备框 + 画布 ── */
function Device({no,name,desc,reading,children}){
  return (
    <div className="zone">
      <div className="zl"><span className="zno">{no}</span><span className="znm"> · {name}</span></div>
      <div className="zd">{desc}</div>
      <div className="bezel">
        <div className="sys-a">
          <div className={"screen"+(reading?' screen-reading':'')}>
            {children}
            <StatusBar/>
            <div className="island"/>
            <WxCapsule/>
            <div className="homebar"/>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const screens = [
    {no:'壹', name:'今日',     desc:'品牌首页 · 每日一牌',  el:<ScreenToday/>},
    {no:'贰', name:'洗牌',     desc:'凭直觉选三张',        el:<ScreenShuffle/>},
    {no:'叁', name:'读牌中',   desc:'星塔罗师解读中',      el:<ScreenLoading/>, reading:true},
    {no:'肆', name:'解读',     desc:'今日指引 · 星币王牌',  el:<ScreenReveal/>},
    {no:'伍', name:'星光树洞', desc:'与星塔罗师对话',      el:<ScreenChat/>},
  ];
  return (
    <div className="stage">
      <h1>星 光 映 照</h1>
      <div className="sub">宇宙夜曲 · 五屏完整流程</div>
      <div className="row">
        {screens.map(s=><Device key={s.no} no={s.no} name={s.name} desc={s.desc} reading={s.reading}>{s.el}</Device>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
