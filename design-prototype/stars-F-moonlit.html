<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光映照 · 月夜灵光 · 六屏完整流程</title>
<meta name="description" content="星光映照塔罗小程序 — 方向二 月夜灵光：深紫罗兰月夜 · 原创插画牌面 · 柔光与克制动效 · 浅色模式概念">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600;900&family=Noto+Sans+SC:wght@400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   星光映照 · 方向二 · 月夜灵光 Moonlit Violet
   深紫罗兰月夜（非纯黑）· 金色月光柔光 · 原创插画牌面 · 毛玻璃
   动效克制：星轨缓移 / 月光呼吸 / 翻牌翻转 / 粒子散落仅一次
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#171226;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#EDE7F0}
#root{min-height:100%}
::selection{background:rgba(245,212,143,.3)}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}

/* ── 画布 ── */
.stage{max-width:1900px;margin:0 auto;padding:30px 24px 70px}
.stage h1{font-family:'Noto Serif SC',serif;font-weight:600;font-size:26px;text-align:center;letter-spacing:10px;color:#EDE7F0;margin-bottom:6px}
.stage .sub{text-align:center;font-size:13px;color:rgba(237,231,240,.45);letter-spacing:3px;margin-bottom:18px}
.stage{--gold:#F5D48F;--gold-soft:rgba(245,212,143,.08);--gold-stroke:rgba(245,212,143,.35)}
.stage.light{--gold:#C89B4A;--gold-soft:rgba(200,155,74,.12);--gold-stroke:rgba(200,155,74,.45)}
.mode-toggle{display:inline-flex;align-items:center;gap:8px;margin:0 auto 26px;padding:10px 22px;border-radius:999px;border:1px solid var(--gold-stroke);background:var(--gold-soft);color:var(--gold);font-size:12.5px;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:background .25s,border-color .25s;box-shadow:0 0 22px rgba(245,212,143,.12)}
.mode-toggle:hover{background:rgba(245,212,143,.18)}
.mode-toggle svg{display:block}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:56px 48px}
.zone{display:flex;flex-direction:column;align-items:center}
.zl{font-family:'Noto Serif SC',serif;display:flex;align-items:baseline;gap:4px;margin:0 0 4px}
.zno{font-size:12px;color:#D9AF6B;letter-spacing:5px}
.znm{font-size:14px;letter-spacing:3px;color:rgba(237,231,240,.82)}
.zd{font-size:11.5px;color:rgba(237,231,240,.38);letter-spacing:1.5px;margin-bottom:14px}

/* ── 设备框 ── */
.bezel{background:linear-gradient(180deg,#262038 0%,#141024 100%);border:1px solid rgba(255,255,255,.09);border-radius:46px;padding:10px;box-shadow:0 36px 80px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);position:relative}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:116px;height:32px;border-radius:20px;background:#000;border:.5px solid rgba(255,255,255,.16);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.04),0 0 14px rgba(0,0,0,.5);z-index:40;pointer-events:none}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:124px;height:4px;border-radius:2px;background:rgba(255,255,255,.72);box-shadow:0 1px 6px rgba(0,0,0,.35);z-index:45;pointer-events:none}
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 104px 0 28px;z-index:25;pointer-events:none;color:#fff}
.sb .sb-time{font-size:16px;font-weight:600;letter-spacing:.2px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.sb .sb-icons{display:flex;gap:7px;align-items:center}
.sb .sb-icons svg{fill:currentColor}
.sb .sb-icons svg .bat{stroke:currentColor}
.stage.light .sb,.stage.light .sb .sb-time{color:#241B3C}

/* ═══════════════════ 月夜灵光 主题 ═══════════════════ */
.sys-m{
  --bg0:#241A3E; --bg1:#1A1230; --bg2:#150F28;
  --gold:#F5D48F; --gold-deep:#D9AF6B; --gold-soft:rgba(245,212,143,.16);
  --gold-ink:#2A1D4F;
  --ink:#F3ECFF; --ink-dim:rgba(243,236,255,.64); --ink-faint:rgba(243,236,255,.4);
  --glass:rgba(255,255,255,.12); --glass-strong:rgba(255,255,255,.17);
  --glass-stroke:rgba(255,255,255,.2);
  --halo:rgba(245,212,143,.5);
  --star:#fff;
  --serif:'Noto Serif SC',serif; --hand:'Ma Shan Zheng',cursive;
  --lat:'Cormorant Garamond',Georgia,serif; --sans:'Noto Sans SC','PingFang SC',system-ui,sans-serif;
}
/* 浅色模式 · 晨光概念 */
.stage.light .sys-m{
  --bg0:#F7F2FC; --bg1:#F1E8F8; --bg2:#EADEF4;
  --gold:#C89B4A; --gold-deep:#A87F35; --gold-soft:rgba(200,155,74,.14);
  --gold-ink:#FFFDF6;
  --ink:#3B2B5E; --ink-dim:rgba(59,43,94,.72); --ink-faint:rgba(59,43,94,.46);
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.72);
  --glass-stroke:rgba(120,90,165,.25);
  --halo:rgba(216,180,110,.4);
  --star:#A98FD4;
}
.sys-m .screen{
  width:300px;height:640px;border-radius:34px;overflow:hidden;position:relative;
  background:radial-gradient(130% 90% at 50% -12%, var(--bg0) 0%, var(--bg1) 55%, var(--bg2) 100%);
  color:var(--ink);box-shadow:0 30px 60px rgba(0,0,0,.5);
}
.sys-m .screen.reading{background:radial-gradient(130% 90% at 50% -12%, #1E1640 0%, #14102C 55%, #0E0A22 100%)}
.stage.light .sys-m .screen.reading{background:radial-gradient(130% 90% at 50% -12%, #F0E9F7 0%, #E6DBEF 55%, #DCCFEA 100%)}

/* ── 星轨与星野（缓移，非密恐） ── */
.sys-m .stars{position:absolute;inset:0;pointer-events:none;z-index:1}
.sys-m .star{position:absolute;border-radius:50%;background:var(--star);animation:twinkle var(--tw,4.5s) ease-in-out infinite;animation-delay:var(--td,0s)}
.sys-m .stars.dim .star{animation:none;opacity:.5}
.sys-m .streak-w{position:absolute;pointer-events:none;transform:rotate(var(--rot,0deg))}
.sys-m .streak{height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(245,212,143,.6),transparent);animation:streakMove 22s ease-in-out infinite alternate}
@keyframes twinkle{0%,100%{opacity:.22}50%{opacity:.95}}
@keyframes streakMove{from{transform:translateX(-7px);opacity:.35}to{transform:translateX(9px);opacity:.95}}

/* ── 月光呼吸晕 ── */
.sys-m .halo{position:absolute;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,var(--halo) 0%,rgba(245,212,143,.16) 40%,transparent 68%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.97)}50%{opacity:.92;transform:scale(1.04)}}

/* ── 插画牌面容器（原创金线紫雾插画，牌即藏品） ── */
.sys-m .art{position:relative;border-radius:13px;overflow:hidden;border:1px solid rgba(245,212,143,.42);box-shadow:0 0 0 1px rgba(255,255,255,.06),0 18px 44px rgba(10,6,26,.6),0 0 46px rgba(245,212,143,.2)}
.sys-m .art svg{display:block;width:100%;height:100%}

/* ── 金色柔光主按钮 ── */
.sys-m .btn-gold{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;cursor:pointer;border:none;background:radial-gradient(130% 170% at 28% -10%,#FFF3D2 0%,var(--gold) 46%,var(--gold-deep) 100%);color:var(--gold-ink);font-size:14px;font-weight:600;letter-spacing:4px;font-family:var(--sans);box-shadow:0 6px 24px rgba(217,175,107,.35),0 0 30px rgba(245,212,143,.2);transition:transform .15s}
.sys-m .btn-gold:active{transform:scale(.97)}
.sys-m .btn-ghost{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;cursor:pointer;background:var(--glass);border:1px solid rgba(245,212,143,.45);color:var(--gold);font-size:13.5px;letter-spacing:3px;font-family:var(--sans);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .15s}
.sys-m .btn-ghost:active{transform:scale(.97)}

/* ── 毛玻璃 TabBar ── */
.sys-m .tabbar{position:absolute;left:14px;right:14px;bottom:14px;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:space-around;background:var(--glass-strong);border:1px solid var(--glass-stroke);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(8,5,20,.35),inset 0 1px 0 rgba(255,255,255,.14);z-index:4}
.sys-m .tabbar .tab{font-size:11px;color:var(--ink-dim);display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px;cursor:pointer;padding:7px 0;letter-spacing:2px;transition:color .2s}
.sys-m .tabbar .tab.on{color:var(--gold)}
.sys-m .tabbar .tab .ic{width:20px;height:20px}
.sys-m .tabbar .tab.on .pill{background:var(--gold-soft);border:1px solid rgba(245,212,143,.4);border-radius:999px;padding:3px 14px;font-size:11px;letter-spacing:3px}

/* 返回键（≥44px） */
.sys-m .back{position:absolute;left:16px;top:48px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--glass);border:1px solid var(--glass-stroke);cursor:pointer;z-index:3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sys-m .back:active{transform:scale(.94)}

/* 微信胶囊 */
.wxcapsule{position:absolute;top:13px;right:8px;z-index:30;display:flex;gap:4px;pointer-events:none}
.wxcapsule .cap{width:40px;height:32px;border-radius:7px;background:rgba(255,255,255,.22);border:.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.wxcapsule .cap svg{fill:rgba(0,0,0,.65)}
.wxcapsule .cap:first-child{flex-direction:column;gap:3px}
.wxcapsule .cap:first-child span{display:block;width:3px;height:3px;border-radius:50%;background:rgba(0,0,0,.6)}
.wxcapsule .cap .circle{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.6)}

/* ═══════════════════ 壹 · 今日（深夜诗刊） ═══════════════════ */
.t1 .brand{position:relative;z-index:2;text-align:center;padding-top:58px}
.t1 .brand .logo{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:10px;color:var(--ink);text-shadow:0 0 26px rgba(245,212,143,.5)}
.t1 .brand .date{font-size:11px;letter-spacing:4px;color:var(--ink-faint);margin-top:8px;font-family:var(--sans)}
.t1 .rule{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.t1 .rule .ln{width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));opacity:.5}
.t1 .rule .ln:last-child{transform:scaleX(-1)}
.t1 .rule .st{color:var(--gold);font-size:11px;letter-spacing:2px}
.t1 .side{position:absolute;left:17px;top:232px;z-index:2;writing-mode:vertical-rl;font-size:11px;letter-spacing:6px;color:var(--ink-faint);font-family:var(--sans)}
.t1 .side::after{content:'';display:inline-block;width:1px;height:30px;background:linear-gradient(180deg,var(--gold),transparent);margin-top:10px;opacity:.5}
.t1 .eyebrow{position:relative;z-index:2;margin-top:13px;text-align:right;padding-right:32px}
.t1 .eyebrow .en{font-family:var(--lat);font-style:italic;font-size:11px;letter-spacing:3px;color:var(--ink-faint)}
.t1 .halo{width:248px;height:248px;top:186px;left:26px}
.t1 .cardzone{position:relative;z-index:2;display:flex;justify-content:center;margin-top:7px}
.t1 .cardzone .art{width:162px;height:243px}
.t1 .phrase{position:relative;z-index:2;text-align:center;font-family:var(--serif);font-size:15px;letter-spacing:2px;line-height:1.7;color:var(--ink);margin-top:13px}
.t1 .phrase .nm{color:var(--gold)}
.t1 .phrase .ln2{display:block;color:var(--ink-dim);font-size:13px;letter-spacing:4px}
.t1 .quote{position:relative;z-index:2;text-align:right;padding-right:34px;margin-top:7px;font-family:var(--hand);font-size:17px;color:var(--gold);transform:rotate(-1.6deg);letter-spacing:1px}
.t1 .cta{width:262px;margin:11px auto 0}

/* ═══════════════════ 贰 · 洗牌 ═══════════════════ */
.t2 .nav{position:absolute;top:52px;left:0;right:0;display:flex;align-items:center;justify-content:center;z-index:2}
.t2 .nav .tt{font-family:var(--serif);font-size:19px;letter-spacing:6px;color:var(--ink)}
.t2 .head{position:absolute;top:116px;left:0;right:0;text-align:center;z-index:2}
.t2 .head .st{font-family:var(--sans);font-size:11px;letter-spacing:5px;color:var(--gold)}
.t2 .head .sub{font-size:11.5px;color:var(--ink-dim);margin-top:8px;letter-spacing:1px;line-height:1.6;padding:0 44px}
.t2 .grid{position:absolute;left:18px;right:18px;top:180px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;z-index:2}
.t2 .pick-card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid rgba(245,212,143,.18);background:#171033;transition:transform .2s,border-color .2s,box-shadow .2s}
.t2 .pick-card svg{display:block;width:100%;height:100%}
.t2 .pick-card.sel{border-color:var(--gold);box-shadow:0 0 0 1px rgba(245,212,143,.35),0 9px 24px rgba(245,212,143,.16);transform:translateY(-5px)}
.t2 .pick-num{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-size:10.5px;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;z-index:3;box-shadow:0 3px 10px rgba(10,6,26,.45)}
.t2 .counter{position:absolute;left:0;right:0;top:552px;text-align:center;z-index:2;font-size:11px;letter-spacing:2px;color:var(--ink-dim)}
.t2 .counter b{color:var(--gold);font-weight:500;font-size:12px}
.t2 .pick-cta{position:absolute;left:50%;transform:translateX(-50%);width:236px;top:576px}
.t2 .pick-cta.idle{opacity:.6;box-shadow:none}

/* ═══════════════════ 叁 · 读牌中 ═══════════════════ */
.t3 .chip{position:absolute;top:56px;left:50%;transform:translateX(-50%);display:inline-flex;gap:8px;align-items:center;padding:7px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-stroke);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:11px;letter-spacing:3px;color:var(--ink-dim);z-index:3;white-space:nowrap}
.t3 .chip .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:ypulse 2s ease-in-out infinite}
@keyframes ypulse{0%,100%{opacity:1}50%{opacity:.35}}
.t3 .main{position:absolute;top:148px;left:0;right:0;text-align:center;z-index:3}
.t3 .main .ml{font-family:var(--serif);font-size:18px;letter-spacing:5px;color:var(--ink)}
.t3 .main .ms{font-family:var(--hand);font-size:14px;color:var(--gold);margin-top:9px;letter-spacing:1px}
.t3 .flipzone{position:absolute;top:216px;left:50%;transform:translateX(-50%);width:162px;height:243px;perspective:700px;z-index:3}
.t3 .flip3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flipLoop 4.8s ease-in-out infinite}
.t3 .face{position:absolute;inset:0;border-radius:13px;overflow:hidden;border:1px solid rgba(245,212,143,.42);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 44px rgba(10,6,26,.6),0 0 46px rgba(245,212,143,.18)}
.t3 .face svg{display:block;width:100%;height:100%}
.t3 .face.f2{transform:rotateY(180deg)}
@keyframes flipLoop{0%,14%{transform:rotateY(0)}42%{transform:rotateY(180deg)}64%{transform:rotateY(180deg)}92%,100%{transform:rotateY(360deg)}}
.t3 .burst{position:absolute;inset:0;pointer-events:none;z-index:5}
.t3 .pdot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);opacity:0;animation:burst 1.5s ease-out 2.5s 1 forwards}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.3)}10%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.95)}}
.t3 .rzone{position:absolute;left:24px;right:24px;bottom:64px;text-align:center;z-index:3}
.t3 .rlab{font-size:11px;letter-spacing:3px;color:var(--ink-dim);margin-bottom:12px}
.t3 .rprog{position:relative;height:2px;border-radius:2px;background:var(--glass-stroke)}
.t3 .rprog .tk{position:absolute;top:-1.5px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(245,212,143,.7)}
.t3 .rprog .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--gold-deep),var(--gold));animation:rfill 4.8s linear infinite}
@keyframes rfill{0%{width:6%}94%{width:94%}100%{width:94%}}

/* ═══════════════════ 肆 · 解读（今日指引） ═══════════════════ */
.t4 .rv{position:absolute;top:52px;left:0;right:0;text-align:center;z-index:3}
.t4 .rv .en{font-family:var(--lat);font-style:italic;font-size:11px;letter-spacing:3px;color:var(--ink-faint)}
.t4 .rv .tt{font-family:var(--serif);font-size:18px;letter-spacing:5px;margin-top:7px;color:var(--ink)}
.t4 .rv .tt b{color:var(--gold);font-weight:600}
.t4 .halo{width:196px;height:196px;top:136px;left:52px}
.t4 .artw{position:absolute;top:146px;left:50%;transform:translateX(-50%);z-index:3}
.t4 .artw .art{width:142px;height:213px}
.t4 .artw .cap{position:absolute;left:50%;transform:translateX(-50%);top:-22px;white-space:nowrap;background:var(--glass);border:1px solid rgba(245,212,143,.4);border-radius:999px;padding:4px 13px;font-size:11px;letter-spacing:3px;color:var(--gold);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.t4 .text{position:absolute;left:26px;right:26px;top:386px;font-family:var(--serif);font-size:13.5px;line-height:1.75;text-align:center;color:var(--ink);letter-spacing:.5px;z-index:3}
.t4 .segs{position:absolute;left:22px;right:22px;top:506px;display:flex;gap:9px;z-index:3}
.t4 .seg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;border-radius:999px;background:var(--glass);border:1px solid rgba(245,212,143,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;transition:transform .15s}
.t4 .seg:active{transform:scale(.96)}
.t4 .seg .k{font-family:var(--serif);font-size:12.5px;letter-spacing:3px;color:var(--gold)}
.t4 .seg .v{font-size:11px;color:var(--ink-dim);letter-spacing:1px}
.t4 .btns{position:absolute;left:18px;right:18px;bottom:54px;display:flex;gap:10px;z-index:3}
.t4 .btns .btn-ghost{flex:1.05;min-width:96px}
.t4 .btns .btn-gold{flex:1.6}

/* ═══════════════════ 伍 · 星光树洞 ═══════════════════ */
.t5 .chat-nav{position:absolute;top:52px;left:0;right:0;display:flex;align-items:center;justify-content:center;z-index:3}
.t5 .chat-nav .tt{font-family:var(--serif);font-size:17px;letter-spacing:4px;color:var(--ink)}
.t5 .chat-caption{position:absolute;top:99px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-faint);letter-spacing:4px;z-index:3}
.t5 .chat-list{position:absolute;top:126px;left:0;right:0;bottom:88px;overflow:hidden;padding:6px 16px;display:flex;flex-direction:column;gap:14px;z-index:2}
.t5 .msg{display:flex;align-items:flex-end;gap:8px;max-width:88%}
.t5 .msg.me{flex-direction:row-reverse;margin-left:auto}
.t5 .msg .ava{flex:none;width:26px;height:26px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-stroke);display:flex;align-items:center;justify-content:center}

      </g>
    </svg>
  );
}

/* ── TabBar（映照高亮） ── */
function TabBar(){
  return (
    <div className="tabbar">
      {TABS.map(t=>
        <div key={t.key} className={"tab"+(t.key==='home'?' on':'')}>
          {t.key==='home' ? <span className="pill">映照</span> : <React.Fragment><Icon name={t.ic}/><span>{t.name}</span></React.Fragment>}
        </div>)}
    </div>
  );
}

/* ═══════════════════ 壹 · 今日（深夜诗刊，元素错落） ═══════════════════ */
function ScreenToday(){
  return (
    <div className="t1">
      <StarField/>
      <div className="halo"/>
      <div className="brand">
        <div className="logo">星光映照</div>
        <div className="date">2026年8月7日 · 夜</div>
      </div>
      <div className="rule"><span className="ln"/><span className="st">✦</span><span className="ln"/></div>
      <div className="side">月夜诗刊 · 卷八</div>
      <div className="eyebrow"><span className="en">Today · 月光签</span></div>
      <div className="cardzone">
        <div className="art"><MoonArt/></div>
      </div>
      <div className="phrase"><span className="nm">月亮牌</span> · 夜深了<span className="ln2">月光替你记住今天</span></div>
      <div className="quote">观星人，今夜月亮在等你</div>
      <div className="btn-gold cta">翻开今日牌面</div>
      <TabBar/>
    </div>
  );
}

/* ═══════════════════ 贰 · 洗牌（净手 · 凭直觉选三张） ═══════════════════ */
function ScreenShuffle(){
  const [picked,setPicked] = useState([]);
  const toggle = (i)=>{
    setPicked(p=> p.includes(i) ? p.filter(x=>x!==i) : (p.length<3 ? [...p,i] : p));
  };
  return (
    <div className="t2">
      <StarField dim/>
      <div className="back">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10 2 2 10l8 8" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </div>
      <div className="nav"><div className="tt">洗牌</div></div>
      <div className="head">
        <div className="st">净 手 · 洗 牌</div>
        <div className="sub">凭直觉选三张——第一眼被吸引的，就是它。</div>
      </div>
      <div className="grid">
        {Array.from({length:9},(_,i)=>{
          const sel = picked.includes(i);
          return (
            <div key={i} className={"pick-card"+(sel?' sel':'')} onClick={()=>toggle(i)}>
              <CardBackSvg/>
              {sel && <span className="pick-num">{picked.indexOf(i)+1}</span>}
            </div>
          );
        })}
      </div>
      <div className="counter"><b>已选 {picked.length} / 3</b> · 第一张代表过去</div>
      <div className={"btn-gold pick-cta"+(picked.length===3?'':' idle')}>翻开牌面</div>
    </div>
  );
}

/* ═══════════════════ 叁 · 读牌中（月光正在落笔…） ═══════════════════ */
function ScreenLoading(){
  const dots = [[70,8],[-62,-28],[52,-56],[-40,48],[-74,-6],[60,40],[-20,-70],[36,66],[-8,74],[88,-24],[-88,20],[20,-80]];
  return (
    <div className="t3">
      <StarField dim/>
      <div className="chip"><span className="dot"/><span>解牌中 · 第 3 / 3 张</span></div>
      <div className="main">
        <div className="ml">月光正在落笔…</div>
        <div className="ms">牌意正从雾里成形</div>
      </div>
      <div className="flipzone">
        <div className="flip3d">
          <div className="face f1"><CardBackSvg/></div>
          <div className="face f2"><MoonArt/></div>
        </div>
        <div className="burst">
          {dots.map((d,i)=><span key={i} className="pdot" style={{['--dx']:d[0]+'px',['--dy']:d[1]+'px'}}/>)}
        </div>
      </div>
      <div className="rzone">
        <div className="rlab">星币王牌 · 即将浮现</div>
        <div className="rprog">
          <i className="tk" style={{left:'12%'}}/><i className="tk" style={{left:'34%'}}/><i className="tk" style={{left:'56%'}}/><i className="tk" style={{left:'78%'}}/><i className="tk" style={{left:'94%'}}/>
          <div className="fill"/>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════ 肆 · 解读（今日指引） ═══════════════════ */
function ScreenReveal(){
  return (
    <div className="t4">
      <StarField dim/>
      <div className="halo"/>
      <div className="rv">
        <div className="en">Today's Guidance</div>
        <div className="tt">今日指引 · <b>8月7日</b></div>
      </div>
      <div className="artw">
        <div className="cap">星币王牌</div>
        <div className="art"><AceArt/></div>
      </div>
      <div className="text">星币王牌落于今夜——<br/>新的可能正在土壤里发芽。<br/>月光之下，属于你的第一枚金币，<br/>即将浮现。</div>
      <div className="segs">
        <div className="seg"><span className="k">感情</span><span className="v">星光渐暖</span></div>
        <div className="seg"><span className="k">事业</span><span className="v">种下种子</span></div>
        <div className="seg"><span className="k">内心</span><span className="v">月光不催</span></div>
      </div>
      <div className="btns">
        <div className="btn-ghost">存为卡片</div>
        <div className="btn-gold">与星塔罗师聊聊
          <svg width="13" height="13" viewBox="0 0 13 13" style={{marginLeft:6}}><path d="M3 1.8 8.8 6.5 3 11.2" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════ 伍 · 星光树洞（与星塔罗师聊天） ═══════════════════ */
function ScreenChat(){
  const msgs = [
    {who:'ai', t:'夜安，我是星。今夜月亮很亮，你的心事可以放心说给我听。'},
    {who:'me', t:'我今天抽到了星币王牌，它是不是在说我该换工作了？'},
    {who:'ai', t:'星币王牌是土元素的第一缕光——你种下的种子已经破土，秋天会结出第一枚金币。'},
    {who:'me', t:'那明天那个面试，我该去吗？'},
    {who:'ai', t:'月亮不催促，只守着夜。好的开始，都值得慢慢发生。去试试看吧。'},
  ];
  return (
    <div className="t5">
      <StarField dim/>
      <div className="chat-nav">
        <div className="back">
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10 2 2 10l8 8" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
        <div className="tt">星光树洞 · 星塔罗师</div>
      </div>
      <div className="chat-caption">8月7日 · 夜</div>
      <div className="chat-list">
        {msgs.map((m,i)=>
          <div key={i} className={"msg "+m.who}>
            {m.who==='ai' &&
              <div className="ava">
                <svg width="12" height="12" viewBox="0 0 12 12"><path d="M8.4 1.4a6 6 0 1 0 0 9.2 4.8 4.8 0 0 1 0-9.2z" fill="#F5D48F"/></svg>
              </div>}
            <div className="bubble">{m.t}</div>
          </div>)}
      </div>
      <div className="chat-input">
        <div className="f">说给月亮听…</div>
        <div className="send">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 14.5V3.5M4 8l5-5 5 5" stroke="#2A1D4F" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════ 陆 · 分享海报（深夜诗卡 · 结果即传播） ═══════════════════ */
function ScreenPoster(){
  const pstars = [[16,26,0],[56,14,1.6],[96,30,2.8],[160,18,.8],[216,34,2.1],[252,12,3.4],[30,66,1.2],[120,58,3.6],[186,74,.5],[20,108,2.5],[100,100,1.8],[200,116,3.1],[44,140,1.1],[140,146,2.3],[238,142,.3]];

        <div className="p-foot">

}

/* ── 设备框 + 画布 ── */
function Device({no,name,desc,reading,children}){
  return (
    <div className="zone">
      <div className="zl"><span className="zno">{no}</span><span className="znm"> · {name}</span></div>
      <div className="zd">{desc}</div>
      <div className="bezel">
        <div className="sys-m">
          <div className={"screen"+(reading?' reading':'')}>
            {children}
            <StatusBar/>
            <div className="island"/>
            <WxCapsule/>
            <div className="homebar"/>
          </div>
        </div>
      </div>
    </div>
  );
}

const MoonIco = () => (
  <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M10.8 1.8a6.2 6.2 0 1 0 0 11.4 5 5 0 0 1 0-11.4z" fill="currentColor"/></svg>
);
const SunIco = () => (
  <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="3" fill="currentColor"/><g stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"><path d="M7.5 1v2M7.5 12v2M1 7.5h2M12 7.5h2M3 3l1.4 1.4M10.6 10.6 12 12M12 3l-1.4 1.4M4.4 10.6 3 12"/></g></svg>
);

function App(){
  const [light,setLight] = useState(false);
  const screens = [
    {no:'壹', name:'今日',     desc:'深夜诗刊 · 月光下的月亮牌', el:<ScreenToday/>},
    {no:'贰', name:'洗牌',     desc:'净手 · 凭直觉选三张',      el:<ScreenShuffle/>},
    {no:'叁', name:'读牌中',   desc:'月光正在落笔…',           el:<ScreenLoading/>, reading:true},
    {no:'肆', name:'解读',     desc:'今日指引 · 星币王牌',      el:<ScreenReveal/>},
    {no:'伍', name:'星光树洞', desc:'与星塔罗师对话',          el:<ScreenChat/>},
    {no:'陆', name:'分享海报', desc:'深夜诗卡 · 结果即传播',    el:<ScreenPoster/>},
  ];
  return (
    <div className={"stage"+(light?' light':'')}>
      <h1>星 光 映 照</h1>
      <div className="sub">方向二 · 月夜灵光 — 深紫罗兰月夜 · 原创插画牌面 · 柔光与克制动效</div>
      <div style={{textAlign:'center'}}>
        <button className="mode-toggle" onClick={()=>setLight(l=>!l)}>
          {light ? <SunIco/> : <MoonIco/>}
          <span>{light ? '晨光 · 浅色模式（点按回到夜色）' : '夜色 · 深紫罗兰（点按预览浅色模式）'}</span>
        </button>
      </div>
      <div className="row">
        {screens.map(s=><Device key={s.no} no={s.no} name={s.name} desc={s.desc} reading={s.reading}>{s.el}</Device>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
