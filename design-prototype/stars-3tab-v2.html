<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光映照 · 3 Tab v2 · 每屏只有一个主角</title>
<meta name="description" content="星光映照塔罗小程序 — 3 Tab v2：今日（牌是主角）/ 神谕（你的底牌是主角）/ 我的（星光记录是主角）。E3 奶油疗愈语言 + 真实水彩插画。今日屏沿用已认可方案A。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   星光映照 · 3 Tab v2 · 塔罗 × 星座融合原型
   核心设计原则（贯穿三屏）：每个 Tab 只有一个主角，其他都是注脚/入口
   · Tab 1 今日 = 牌是主角（沿用已认可方案A stars-today-focus，微调：TabBar 三格可点击）
   · Tab 2 神谕 = "你的底牌"是主角（星盘三要素水彩翻面卡），牌阵/百科是入口注脚
   · Tab 3 我的 = "你的星光记录"是主角（连续天数+牌运曲线），日记/功能是入口
   视觉：E3 奶油疗愈（#FAF6EF / 雾粉 #E8C4BE / 细金 #C9A97C / 墨 #3D3A36 / 衬线）
   插画：assets/web/*.jpg 真实水彩（内联 base64，自包含）
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#29231E;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#EFE4D6}
#root{min-height:100%}
::selection{background:rgba(232,196,190,.45)}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
img{-webkit-user-drag:none;user-select:none}

/* ── 展示舞台（暗底 · 三屏并排） ── */
.stage{max-width:1600px;margin:0 auto;padding:44px 24px 88px}
.stage h1{font-family:'Noto Serif SC',serif;font-weight:500;font-size:30px;text-align:center;letter-spacing:14px;color:#F0E2D0;margin-bottom:10px}
.stage .sub{text-align:center;font-size:11px;color:rgba(201,169,124,.85);letter-spacing:4px;margin-bottom:6px}
.stage .meta{text-align:center;font-size:11.5px;color:rgba(239,228,214,.35);letter-spacing:1px;margin-bottom:40px}
.grid{display:flex;flex-wrap:wrap;gap:46px 30px;justify-content:center;align-items:flex-start}
.zone{display:flex;flex-direction:column;align-items:center}
.zoom{transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.zoom:hover{transform:scale(1.03)}
.cap{margin-top:14px;font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:3px;color:rgba(240,226,208,.85)}
.cap-sub{margin-top:4px;font-size:11px;letter-spacing:1px;color:rgba(240,226,208,.38)}
@media(max-width:760px){.grid{flex-direction:column;align-items:center}}

/* ═══════════════════ E3 奶油疗愈 · 设计令牌 ═══════════════════ */
.sys-e3{
  --cream:#FAF6EF; --cream-hi:#FFFDF8; --paper:#F2ECDF;
  --pink:#E8C4BE; --pink-deep:#DCA9A1; --pink-ink:#B08A82;
  --gold:#C9A97C; --gold-deep:#B08F52;
  --line:rgba(201,169,124,.28); --line-soft:rgba(201,169,124,.38);
  --ink:#3D3A36; --ink-soft:#8A8478; --ink-faint:#B0AA9C;
  --serif:'Noto Serif SC',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --num:'EB Garamond','Noto Serif SC',serif;
  --shadow:0 2px 10px rgba(61,58,54,.06);
  --hi:inset 0 1px 0 rgba(255,255,255,.6);
}
.sys-e3.screen, .sys-e3 .screen{
  background:var(--cream);color:var(--ink);position:relative;overflow:hidden;
  font-family:var(--serif);
  width:300px;height:640px;border-radius:34px;
  box-shadow:0 34px 70px rgba(0,0,0,.6);
}
.sys-e3 .wash{position:absolute;border-radius:50%;pointer-events:none;filter:blur(38px);z-index:0}
.sys-e3 .pad{position:relative;z-index:2}

/* ── 微信胶囊（奶油浅底 -> 白色胶囊深色 icon） ── */
.wxcapsule{
  position:absolute;top:13px;right:8px;z-index:30;display:flex;gap:4px;pointer-events:none;
}
.wxcapsule .cap{
  width:40px;height:32px;border-radius:7px;
  background:rgba(255,253,248,.92);border:0.5px solid rgba(201,169,124,.3);
  box-shadow:0 2px 6px rgba(61,58,54,.05);
  display:flex;align-items:center;justify-content:center;
}
.wxcapsule .cap svg{fill:#3D3A36}
.wxcapsule .cap:first-child{flex-direction:column;gap:3px}
.wxcapsule .cap:first-child span{display:block;width:3px;height:3px;border-radius:50%;background:#3D3A36}
.wxcapsule .cap .circle{width:15px;height:15px;border-radius:50%;border:1.5px solid #3D3A36}

/* ── TabBar（三栏 · 今日 / 神谕 / 我的 · 可点击切换） ── */
.tabbar{
  position:absolute;left:14px;right:14px;bottom:8px;height:52px;border-radius:20px;z-index:20;
  display:flex;align-items:center;justify-content:space-around;
  background:var(--cream-hi);border:.5px solid rgba(201,169,124,.26);
  box-shadow:var(--shadow),var(--hi);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  flex:1;height:100%;cursor:pointer;user-select:none;transition:opacity .15s ease;
}
.tab:active{opacity:.75}
.tab span{font-family:var(--sans);font-size:11px;letter-spacing:2px;color:var(--ink-faint)}
.tab.on span{color:var(--ink);font-weight:500}
.tab .tdot{width:3.5px;height:3.5px;border-radius:50%;background:transparent}
.tab.on .tdot{background:var(--gold)}

/* ── Toast ── */
.toast{
  position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:40;
  background:rgba(61,58,54,.93);color:#F5EDDD;
  font-family:var(--sans);font-size:12px;letter-spacing:1.5px;
  padding:10px 18px;border-radius:999px;white-space:nowrap;
  box-shadow:0 8px 22px rgba(61,58,54,.28);
  animation:toastIn .28s ease both;
}
@keyframes toastIn{
  0%{opacity:0;transform:translateX(-50%) translateY(6px)}
  100%{opacity:1;transform:translateX(-50%) translateY(0)}
}

/* ═══════════════ Tab 1 · 今日 ── 每日一牌为绝对主角（已认可方案A） ═══════════════ */
/* 顶部：品牌 + 日期（左）· 星座徽章（右，极小） */
.topbar{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:42px 18px 0}
.brand{font-family:var(--serif);font-weight:500;font-size:14.5px;color:var(--ink);letter-spacing:5px}
.date-row{display:flex;align-items:center;gap:6px;margin-top:5px;font-family:var(--num);font-size:10px;color:var(--ink-faint);letter-spacing:1.5px}
.gold-dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--gold);flex-shrink:0}
.zodiac{
  display:inline-flex;align-items:center;height:18px;padding:0 9px;border-radius:999px;
  background:var(--cream-hi);border:.5px solid rgba(201,169,124,.38);
  font-family:var(--sans);font-size:9.5px;color:var(--gold-deep);letter-spacing:1.5px;
  margin-top:2px;box-shadow:var(--hi);user-select:none;
}
/* 天象小字：一行 · 带图标 · 安静的注脚 */
.sky-note{
  position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:11px;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px;
}
/* 中央绝对主角：月亮牌（奶油装裱 · 细金边 · 光晕 · 浮动） */
.card-zone{position:relative;z-index:2;height:306px;margin-top:11px}
.halo{
  position:absolute;left:50%;top:50%;width:212px;height:212px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(201,169,124,.30),rgba(201,169,124,0) 72%);
  animation:haloBreathe 6s ease-in-out infinite;
}
@keyframes haloBreathe{
  0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
}
.sp{position:absolute;pointer-events:none;animation:twinkle 4.2s ease-in-out infinite}
.sp.s1{right:26px;top:4px}
.sp.s2{left:20px;bottom:8px;animation-delay:1.1s;opacity:.75}
@keyframes twinkle{
  0%,100%{opacity:.32;transform:scale(.85) rotate(0)}
  50%{opacity:.85;transform:scale(1.1) rotate(14deg)}
}
.mount{position:absolute;left:0;right:0;top:2px;display:flex;justify-content:center;animation:riseIn .95s cubic-bezier(.2,.7,.3,1) .12s both}
@keyframes riseIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
.float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mat{
  padding:6px;border-radius:19px;background:var(--cream-hi);cursor:pointer;
  border:1px solid rgba(201,169,124,.34);
  box-shadow:0 14px 32px rgba(61,58,54,.14),0 0 0 .5px rgba(201,169,124,.16),var(--hi);
  transition:transform .18s ease;
}
.mat:active{transform:scale(.965)}
.art{
  position:relative;width:190px;height:285px;border-radius:13px;overflow:hidden;
  border:.5px solid rgba(201,169,124,.3);
}
.art::after{
  content:'';position:absolute;left:0;right:0;top:0;height:34%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,253,248,.30),rgba(255,253,248,0));
}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
/* 牌名 + 今日牌语 */
.card-name{
  position:relative;z-index:3;display:flex;align-items:baseline;justify-content:center;gap:9px;
  margin-top:7px;
}
.card-name .cn{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:3px;color:var(--ink)}
.card-name .dot{width:3px;height:3px;border-radius:50%;background:var(--gold)}
.card-name .en{font-family:var(--num);font-size:10px;letter-spacing:4px;color:var(--gold-deep)}
.card-phrase{
  position:relative;z-index:3;text-align:center;margin-top:6px;
  font-size:13.5px;letter-spacing:1px;color:var(--ink-soft);
}
/* 能量注脚：一行 · 细金 · 极淡背景条（非格子） */
.energy{
  position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:7px;
  margin:12px 14px 0;height:26px;border-radius:999px;
  background:rgba(201,169,124,.08);border:.5px solid rgba(201,169,124,.2);
}
.energy .eg-label{font-family:var(--sans);font-size:9.5px;color:var(--gold);letter-spacing:2px}
.energy .sep{width:3px;height:3px;border-radius:50%;background:rgba(201,169,124,.45);flex-shrink:0}
.energy .eg{font-family:var(--sans);font-size:9.5px;color:var(--ink-soft);letter-spacing:.5px;white-space:nowrap}
.energy .eg i{font-family:var(--num);font-style:normal;font-size:11px;color:var(--gold-deep);margin-left:2px}
/* 联动解读：牌 × 天象（主角的展开） */
.link{position:relative;z-index:3;margin-top:11px;text-align:center}
.link p{font-size:12.5px;letter-spacing:1px;line-height:1.6;color:var(--ink-soft)}
.link p:first-child{color:var(--ink)}
.link em{font-style:normal;color:var(--pink-ink)}
.link .x{font-family:var(--num);color:var(--gold-deep);font-size:13px;margin:0 2px}
/* 明日预告：细金一行 */
.tomorrow{position:relative;z-index:3;margin-top:9px}
.tline{width:132px;border-top:1px dashed rgba(201,169,124,.4);margin:0 auto}
.trow{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;
  font-family:var(--serif);font-size:10.5px;color:var(--gold);letter-spacing:2.5px;
}

/* ═══════════════ Tab 2 · 神谕 ── "你的底牌"是绝对主角 ═══════════════ */
.oracle-head{text-align:center;padding-top:34px}
.microlabel{font-family:var(--sans);font-weight:400;font-size:11px;color:rgba(201,169,124,.9);letter-spacing:4px;line-height:1.4}
.h-title{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:3px;color:var(--ink);margin-top:6px;line-height:1.3}
.h-sub{font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:2px;margin-top:4px}
.sec-kick{display:flex;align-items:center;gap:10px;margin-top:14px}
.sec-kick .t{font-family:var(--serif);font-size:12px;letter-spacing:3px;color:var(--gold-deep);white-space:nowrap}
.sec-kick .s{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px;white-space:nowrap}
.sec-kick .bar{flex:1;height:1px;background:rgba(201,169,124,.25)}
/* 三要素翻面卡（主角 · 水彩卡 3 张并排 · 点击 3D 翻面） */
.tri-row{display:flex;gap:9px;justify-content:center;margin-top:9px}
.tricard{width:80px;height:122px;perspective:900px;cursor:pointer;user-select:none}
.tri-inner{
  position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.3,.7,.3,1);
  transform-style:preserve-3d;
}
.tricard.flip .tri-inner{transform:rotateY(180deg)}
.tri-face{
  position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;border:1px solid rgba(201,169,124,.42);
  box-shadow:0 8px 18px rgba(61,58,54,.12),var(--hi);
}
.tri-front{background:var(--cream-hi)}
.tri-art{width:100%;height:92px}
.tri-art img{width:100%;height:100%;object-fit:cover;display:block}
.tri-tag{
  height:28px;display:flex;align-items:center;justify-content:center;gap:3px;
  background:linear-gradient(180deg,var(--cream-hi),#F6EFE2);
}
.tri-tag b{font-family:var(--serif);font-size:11.5px;font-weight:500;color:var(--ink);letter-spacing:.5px;white-space:nowrap}
.tri-tag i{font-family:var(--num);font-style:normal;font-size:9px;color:var(--gold-deep);line-height:1}
.tri-back{
  transform:rotateY(180deg);background:linear-gradient(165deg,#FFF9EC,#F3EAD8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 7px;text-align:center;
}
.tri-back .bk-sym{font-size:14px;color:var(--gold-deep);line-height:1}
.tri-back .bk-name{font-family:var(--serif);font-size:11px;color:var(--gold-deep);letter-spacing:1.5px;white-space:nowrap}
.tri-back p{font-family:var(--serif);font-size:11.5px;color:#6B5B48;line-height:1.6;letter-spacing:.5px}
.tri-back .bk-hint{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px}
.tri-hint{text-align:center;margin-top:7px;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:2px}
/* 认识完整的你 →（深度报告 · 付费点） */
.deeper{
  margin-top:10px;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:999px;cursor:pointer;background:linear-gradient(120deg,#F6E7C9,#EFD9AC);
  border:1px solid rgba(201,169,124,.55);box-shadow:var(--hi);
  transition:transform .15s ease;
}
.deeper:active{transform:scale(.97)}
.deeper .diamond{width:7px;height:7px;background:var(--gold-deep);transform:rotate(45deg);border-radius:1px;flex-shrink:0}
.deeper b{font-family:var(--serif);font-size:12.5px;font-weight:500;color:#6E5636;letter-spacing:2.5px;white-space:nowrap}
.deeper .chev{font-family:var(--num);font-size:17px;color:#8A6F4E;line-height:1;flex-shrink:0}
.deeper small{
  font-family:var(--sans);font-size:11px;color:#8A6F4E;letter-spacing:1px;white-space:nowrap;
  background:rgba(255,253,248,.8);border:1px solid rgba(201,169,124,.4);border-radius:999px;padding:2px 7px;
}
/* 注脚层：牌阵馆（小字入口卡 · 视觉明显弱于三要素主角） */
.sec-title{display:flex;align-items:baseline;gap:8px;margin-top:13px}
.sec-title .t{font-family:var(--serif);font-size:13px;letter-spacing:2.5px;color:var(--ink)}
.sec-title .s{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px}
.sec-title .bar{flex:1;height:1px;background:rgba(201,169,124,.25)}
.spread-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.spread-card{
  border-radius:12px;background:var(--paper);border:1px solid rgba(201,169,124,.22);
  padding:8px 10px 8px;cursor:pointer;transition:transform .15s ease;
}
.spread-card:active{transform:scale(.96)}
.spread-top{display:flex;align-items:center;gap:7px}
.spread-ic{
  width:24px;height:24px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:#F3EADA;border:1px solid rgba(201,169,124,.3);
}
.spread-name{font-family:var(--serif);font-size:12px;color:var(--ink);letter-spacing:1.5px}
.spread-sub{font-family:var(--sans);font-size:11px;color:var(--ink-faint);margin-top:3px;letter-spacing:.5px;line-height:1.4}
/* 百科入口 */
.ency{
  margin-top:8px;height:44px;border-radius:13px;background:var(--paper);
  border:1px solid rgba(201,169,124,.22);box-shadow:none;
  display:flex;align-items:center;gap:11px;padding:0 13px;cursor:pointer;
  transition:transform .15s ease;
}
.ency:active{transform:scale(.97)}
.ency-ic{width:30px;height:30px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#F3EADA;border:1px solid rgba(201,169,124,.3)}
.ency-txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.ency-txt b{font-family:var(--serif);font-size:12.5px;color:var(--ink);letter-spacing:2px;font-weight:500}
.ency-txt span{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ency .chev{font-family:var(--num);font-size:18px;color:var(--gold);flex-shrink:0}
.hint-line{margin-top:9px;text-align:center;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1px}

/* ═══════════════ Tab 3 · 我的 ── "你的星光记录"是绝对主角 ═══════════════ */
/* 用户卡（注脚级 · 顶部的身份） */
.ucard{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:18px;
  background:var(--cream-hi);border:1px solid var(--line);box-shadow:var(--shadow),var(--hi);cursor:pointer;
  transition:transform .15s ease;margin-top:46px;
}
.ucard:active{transform:scale(.97)}
.avatar{width:50px;height:50px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid rgba(201,169,124,.45);box-shadow:var(--shadow),var(--hi)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.u-name{font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:2px}
.u-sub{font-family:var(--sans);font-size:11px;color:var(--ink-faint);margin-top:3px;letter-spacing:1px}
.u-mem{
  margin-left:auto;flex-shrink:0;font-family:var(--sans);font-size:11px;letter-spacing:1px;
  color:#7A6238;background:linear-gradient(135deg,#F0E3C8,#E8D7B6);
  border:1px solid rgba(201,169,124,.5);border-radius:999px;padding:5px 10px;box-shadow:var(--hi);
}
.u-chev{font-family:var(--num);font-size:20px;color:var(--gold);margin-left:8px;flex-shrink:0}
/* 主角：星光记录卡（连续天数 + 牌运曲线 + 一句话） */
.star-card{
  position:relative;margin-top:10px;border-radius:20px;overflow:hidden;cursor:pointer;
  background:linear-gradient(165deg,var(--cream-hi),#F8F1E2);
  border:1px solid rgba(201,169,124,.45);
  box-shadow:0 12px 26px rgba(61,58,54,.11),var(--hi);
  padding:14px 15px 12px;transition:transform .15s ease;
}
.star-card:active{transform:scale(.975)}
.star-card::before{
  content:'';position:absolute;top:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,169,124,.65),transparent);
}
.star-glow{
  position:absolute;right:-34px;top:-44px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(201,169,124,.26),transparent 72%);pointer-events:none;
}
.star-top{position:relative;display:flex;align-items:flex-end;gap:8px}
.star-num{font-family:var(--num);font-size:47px;line-height:.9;color:var(--gold-deep);letter-spacing:1px}
.star-unit{font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:1.5px;margin-bottom:6px;white-space:nowrap}
.star-txt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.star-txt b{font-family:var(--serif);font-size:14.5px;font-weight:500;color:var(--ink);letter-spacing:3px;white-space:nowrap}
.star-txt span{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star-chart{position:relative;margin-top:9px;height:52px}
.star-chart svg{width:100%;height:38px;display:block}
.star-chart span{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:2px;margin-top:3px;text-align:center}
.star-line{
  position:relative;margin-top:7px;text-align:center;font-family:var(--serif);
  font-size:12px;letter-spacing:1px;color:var(--ink-soft);
}
.star-line em{font-style:normal;color:var(--pink-ink)}
/* 注脚层：日记 */
.diary{
  margin-top:10px;border-radius:16px;background:var(--cream-hi);
  border:1px solid var(--line);box-shadow:var(--shadow),var(--hi);
  padding:4px 0 5px;
}
.diary-head{display:flex;align-items:baseline;gap:8px;padding:7px 13px 3px}
.diary-head .t{font-family:var(--serif);font-size:13px;letter-spacing:2.5px;color:var(--ink)}
.diary-head .s{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1.5px}
.diary-head .bar{flex:1;height:1px;background:rgba(201,169,124,.25)}
.d-row{
  display:flex;align-items:center;gap:9px;height:48px;padding:0 13px;cursor:pointer;
  transition:transform .12s ease,background .15s ease;
}
.d-row:active{transform:scale(.98);background:rgba(232,196,190,.1)}
.d-ic{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);overflow:hidden;
}
.d-ic img{width:100%;height:100%;object-fit:cover;display:block}
.d-txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.d-txt b{font-family:var(--serif);font-size:13px;color:var(--ink);letter-spacing:1.5px;font-weight:500}
.d-txt span{font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-tag{
  flex-shrink:0;font-family:var(--sans);font-size:11px;letter-spacing:1px;border-radius:999px;padding:3px 10px;
}
.d-tag.wish{background:rgba(216,210,228,.32);color:#6E6676;border:1px solid rgba(216,210,228,.6)}
.d-tag.review{background:rgba(201,169,124,.18);color:#8A6F4E;border:1px solid rgba(201,169,124,.4)}
.d-tag.book{background:rgba(232,196,190,.22);color:#8A6A62;border:1px solid rgba(232,196,190,.55)}
/* 注脚层：功能四格 */
.func-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.func-tile{
  height:60px;border-radius:14px;background:var(--cream-hi);border:1px solid var(--line);
  box-shadow:var(--hi);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;transition:transform .15s ease;
}
.func-tile:active{transform:scale(.94)}
.func-tile span{font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:1px}

@media(prefers-reduced-motion:reduce){
  .float,.halo,.sp,.mount,.toast,.tri-inner{animation:none!important;transition:none!important}
}
</style>
</head>

const ASSETS = { moon: MOON, pentacle: PENTACLE, starback: STARBACK, flower: FLOWER };

function Art({src, alt, className='', style, ph='插画'}) {
  const [err, setErr] = useState(false);
  if (err) {
    return <div style={{...style, display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(160deg,#F4EDE0,#EFE6D8)',border:'1px dashed rgba(201,169,124,.5)',borderRadius:12,fontFamily:"'Noto Sans SC',sans-serif",fontSize:11,color:'#B0AA9C',letterSpacing:2}}><span>{alt || ph}</span></div>;
  }
  return <img src={src} alt={alt||ph} className={className} style={style}
    loading="lazy" onError={()=>setErr(true)} draggable="false"/>;
}

/* ── Toast ── */
const DEMO_MODE = !!location.hash.match(/^#d/);
function useToast(initial=''){
  const [toast,setToast]=useState(initial);
  const show=(t)=>{setToast(t);setTimeout(()=>setToast(''),DEMO_MODE?15000:1900);};
  return [toast,show];
}

    {l:'02 · 神谕', d:'你的底牌是主角 · 牌阵/百科是入口注脚',          el:<Phone key="p2" initTab="oracle" uid={2}/>},
    {l:'03 · 我的', d:'星光记录是主角 · 日记/功能是入口',              el:<Phone key="p3" initTab="mine"   uid={3}/>},
  ];
  return (
    <div className="stage">
      <h1>星 光 映 照</h1>
      <div className="sub">3 Tab v2 · 塔罗 × 星座融合 · 每屏只有一个主角</div>
      <div className="meta">今日=牌是主角（已认可方案A）· 神谕=你的底牌是主角（星盘三要素）· 我的=星光记录是主角 · 其余皆为注脚/入口</div>
      <div className="grid">
        {zones.map(z=>
          <div key={z.l} className="zone">
            <div className="zoom">{z.el}</div>
            <div className="cap">{z.l}</div>
            <div className="cap-sub">{z.d}</div>
          </div>)}
      </div>
    </div>
  );
}

/* ── 自检：每屏内容高度 + 插画加载 + 字体 ── */
function App(){
  /* #1/#2/#3 → 单屏展示；#d1/#d2/#d2a/#d3 → 单屏 + 初始即交互态（确定性，无定时器） */
  const hm=(location.hash||'').match(/^#d(2a|[123])$/);
  const demoMode=hm&&hm[1];
  const solo=demoMode?(demoMode==='2a'?2:parseInt(demoMode,10)):((location.hash||'').match(/^#([123])$/)?parseInt(location.hash.slice(1),10):0);

  useEffect(()=>{
    const audit=()=>{
      const res=[];
      document.querySelectorAll('[data-screen-label]').forEach(el=>{
        const sr=el.getBoundingClientRect();
        let maxB=0,worst=null,ov=[];
        el.querySelectorAll('*').forEach(n=>{
          const st=getComputedStyle(n);
          if(st.position==='static'||st.position==='relative'){
            const r=n.getBoundingClientRect();
            if(r.bottom-sr.top>maxB){maxB=r.bottom-sr.top;worst=n;}
            if(r.bottom-sr.top>el.clientHeight+4&&ov.length<6)ov.push(n.tagName+'.'+String(n.getAttribute('class')||'').slice(0,24)+'@'+Math.round(r.bottom-sr.top));
          }
        });
        res.push(el.getAttribute('data-screen-label')+':flowB='+Math.round(maxB)+'/'+el.clientHeight+' worst<'+(worst?worst.tagName+'.'+String(worst.getAttribute('class')||'').slice(0,24):'none')+'> ov['+ov.join(' ')+']');
      });
      const imgs=[...document.querySelectorAll('img')];
      const imgInfo=imgs.map(i=>{
        const ok=i.complete?(i.naturalWidth>0?'OK':'X'):'...';
        return (i.getAttribute('src')||'').split('/').pop().slice(0,10)+':'+ok;
      }).join(',');
      const box=document.getElementById('check-result');
      if(box)box.textContent='CHECK|'+res.join('|')+'|imgs('+imgInfo+')|fontSerif:'+document.fonts.check('16px "Noto Serif SC"')+'|fontNum:'+document.fonts.check('16px "EB Garamond"');
    };
    const t=setTimeout(audit,900);
    const t2=setTimeout(audit,3000);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(audit,600));
    return ()=>{clearTimeout(t);clearTimeout(t2);};
  },[]);

  if(solo>=1&&solo<=3){
    const keys=['today','oracle','mine'];
    return (
      <div>
        <div id="check-result" style={{display:'none'}}/>
        {/* 固定尺寸舞台 + CSS 2x 放大（无设备缩放因子，规避无头浏览器截图竞态） */}
        <div style={{width:700,height:1450,position:'relative',background:'#29231E',margin:'0 auto'}}>
          <div style={{position:'absolute',left:50,top:85,transform:'scale(2)',transformOrigin:'top left'}}>
            <Phone key={'solo'+solo} initTab={keys[solo-1]} uid={solo} demo={demoMode}/>
          </div>
        </div>
      </div>
    );
  }
  /* #stage2 → 画布 2x 放大（无头截图用，规避设备缩放因子竞态） */
  const zoomStage = (location.hash||'') === '#stage2';
  return (
    <div>
      <div id="check-result" style={{display:'none'}}/>
      {zoomStage
        ? <div style={{width:2400,height:1950,position:'relative',background:'#29231E',margin:'0 auto'}}>
            <div style={{position:'absolute',left:0,top:0,transform:'scale(2)',transformOrigin:'top left'}}><Stage/></div>
          </div>
        : <Stage/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
