<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光映照 · E3 奶油疗愈版 · 真实水彩插画</title>
<meta name="description" content="星光映照塔罗小程序 — 方向E3 · 真实水彩插画：AI 生成的奶油疗愈水彩资产 · 彻底告别代码插画 · 六屏完整流程">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   星光映照 · 方向E3 · 奶油疗愈版（真实水彩插画）
   奶油米白 #FAF6EF / 单一主色 雾粉 #E8C4BE / 细金线 #C9A97C
   插画资产：assets/web/*.jpg（AI 水彩生成，真实质感）
   每屏以真实插画为视觉主体，代码只做排版与氛围，不再画插画
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#29231E;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#EFE4D6}
#root{min-height:100%}
::selection{background:rgba(232,196,190,.45)}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
img{-webkit-user-drag:none;user-select:none}

/* ── 画布 ── */
.stage{max-width:1600px;margin:0 auto;padding:44px 24px 88px}
.stage h1{font-family:'Noto Serif SC',serif;font-weight:500;font-size:30px;text-align:center;letter-spacing:14px;color:#F0E2D0;margin-bottom:10px}
.stage .sub{text-align:center;font-size:11px;color:rgba(201,169,124,.85);letter-spacing:4px;margin-bottom:6px}
.stage .meta{text-align:center;font-size:11.5px;color:rgba(239,228,214,.35);letter-spacing:1px;margin-bottom:40px}
.grid{display:flex;flex-wrap:wrap;gap:46px 30px;justify-content:center;align-items:flex-start}
.zone{display:flex;flex-direction:column;align-items:center}
.zoom{transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.zoom:hover{transform:scale(1.03)}
.cap{margin-top:14px;font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:3px;color:rgba(240,226,208,.85)}
.cap-sub{margin-top:4px;font-size:11px;letter-spacing:1px;color:rgba(240,226,208,.38)}
@media(max-width:720px){.grid{flex-direction:column;align-items:center}}

/* ═══════════════════ E3 · 奶油疗愈 · 真实水彩插画 ═══════════════════ */
.sys-e3{
  --cream:#FAF6EF; --cream-hi:#FFFDF8; --paper:#F2ECDF;
  --pink:#E8C4BE; --pink-deep:#DCA9A1; --pink-ink:#B08A82;
  --gold:#C9A97C; --gold-deep:#B08F52;
  --line:rgba(201,169,124,.28); --line-soft:rgba(201,169,124,.38);
  --lav:#D8D2E4;
  --ink:#3D3A36; --ink-soft:#8A8478; --ink-faint:#B0AA9C;
  --serif:'Noto Serif SC',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --hand:'Ma Shan Zheng','Noto Serif SC',cursive;
  --num:'EB Garamond','Noto Serif SC',serif;
  --shadow:0 2px 10px rgba(61,58,54,.06);
  --hi:inset 0 1px 0 rgba(255,255,255,.6);
  --cardline:0 0 0 1px rgba(201,169,124,.32),0 10px 26px rgba(61,58,54,.14),var(--hi);
}
.sys-e3 .screen{
  background:var(--cream);color:var(--ink);position:relative;overflow:hidden;
  font-family:var(--serif);
}
/* 低饱和水彩底色氛围（仅为底色，插画全部来自真实资产） */
.sys-e3 .wash{position:absolute;border-radius:50%;pointer-events:none;filter:blur(38px);z-index:0}
/* 微信胶囊（奶油浅底 -> 白色胶囊深色icon） */
.wxcapsule{
  position:absolute;top:13px;right:8px;z-index:30;display:flex;gap:4px;pointer-events:none;
}
.wxcapsule .cap{
  width:40px;height:32px;border-radius:7px;
  background:rgba(255,253,248,.92);border:0.5px solid rgba(201,169,124,.3);
  box-shadow:0 2px 6px rgba(61,58,54,.05);
  display:flex;align-items:center;justify-content:center;
}
.wxcapsule .cap svg{fill:#3D3A36}
.wxcapsule .cap:first-child{flex-direction:column;gap:3px}
.wxcapsule .cap:first-child span{display:block;width:3px;height:3px;border-radius:50%;background:#3D3A36}
.wxcapsule .cap .circle{width:15px;height:15px;border-radius:50%;border:1.5px solid #3D3A36}

/* ── 返回 ── */
.backbtn{
  position:absolute;left:16px;top:56px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,253,248,.92);border:1px solid var(--line-soft);
  box-shadow:var(--shadow),var(--hi);
  display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer;
  transition:transform .15s ease;
}
.backbtn:active{transform:scale(.93)}

/* ── 通用文字（衬线为主 · 手写体仅引言） ── */
.pad{position:relative;z-index:2}
.microlabel{font-family:var(--sans);font-weight:400;font-size:11px;color:rgba(201,169,124,.9);letter-spacing:4px}
.brand{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--ink);letter-spacing:7px;margin-top:4px}
.gold-dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--gold);flex-shrink:0}
.date-row{display:flex;align-items:center;gap:7px;font-family:var(--num);font-size:12px;color:var(--ink-soft);letter-spacing:1.5px;margin-top:8px}
.quote{font-family:var(--hand);font-size:22px;color:var(--ink);margin-top:8px;transform:rotate(-1deg);letter-spacing:1px;line-height:1.5}
.quote-sub{font-family:var(--sans);font-size:11px;color:var(--ink-soft);margin-top:5px;letter-spacing:3px}
.h-title{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:3px;color:var(--ink)}
.h-sub{font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:3px}
.pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 12px;border-radius:999px;
  background:var(--cream-hi);border:1px solid rgba(201,169,124,.4);color:#8A8478;
  font-family:var(--sans);font-size:11px;letter-spacing:2.5px;
}
.pill-lav{background:var(--lav);border-color:rgba(201,169,124,.28);color:#6E6676}
.hint-line{margin-top:6px;text-align:center;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:1px}
.divider{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0}
.divider i{width:28px;height:1px;background:rgba(201,169,124,.35)}
.divider b{width:3px;height:3px;border-radius:50%;background:rgba(201,169,124,.55)}
.num{font-family:var(--num);font-style:normal}

/* ── 真实插画卡片通用（圆角裁剪 · 细金描边 · 顶部高光） ── */
.art{
  position:relative;overflow:hidden;border-radius:16px;
  border:1px solid var(--line);
  box-shadow:var(--cardline);
  background:var(--cream-hi);
}
.art::after{ /* 顶部高光 */
  content:'';position:absolute;inset:0 0 auto 0;height:38%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,253,248,.32),rgba(255,253,248,0));
  border-radius:16px 16px 0 0;
}
.art img{width:100%;height:100%;object-fit:cover;display:block}
/* 图片加载失败的优雅占位 */
.art-ph{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#F4EDE0,#EFE6D8);
  border:1px dashed rgba(201,169,124,.5);border-radius:inherit;
  font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:2px;text-align:center;padding:10px;
}
.ph-bleed{border-radius:0;border:none}

/* ── 按钮（哑光雾粉实心 / 细金描边） ── */
.btn{
  height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-family:var(--serif);font-weight:500;font-size:14px;letter-spacing:3px;
  transition:transform .15s ease,box-shadow .15s ease,opacity .2s ease;user-select:none;
}
.btn:active{transform:scale(.965)}
.btn-primary{
  background:var(--pink);color:#5C4A3A;
  box-shadow:var(--shadow),var(--hi);
}
.btn-ghost{background:var(--cream-hi);border:1.5px solid rgba(201,169,124,.55);color:#7A705F;box-shadow:var(--hi)}
.btn-off{opacity:.4;pointer-events:none}
.w108{width:108px;flex-shrink:0}
.flex1{flex:1}

/* ── TabBar（极淡奶油玻璃 · 细金分隔） ── */
.tabbar{
  position:relative;z-index:5;margin:8px 14px 0;height:52px;border-radius:20px;
  display:flex;align-items:center;justify-content:space-around;
  background:rgba(255,253,248,.6);border:1px solid rgba(201,169,124,.22);
  box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;font-family:var(--sans);font-size:11px;color:var(--ink-faint);letter-spacing:2px;cursor:pointer}
.tab.on{color:var(--ink);font-weight:500}
.tab .tdot{width:3.5px;height:3.5px;border-radius:50%;background:transparent}
.tab.on .tdot{background:var(--gold)}

/* ── 今日 · 真实月亮水彩牌 ── */
.paint-wrap{position:relative;margin:10px auto 0;width:205px;z-index:3}
.painting{
  width:205px;height:308px;border-radius:16px;overflow:hidden;cursor:pointer;
  animation:floaty 5.5s ease-in-out infinite;
}
.painting img{object-position:55% 50%}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.phrase{font-family:var(--serif);font-size:15px;color:var(--ink);text-align:center;margin-top:8px;letter-spacing:2px}
.pill-wrap{display:flex;justify-content:center;margin-top:10px}
/* 留白区小花（真实资产 · 从卡片后探出） */
.hint-flower{
  position:absolute;right:2px;bottom:56px;width:126px;height:116px;z-index:1;pointer-events:none;
  opacity:.5;transform:scaleX(-1) rotate(-7deg);
}
.hint-flower img{width:100%;height:100%;object-fit:cover;display:block;border-radius:12px}

/* ── 洗牌 ── */
.grid3{display:grid;grid-template-columns:repeat(3,93px);gap:7px;justify-content:center;margin-top:12px}
.s-rot{transition:transform .25s ease}
.s-card{
  width:93px;height:140px;border-radius:14px;position:relative;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);box-shadow:var(--shadow),var(--hi);
  transition:transform .22s ease,box-shadow .22s ease;
}
.s-card:hover{transform:translateY(-4px)}
.s-card.sel{
  transform:translateY(-9px) scale(1.04);
  box-shadow:0 10px 20px rgba(61,58,54,.1),0 0 0 2px rgba(255,253,248,.95),0 0 0 4px rgba(201,169,124,.5);
}
/* 牌背四角的奶油白淡框，增加层次 */
.s-card .frame{
  position:absolute;inset:5px;border:1px solid rgba(255,253,248,.85);border-radius:10px;
  pointer-events:none;z-index:2;
}
.s-card .cardimg{width:100%;height:100%;object-fit:cover;display:block}
.counter{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
.cdots{display:flex;gap:6px}
.cdots i{width:8px;height:8px;border-radius:50%;background:rgba(201,169,124,.25);transition:background .2s ease,transform .2s ease}
.cdots i.on{background:var(--gold);transform:scale(1.12)}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(201,169,124,.25);transition:background .2s ease,transform .2s ease}
.cdot.on{background:var(--gold);transform:scale(1.12)}
.cnum{font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:2px}

/* ── 读牌中 · 真实双图翻牌（scaleX 双半程 · 无 preserve-3d） ── */
.reading-head{position:relative;z-index:6;text-align:center;padding-top:86px}
.reading-head .quote{display:inline-block;font-size:21px;transform:rotate(-1deg)}
.reading-head .quote-sub{display:block;margin-top:6px}
.flip-row{position:relative;z-index:6;display:flex;justify-content:center;margin-top:30px}
.flip-card{width:150px;height:225px;position:relative}
.flip-inner{position:absolute;inset:0;animation:flipscale 4.2s ease-in-out infinite}
@keyframes flipscale{
  0%{transform:scaleX(1)}47%{transform:scaleX(.03)}50%{transform:scaleX(.03)}97%{transform:scaleX(1)}100%{transform:scaleX(1)}
}
.flip-face{
  position:absolute;inset:0;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--cardline);
}
.flip-front{opacity:0;animation:faceswap 4.2s steps(1,end) infinite;z-index:1}
@keyframes faceswap{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
.flip-face img{width:100%;height:100%;object-fit:cover;display:block}
.fallstar{position:absolute;z-index:5;pointer-events:none;animation:fall var(--dur,3.6s) linear var(--del,0s) infinite}
@keyframes fall{0%{transform:translateY(-16px) rotate(0);opacity:0}12%{opacity:.7}100%{transform:translateY(620px) rotate(220deg);opacity:0}}
.progress{position:relative;z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:30px}
.p-track{width:150px;height:4px;border-radius:99px;background:rgba(201,169,124,.2);overflow:hidden}
.p-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#E8C4BE,#C9A97C);transform-origin:left;animation:fillmove 3.9s linear infinite}
@keyframes fillmove{0%{transform:scaleX(0)}55%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.p-dots{display:flex;gap:7px}
.p-dots i{width:6px;height:6px;border-radius:50%;background:rgba(201,169,124,.28);animation:pd 3.9s ease infinite}
.p-dots i:nth-child(2){animation-delay:.5s}
.p-dots i:nth-child(3){animation-delay:1s}
@keyframes pd{0%,100%{transform:scale(1);background:rgba(201,169,124,.28)}30%{transform:scale(1.28);background:#C9A97C}}

/* ── 解读 ── */
.rv-head{text-align:center;padding-top:36px}
.rv-title{font-family:var(--serif);font-weight:500;font-size:28px;color:var(--ink);margin-top:4px;letter-spacing:4px}
.rv-sub{font-family:var(--sans);font-size:11px;color:var(--ink-soft);margin-top:2px;letter-spacing:3px}
.rv-art{width:172px;height:258px;margin:8px auto 0;transform:rotate(1.3deg)}
.rv-art img{object-position:50% 30%}
.rv-text{position:relative;z-index:3;margin-top:8px;padding:0 24px;font-size:15px;line-height:1.9;color:var(--ink);text-align:center}
.rv-text em{font-style:normal;color:var(--pink-ink)}
.chips{display:flex;justify-content:center;gap:7px;margin-top:10px}
.chip{
  min-width:78px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:12px;letter-spacing:2px;cursor:pointer;border:1px solid;
  background:var(--cream-hi);color:#8A8478;transition:all .2s ease;
}
.chip.on{font-weight:500;background:var(--pink);border-color:rgba(201,169,124,.55);color:#5C4A3A}
.chip-line{text-align:center;font-family:var(--serif);font-size:13px;color:#7A725F;margin-top:8px;letter-spacing:1px}
.btns{display:flex;gap:10px;margin-top:10px;padding:0 22px}

/* ── 星光树洞 · 聊天 ── */
.chat-head{position:relative;z-index:6;text-align:center;padding-top:58px}
.chat-title{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--ink);letter-spacing:5px}
.chat-sub{display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--sans);font-size:11px;color:var(--ink-soft);margin-top:4px;letter-spacing:1.5px}
.online-dot{width:5px;height:5px;border-radius:50%;background:#9FB89A;box-shadow:0 0 5px rgba(159,184,154,.7)}
.chat-body{position:absolute;left:0;right:0;top:112px;bottom:84px;padding:4px 16px 0;overflow:hidden;display:flex;flex-direction:column;gap:12px;z-index:3}
.chat-date{text-align:center;font-family:var(--num);font-size:11px;color:var(--ink-faint);letter-spacing:2.5px;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
/* AI 头像：真实月亮水彩插画裁成圆形小头像 */
.avatar{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;overflow:hidden;
  border:1px solid rgba(201,169,124,.45);
  box-shadow:var(--shadow),var(--hi);
  background:var(--cream-hi);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.bub-ai{
  max-width:78%;background:var(--cream-hi);border:1px solid rgba(201,169,124,.22);
  border-radius:14px 14px 14px 4px;padding:11px 14px;font-size:13px;line-height:1.8;color:var(--ink);
  box-shadow:var(--shadow);
}
.bub-me{
  max-width:78%;background:var(--pink);border:1px solid rgba(201,169,124,.3);
  border-radius:14px 14px 4px 14px;padding:11px 14px;font-size:13px;line-height:1.8;color:#5C4A3A;
  box-shadow:var(--shadow);
}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#DCA9A1;animation:tb 1.1s ease infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.chat-input{
  position:absolute;left:16px;right:16px;bottom:16px;height:48px;z-index:8;
  border-radius:999px;background:var(--cream-hi);border:1px solid rgba(201,169,124,.35);
  box-shadow:var(--shadow),var(--hi);
  display:flex;align-items:center;padding:0 4px 0 18px;gap:8px;
}
.chat-input input{flex:1;border:none;outline:none;background:transparent;font-family:var(--serif);font-size:13px;color:var(--ink);height:44px;min-width:0}
.chat-input input::placeholder{color:var(--ink-faint)}
.sendbtn{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:var(--pink);box-shadow:var(--hi);
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
}
.sendbtn:active{transform:scale(.9)}

/* ── 分享海报 · 整屏即海报（真实奶油金月明信片底） ── */
.poster-bleed{position:absolute;inset:0;z-index:0}
.poster-bleed img{width:100%;height:100%;object-fit:cover;display:block}
.poster-scrim{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(250,246,239,.52) 0%,rgba(250,246,239,.18) 22%,rgba(250,246,239,.12) 55%,rgba(250,246,239,.58) 100%);
}
.stroke{ -webkit-text-stroke:1px rgba(255,253,248,.92);text-shadow:0 1px 5px rgba(61,58,54,.12); }
.p-pad{position:absolute;inset:0;z-index:2;padding:20px 18px 112px;display:flex;flex-direction:column;pointer-events:none}
.p-brand{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.p-logo{font-family:var(--serif);font-weight:500;font-size:15px;color:#8A6F4E;letter-spacing:4px;mix-blend-mode:multiply}
.p-en{font-family:var(--num);font-size:10px;color:rgba(138,111,78,.9);letter-spacing:2.5px;mix-blend-mode:multiply}
.p-main{margin-top:auto;margin-bottom:auto;text-align:center}
.p-date{font-family:var(--num);font-size:13px;color:var(--ink-soft);letter-spacing:2.5px}
.p-line{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--ink);margin-top:10px;letter-spacing:2px;line-height:1.5}
.p-nick{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-family:var(--sans);font-size:12px;color:var(--ink-soft);letter-spacing:1.5px}
.p-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding:0 2px}
.p-name{font-family:var(--serif);font-weight:500;font-size:13px;color:#6B5B48;letter-spacing:2px;display:flex;flex-direction:column;gap:2px}
.p-name small{font-family:var(--sans);font-weight:400;font-size:10px;color:var(--ink-faint);letter-spacing:1.5px}
.qr{width:52px;height:52px;border-radius:8px;background:#FFF;border:1px solid rgba(201,169,124,.35);flex-shrink:0;padding:3px;box-shadow:0 2px 8px rgba(61,58,54,.08)}
.poster-bar{position:relative;z-index:3;margin:12px 14px 0;border-radius:20px;background:rgba(255,253,248,.72);border:1px solid rgba(201,169,124,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);padding:12px 12px 10px}
.poster-btns{display:flex;gap:10px}
.poster-bar .hint-line{margin-top:10px}

/* ── Toast ── */
.toast{
  position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;
  background:rgba(61,58,54,.94);color:#FFF8EE;font-family:var(--sans);font-size:12px;letter-spacing:1px;
  padding:10px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(61,58,54,.3);
  animation:toastin 1.9s ease forwards;pointer-events:none;white-space:nowrap;
}
@keyframes toastin{0%{opacity:0;transform:translateX(-50%) translateY(10px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}

/* ── 抽牌星光粒子 ── */
.spark{position:absolute;z-index:25;pointer-events:none;animation:burst .75s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(170deg);opacity:0}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z=="></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1=="></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj"></script>
<script type="text/babel" data-presets="env,react">
const {useState,useEffect,useRef} = React;

/* ═══════════════════════════════════════════════════════════
   星光映照 · E3 奶油疗愈版（真实水彩插画资产）
   插画：assets/web/*.jpg —— 真实 AI 水彩生成，代码不再画插画
   ═══════════════════════════════════════════════════════════ */

/* ── 微信胶囊 ── */
function WxCapsule(){
  return (
    <div className="wxcapsule">
      <div className="cap"><span/><span/><span/></div>
      <div className="cap"><div className="circle"/></div>
    </div>
  );
}

/* ── 通用图标（仅 UI 图标，非插画） ── */
const Icon = ({name,color,size=20}) => {
  const c = color||'currentColor';
  const paths = {
    home:<><path d="M3 11.2 10 5l7 6.2" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M5.5 10.5V17h9v-6.5" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></>,
    book:<><path d="M4 4.5h7.5V17H4z" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round"/><path d="M11.5 5h5V17h-5" fill="none" stroke={c} strokeWidth="1.6" strokeLinejoin="round"/></>,
    user:<><circle cx="10" cy="7.5" r="3.2" fill="none" stroke={c} strokeWidth="1.6"/><path d="M4.5 17c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round"/></>,
    about:<><circle cx="10" cy="10" r="7" fill="none" stroke={c} strokeWidth="1.6"/><path d="M10 8.5v.2M10 11.5v2.6" stroke={c} strokeWidth="1.6" strokeLinecap="round"/></>,
  };
  return <svg width={size} height={size} viewBox="0 0 20 20">{paths[name]}</svg>;
};

const TABS = [
  {key:'home', name:'映照', ic:'home'},
  {key:'book', name:'百科', ic:'book'},
  {key:'user', name:'我的', ic:'user'},
  {key:'about', name:'关于', ic:'about'},
];

/* ═══════════════════════════════════════════════════════════
   真实插画资产（assets/web/*.jpg）
   加载失败时优雅降级为奶油底占位（背景色+文字）
   ═══════════════════════════════════════════════════════════ */
const ASSETS = {
  moon:   'assets/web/moon-card.jpg',      // 月亮+安睡兔子水彩
  pentacle:'assets/web/pentacle-card.jpg', // 星币王牌水彩
  back:   'assets/web/card-back.jpg',      // 金线月星纹牌背
  flower: 'assets/web/hint-flower.jpg',    // 淡粉水彩小花
  poster: 'assets/web/poster-bg.jpg',      // 奶油底+金月+粉花明信片
};

function Art({src, alt, className='', style, lazy=true, ph='插画'}) {
  const [err, setErr] = useState(false);
  if (err) {
    return (
      <div className={'art-ph '+(className.includes('bleed')?'ph-bleed':'')} style={style}>
        <span>{alt || ph}</span>
      </div>
    );
  }
  return <img src={src} alt={alt||ph} className={className} style={style}
    loading={lazy?'lazy':undefined} onError={()=>setErr(true)} draggable="false"/>;
}

/* 四芒星光（氛围粒子，非插画） */
const STAR_PATH='M0,-7 C1.2,-3 3,-1.2 7,0 C3,1.2 1.2,3 0,7 C-1.2,3 -3,1.2 -7,0 C-3,-1.2 -1.2,-3 0,-7 Z';
const Spark=({x=0,y=0,s=1,fill='#D8C4A0',op=0.7,r=0,style})=>(
  <svg width={10*s} height={10*s} viewBox="-8 -8 16 16" style={style}>
    <path d={STAR_PATH} transform={`scale(${s}) rotate(${r})`} fill={fill} opacity={op}/>
  </svg>
);

/* 海报 · 小程序码示意（UI 组件） */
function QRMock(){
  const cells=[[2,2],[3,2],[4,2],[2,3],[4,3],[2,4],[3,4],[4,4],[5,4],[2,5],[4,5],[3,6],[4,6],[6,2],[6,3],[6,4]];
  return (
    <svg viewBox="0 0 54 54" className="qr">
      <rect width="54" height="54" rx="8" fill="#FFF"/>
      <rect x="5" y="5" width="12" height="12" rx="3" fill="#3D3A36"/><rect x="8" y="8" width="6" height="6" rx="1.5" fill="#FFF"/>
      <rect x="37" y="5" width="12" height="12" rx="3" fill="#3D3A36"/><rect x="40" y="8" width="6" height="6" rx="1.5" fill="#FFF"/>
      <rect x="5" y="37" width="12" height="12" rx="3" fill="#3D3A36"/><rect x="8" y="40" width="6" height="6" rx="1.5" fill="#FFF"/>
      {cells.map((c,i)=><rect key={i} x={6+c[0]*6} y={6+c[1]*6} width="3" height="3" rx="1" fill="#3D3A36" opacity=".9"/>)}
    </svg>
  );
}

function BackArrow({onClick}){
  return (
    <div className="backbtn" onClick={onClick}>
      <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="#8A8478" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   === 01 · 今日 === 真实月亮水彩牌 + 淡粉小花点缀
   ═══════════════════════════════════════════════════════════ */
function ScreenToday(){
  const [toast,setToast]=useState('');
  const show=(t)=>{setToast(t);setTimeout(()=>setToast(''),1900);};
  return (
    <div className="sys-e3">
      <div className="screen" style={{width:300,height:640,borderRadius:34,boxShadow:'0 30px 60px rgba(0,0,0,.55)'}} data-screen-label="s1-today">
        <WxCapsule/>
        <div className="wash" style={{width:210,height:210,right:-70,top:-50,background:'#E8C4BE',opacity:.32}}/>
        <div className="wash" style={{width:190,height:190,left:-80,top:330,background:'#C9A97C',opacity:.18}}/>
        {/* 留白区小花 · 从卡片后探出（真实水彩小花，50% 透明度） */}
        <div className="hint-flower">
          <Art src={ASSETS.flower} alt="淡粉水彩小花" lazy={false} ph="小花"/>
        </div>
        <div className="pad" style={{padding:'44px 20px 0'}}>
          <div className="microlabel">STARLIT · 每日一牌</div>
          <div className="brand">星光映照</div>
          <div className="date-row"><span className="gold-dot"/><span>AUG 7 · FRIDAY · 2026</span></div>
          <div className="quote">今夜，月光替你问一卦</div>
          {/* 真实月亮水彩大牌面：600×600 原图 cover 裁 2:3 竖卡 */}
          <div className="paint-wrap">
            <div className="painting art" onClick={()=>show('月亮牌：允许情绪自然流动，今晚不评判自己')}>
              <Art src={ASSETS.moon} alt="月亮与安睡兔子的水彩插画" lazy={false}/>
            </div>
            <Spark s={0.5} fill="#C9A97C" op={0.5} style={{position:'absolute',right:16,top:12,zIndex:3}}/>
          </div>
          <div className="phrase">月亮牌 · 今晚允许自己慢下来</div>
          <div className="btn btn-primary" style={{marginTop:10}} onClick={()=>show('牌面已翻开 · 月光正为你落笔')}>翻开今日牌面</div>
        </div>
        <div className="tabbar">
          {TABS.map(t=>
            <div key={t.key} className={"tab"+(t.key==='home'?' on':'')}>
              <Icon name={t.ic} color={t.key==='home'?'#8A6F4E':'#B0AA9C'} size={20}/>
              <span>{t.name}</span>
              <span className="tdot"/>
            </div>)}
        </div>
        {toast&&<div className="toast">{toast}</div>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   === 02 · 洗牌 === 真实金线月星纹牌背 3×3 · 奶油白淡框
   ═══════════════════════════════════════════════════════════ */
const BACKS=[
  {r:-2},{r:1.5},{r:-1},
  {r:2},{r:-1.5},{r:1},
  {r:-2},{r:1.5},{r:-1},
];
function ScreenShuffle(){
  const [sel,setSel]=useState([]);
  const [sparks,setSparks]=useState([]);
  const [toast,setToast]=useState('');
  const ref=useRef(null);
  const show=(t)=>{setToast(t);setTimeout(()=>setToast(''),1900);};
  const toggle=(i)=>{
    if(sel.includes(i)){setSel(sel.filter(x=>x!==i));return;}
    if(sel.length>=3){show('三张已齐，相信直觉就好');return;}
    const card=ref.current&&ref.current.querySelector(`[data-i="${i}"] .s-card`);
    const screen=ref.current;
    if(card&&screen){
      const a=card.getBoundingClientRect(),b=screen.getBoundingClientRect();
      const cx=a.left-b.left+a.width/2, cy=a.top-b.top+a.height/2;
      const id=Date.now();
      setSparks(prev=>[...prev,...Array.from({length:6},(_,k)=>({
        id:id+k,x:cx,y:cy,
        dx:(k%3-1)*30+(k*7%9-4)*6,
        dy:-14-k*9,
        del:k*0.03,
      }))]);
      setTimeout(()=>setSparks(prev=>prev.filter(p=>p.id<id)),800);
    }
    setSel([...sel,i]);
  };
  return (
    <div className="sys-e3">
      <div className="screen" style={{width:300,height:640,borderRadius:34,boxShadow:'0 30px 60px rgba(0,0,0,.55)'}} data-screen-label="s2-shuffle" ref={ref}>
        <WxCapsule/>
        <BackArrow onClick={()=>show('先别走，月亮在等你')}/>
        <div className="wash" style={{width:190,height:190,right:-70,top:-30,background:'#E8C4BE',opacity:.28}}/>
        <div className="wash" style={{width:170,height:170,left:-60,top:430,background:'#C9A97C',opacity:.16}}/>
        <div className="pad" style={{padding:'42px 20px 0'}}>
          <div className="h-title" style={{textAlign:'center'}}>凭直觉，选三张</div>
          <div className="h-sub" style={{textAlign:'center',marginTop:5}}>净手 · 深呼吸 · 在心里想一个问题</div>
          <div className="grid3" style={{marginTop:8}}>
            {BACKS.map((b,i)=>
              <div key={i} className="s-rot" style={{transform:`rotate(${b.r}deg)`}} data-i={i}>
                <div className={"s-card"+(sel.includes(i)?' sel':'')} onClick={()=>toggle(i)}>
                  <Art src={ASSETS.back} alt="金线月星纹牌背" className="cardimg" ph="牌背"/>
                  <div className="frame"/>
                </div>
              </div>)}
          </div>
          <div className="counter" style={{marginTop:5}}>
            {Array.from({length:9}).map((_,k)=>
              <span key={k} className={"cdot"+(k<sel.length?' on':'')}/>)}
            <span className="cnum">已选 <span className="num">{sel.length}</span>/<span className="num">3</span></span>
          </div>
          <div className={"btn btn-primary"+(sel.length===3?'':' btn-off')} style={{marginTop:6}} onClick={()=>sel.length===3&&show('牌面正在翻开 · 三张牌已经苏醒')}>翻开牌面</div>
        </div>
        {sparks.map(s=>
          <span key={s.id} className="spark" style={{left:s.x,top:s.y,'--dx':`${s.dx}px`,'--dy':`${s.dy}px`,animationDelay:`${s.del}s`}}>
            <Spark s={0.7} fill="#C9A97C" op={0.9}/>
          </span>)}
        {toast&&<div className="toast">{toast}</div>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   === 03 · 读牌中 === 真实双图翻牌（牌背 → 星币王牌）
   scaleX 双半程方案（无 preserve-3d · headless 兼容）
   ═══════════════════════════════════════════════════════════ */
function ScreenReading(){
  const stars=[
    {x:60,y:70,d:0,dur:3.8},{x:150,y:58,d:1.2,dur:4.2},{x:238,y:118,d:.6,dur:4},
  ];
  return (
    <div className="sys-e3">
      <div className="screen" style={{width:300,height:640,borderRadius:34,boxShadow:'0 30px 60px rgba(0,0,0,.55)'}} data-screen-label="s3-reading">
        <WxCapsule/>
        <BackArrow/>
        <div className="wash" style={{width:220,height:220,left:40,top:180,background:'#E8C4BE',opacity:.3}}/>
        <div className="wash" style={{width:200,height:200,right:-40,top:300,background:'#C9A97C',opacity:.14}}/>
        {stars.map((s,i)=>
          <span key={i} className="fallstar" style={{left:s.x,top:s.y,'--del':`${s.d}s`,'--dur':`${s.dur}s`}}>
            <Spark s={0.6} fill="#C9A97C" op={0.5}/>
          </span>)}
        <div className="reading-head">
          <div className="quote">月亮正在为你落笔…</div>
          <div className="quote-sub">三张牌正在醒来，稍等片刻</div>
        </div>
        <div className="flip-row">
          <div className="flip-card">
            <div className="flip-inner">
              {/* 牌背：真实金线月星纹 */}
              <div className="flip-face">
                <Art src={ASSETS.back} alt="金线月星纹牌背" ph="牌背"/>
              </div>
              {/* 牌面：真实星币王牌水彩（读牌中途显现） */}
              <div className="flip-face flip-front">
                <Art src={ASSETS.pentacle} alt="星币王牌水彩插画" ph="星币王牌"/>
              </div>
            </div>
          </div>
        </div>
        <div className="progress">
          <div className="p-track"><div className="p-fill"/></div>
          <div className="p-dots"><i/><i/><i/></div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   === 04 · 解读 === 真实星币王牌大牌面 + 衬线解读文
   ═══════════════════════════════════════════════════════════ */
const CHIPS=[
  {k:'love',t:'感情',line:'今天适合主动说一句想说的话，哪怕很小声。'},
  {k:'work',t:'事业',line:'先完成最小的一步，余下的交给时间。'},
  {k:'self',t:'内心觉察',line:'允许自己暂时不完美，你已经很努力了。'},
];
function ScreenReveal(){
  const [chip,setChip]=useState('love');
  const [toast,setToast]=useState('');
  const show=(t)=>{setToast(t);setTimeout(()=>setToast(''),1900);};
  const cur=CHIPS.find(c=>c.k===chip);
  return (
    <div className="sys-e3">
      <div className="screen" style={{width:300,height:640,borderRadius:34,boxShadow:'0 30px 60px rgba(0,0,0,.55)'}} data-screen-label="s4-reveal">
        <WxCapsule/>
        <BackArrow onClick={()=>show('牌面已收好 · 随时可以再翻开')}/>
        <div className="wash" style={{width:190,height:190,right:-60,top:-40,background:'#E8C4BE',opacity:.26}}/>
        <div className="wash" style={{width:170,height:170,left:-70,bottom:-50,background:'#C9A97C',opacity:.14}}/>
        <div className="pad">
          <div className="rv-head">
            <div className="pill pill-lav" style={{display:'inline-flex'}}>今日指引 · 8月7日</div>
            <div className="rv-title">星币王牌</div>
            <div className="rv-sub">新的开始，正在土壤里发芽</div>
          </div>
          <div className="rv-art art">
            <Art src={ASSETS.pentacle} alt="星币王牌水彩插画" ph="星币王牌"/>
          </div>
          <div className="rv-text">
            <p>星币王牌今日降临——<em>新的可能正在土壤里发芽</em>。你不必急着收获，允许一切慢慢生长。</p>
          </div>
          <div className="chips" style={{marginTop:8}}>
            {CHIPS.map(c=>
              <div key={c.k} className={"chip"+(chip===c.k?' on':'')}
                style={chip===c.k?{borderColor:'rgba(201,169,124,.55)'}:{borderColor:'rgba(201,169,124,.35)'}}
                onClick={()=>setChip(c.k)}>
                {c.t}
              </div>)}
          </div>
          <div className="chip-line" style={{marginTop:6}}>{cur.line}</div>
          <div className="btns" style={{marginTop:8}}>
            <div className="btn btn-ghost w108" onClick={()=>show('卡片已存好，去朋友圈晒晒吧')}>存为卡片</div>
            <div className="btn btn-primary flex1" onClick={()=>show('星塔罗师正在赶来 · 稍等片刻')}>与星塔罗师聊聊</div>
          </div>
          <div className="hint-line" style={{marginTop:4}}>每张牌都是温柔的提醒，不是审判</div>
        </div>
        {toast&&<div className="toast">{toast}</div>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   === 05 · 星光树洞 === AI 头像用真实月亮插画裁圆
   ═══════════════════════════════════════════════════════════ */
const CURATED=[
  '听见了。星币王牌想告诉你：种子破土前，都有一段安静的等待。今天不必赶路，先把眼前的小事做好，好不好？',
  '嗯，我懂那种闷闷的感觉。月亮牌说：夜晚是用来休息的，不是用来较劲的。喝杯温水，早点睡，明天又是新的土壤。',
  '温柔地抱抱你。牌面里那株小芽正在生长，它不着急，你也不用。想把哪件事先放一放？我陪你一起想。',
];
function ScreenChat(){
  const [msgs,setMsgs]=useState([
    {from:'ai',text:'晚上好，我是星塔罗师小满。今晚月色温柔，你抽到的星币王牌告诉我——你心里正有一粒想发芽的种子。愿意和我说说吗？'},
    {from:'me',text:'我今天有点焦虑，总觉得事情进展得太慢了…'},
  ]);
  const [typing,setTyping]=useState(false);
  const [input,setInput]=useState('');
  const idx=useRef(0);
  const send=()=>{
    const v=input.trim();
    if(!v)return;
    setMsgs(m=>[...m,{from:'me',text:v}]);
    setInput('');
    setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      const reply=CURATED[idx.current%CURATED.length];
      idx.current++;
      setMsgs(m=>[...m,{from:'ai',text:reply}]);
    },1500);
  };
  return (
    <div className="sys-e3">
      <div className="screen" style={{width:300,height:640,borderRadius:34,boxShadow:'0 30px 60px rgba(0,0,0,.55)'}} data-screen-label="s5-chat">
        <WxCapsule/>
        <BackArrow/>
        <div className="wash" style={{width:200,height:200,right:-70,top:-50,background:'#E8C4BE',opacity:.26}}/>
        <div className="wash" style={{width:180,height:180,left:-70,top:380,background:'#D8D2E4',opacity:.22}}/>
        <div className="chat-head">
          <div className="chat-title">星光树洞</div>
          <div className="chat-sub"><span className="online-dot"/>星塔罗师 · 在线</div>
        </div>
        <div className="chat-body">
          <div className="chat-date">AUG 7 · 夜</div>
          {msgs.map((m,i)=>
            <div key={i} className={"row"+(m.from==='me'?' me':'')}>
              {m.from==='ai'&&<div className="avatar"><Art src={ASSETS.moon} alt="月亮水彩头像" ph="月"/></div>}
              <div className={m.from==='me'?'bub-me':'bub-ai'}>{m.text}</div>
            </div>)}
          {typing&&
            <div className="row">
              <div className="avatar"><Art src={ASSETS.moon} alt="月亮水彩头像" ph="月"/></div>
              <div className="bub-ai typing"><i/><i/><i/></div>
            </div>}
        </div>
        <div className="chat-input">
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send();}} placeholder="和月亮说点悄悄话…"/>
          <div className="sendbtn" onClick={send}>
            <svg width="17" height="17" viewBox="0 0 20 20">
              <path d="M3 3.5 17 10 3 16.5 5.6 10 Z" fill="#5C4A3A"/>
              <path d="M5.6 10H17" stroke="#5C4A3A" strokeWidth="1.1"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── 自检（渲染后测量每屏内容是否超出 640 高 + 真实插画是否加载成功） ── */
function App(){
  const hm=(location.hash||'').match(/^#(d?)([1-6])$/);
  const demo=!!hm&&hm[1]==='d';
  const want=hm?parseInt(hm[2],10):0;
  useEffect(()=>{
    if(!demo)return;
    const t=setTimeout(()=>{
      document.querySelectorAll('.s-card').forEach((el,i)=>{if(i<3)setTimeout(()=>el.click(),i*150);});
      const input=document.querySelector('input');
      if(input){
        const setter=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
        setter.call(input,'今天有点累，但我会慢慢来的。');
        input.dispatchEvent(new Event('input',{bubbles:true}));
        setTimeout(()=>{
          const sb=document.querySelector('.sendbtn');
          if(sb)sb.click();
        },200);
      }
    },1000);
    return ()=>clearTimeout(t);
  },[]);
  useEffect(()=>{
    const audit=()=>{
      const res=[];
      document.querySelectorAll('[data-screen-label]').forEach(el=>{
        const sr=el.getBoundingClientRect();
        let maxB=0;
        el.querySelectorAll('*').forEach(n=>{
          const st=getComputedStyle(n);
          if(st.position==='static'||st.position==='relative'){
            const r=n.getBoundingClientRect();
            if(r.bottom-sr.top>maxB)maxB=r.bottom-sr.top;
          }
        });
        res.push(el.getAttribute('data-screen-label')+':flowB='+Math.round(maxB)+'/'+el.clientHeight);
      });
      const imgs=[...document.querySelectorAll('img')];
      const imgInfo=imgs.map(i=>{
        const ok=i.complete?(i.naturalWidth>0?'OK':'X'):'...';
        return (i.getAttribute('src')||'').split('/').pop()+':'+ok;
      }).join(',');
      const box=document.getElementById('check-result');
      if(box)box.textContent='CHECK|'+res.join('|')+'|imgs('+imgInfo+')|fontHand:'+document.fonts.check('16px "Ma Shan Zheng"')+'|fontSerif:'+document.fonts.check('16px "Noto Serif SC"');
    };
    const t=setTimeout(audit,900);
    const t2=setTimeout(audit,2600);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(audit,500));
    return ()=>{clearTimeout(t);clearTimeout(t2);};
  },[]);
  const screens=[<ScreenToday/>,<ScreenShuffle/>,<ScreenReading/>,<ScreenReveal/>,<ScreenChat/>,<ScreenPoster/>];
  return (
    <div>
      <div id="check-result" style={{display:'none'}}/>
      {want>=1&&want<=6
        ? <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#29231E',padding:'26px'}}>{screens[want-1]}</div>
        : <Stage/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
